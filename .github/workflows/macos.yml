name: macOS

# macOS on every push to master (round 30, ADR 0066): the repository is public, so GitHub's
# macOS runners cost nothing. `macos-latest` is Apple silicon.
#   - test: the same checks as ci.yml's test job — clippy, the whole suite (the plug-in
#     sandbox, the Cocoa editor windows' tests, the CoreAudio and workgroup tests, the
#     macOS keymap and menu bar), the engine's schedule fuzz and the voice forks' — plus
#     clippy for Intel Macs (x86_64-apple-darwin), the other half of the universal binary.
#   - dmg: packaging/macos/build-dmg.sh, ad-hoc signed (no secrets here; release.yml signs
#     and notarises), and a look at what it made: both architectures in every program,
#     the bundle's signature and entitlements, its Info.plist, the program starting.
# By hand too: Actions > macOS > Run workflow (or `gh workflow run macos.yml --ref <branch>`).

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    # Runs in luis314159/cantus-daw only (round 29: the public repository builds, tests and releases; the private one deploys the site).
    if: github.repository == 'luis314159/cantus-daw'
    name: test (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Rust (the pinned toolchain, and Intel's target)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo clippy --workspace --all-targets
      - name: clippy for Intel Macs
        run: cargo clippy --workspace --all-targets --target x86_64-apple-darwin
      # The whole suite, then what failed again up to twice (a virtual machine's timers and
      # disk miss timing tests now and then): the job fails only on a test that fails three
      # times, and prints "FLAKY on macOS VM:" for what needed a retry.
      - name: cargo test (failed binaries retried twice)
        shell: bash
        run: tools/ci/retry-failed.sh
      - name: engine on the pool, schedule fuzz
        run: cargo test -p cantus-engine --features fuzz
        env:
          CANTUS_WORKERS: "3"
      - name: voice forks, stalls inside the protocol
        run: cargo test -p cantus-rt --features fuzz --test fork

  dmg:
    if: github.repository == 'luis314159/cantus-daw'
    name: Cantus.app in a .dmg (ad hoc)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Rust (the pinned toolchain, both Mac targets)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: build-dmg.sh
        shell: bash
        run: |
          version="$(cargo run --quiet -p xtask -- version)"
          packaging/macos/build-dmg.sh "$version" target/dmg-out
      - name: what is in it
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(ls target/dmg-out/Cantus-*-macos-universal.dmg)"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          app="$mnt/Cantus.app"
          for b in cantus cantus-scan cantus-sandbox; do
            archs="$(lipo -archs "$app/Contents/MacOS/$b")"
            echo "$b: $archs"
            [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || { echo "::error::$b is not universal"; exit 1; }
          done
          codesign --verify --strict --verbose=2 "$app"
          codesign -d --entitlements - "$app" 2>&1 | grep -q disable-library-validation
          plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist" | grep -qx com.cantusdaw.Cantus
          plutil -extract NSMicrophoneUsageDescription raw "$app/Contents/Info.plist"
          test -f "$app/Contents/Resources/Cantus.icns"
          test -f "$app/Contents/Resources/es.lproj/InfoPlist.strings"
          test -f "$app/Contents/Resources/manual/en/index.html"
          # The program starts and answers (--version prints and exits, no window).
          "$app/Contents/MacOS/cantus" --version
          hdiutil detach "$mnt"
      - uses: actions/upload-artifact@v4
        with:
          name: cantus-macos-dmg
          path: target/dmg-out/*.dmg
          retention-days: 14
