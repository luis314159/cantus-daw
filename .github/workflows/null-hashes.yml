name: Null hashes

# The x86-64-v3 program and its x86-64-v2 fallback must make the same sound (ADR 0031
# §5.3, round 22): `xtask null-hashes` builds the null corpus (every math function,
# effect, instrument, demo song and project fixture; cantus-bench/src/hashes.rs) at v2,
# v3 and the plain x86-64 baseline the tests' goldens come from (v4 too on a runner with
# AVX-512), hashes each render, and fails naming any item whose bits differ. And the same
# bits on both operating systems (R9 (4): another C runtime, another machine class).
#
# It builds cantus-bench three times per system, so it runs only when what the corpus
# renders can change (ADR 0048 §3): the DSP and engine crates, the bench, the demo songs
# and the factory presets they load, the project fixtures, the toolchain and the lock
# file — or by hand (Actions > Null hashes > Run workflow).

on:
  push:
    branches: [master, main]
    paths:
      - "crates/cantus-core/**"
      - "crates/cantus-dsp/**"
      - "crates/cantus-engine/**"
      - "crates/cantus-project/**"
      - "crates/cantus-rt/**"
      - "crates/cantus-launch/**"
      - "crates/cantus-bench/**"
      - "crates/cantus-ui/src/demos/**"
      - "crates/cantus-ui/src/views/fx/**"
      - "crates/cantus-ui/src/views/inst/**"
      - "xtask/src/null_hashes.rs"
      - "xtask/src/levels.rs"
      - "xtask/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/null-hashes.yml"
  pull_request:
    paths:
      - "crates/cantus-core/**"
      - "crates/cantus-dsp/**"
      - "crates/cantus-engine/**"
      - "crates/cantus-project/**"
      - "crates/cantus-rt/**"
      - "crates/cantus-launch/**"
      - "crates/cantus-bench/**"
      - "crates/cantus-ui/src/demos/**"
      - "crates/cantus-ui/src/views/fx/**"
      - "crates/cantus-ui/src/views/inst/**"
      - "xtask/src/null_hashes.rs"
      - "xtask/src/levels.rs"
      - "xtask/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/null-hashes.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: "0"
  # Debug info changes no generated code (the hashes are of rendered samples).
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  null-hashes:
    # Runs in luis314159/cantus-daw only (round 29: the public repository builds, tests and releases; the private one deploys the site).
    if: github.repository == 'luis314159/cantus-daw'
    name: null hashes v2 = v3 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Rust (the pinned toolchain)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Linux audio/window deps
        if: runner.os == 'Linux'
        run: bash packaging/linux/deps.sh
      - run: cargo run -p xtask -- null-hashes --baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: null-hashes-${{ runner.os }}
          path: target/null-hashes/

  # The v3 lists of the two runners, line for line.
  across:
    name: null hashes, Windows = Linux
    needs: null-hashes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: null-hashes-Windows
          path: windows
      - uses: actions/download-artifact@v4
        with:
          name: null-hashes-Linux
          path: linux
      - name: Compare
        run: diff <(grep -v '^#' windows/x86-64-v3.txt) <(grep -v '^#' linux/x86-64-v3.txt)
