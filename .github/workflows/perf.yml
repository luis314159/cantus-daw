name: Perf

# The performance gate (docs/perf/benchmark.md §6): the quick suite against
# perf/baselines/<class>.json. Hosted runners vary by tens of percent, so this job reports
# and does not fail until a baseline for its class has been gathered over enough runs to
# know its spread; then drop `continue-on-error` and give it a trigger again.
#
# Because it never fails, it no longer runs on every push (it cost a Windows build of the
# bench, x2, for a report nobody gated on — ADR 0048 §5): run it by hand (Actions > Perf >
# Run workflow) when gathering that baseline or after a performance change.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  perf:
    # Runs in luis314159/cantus-daw only (round 29: the public repository builds, tests and releases; the private one deploys the site).
    if: github.repository == 'luis314159/cantus-daw'
    name: perf (quick suite)
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    env:
      CANTUS_PERF_CLASS: gha-windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust (the pinned toolchain)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report
          path: target/perf/latest.json
