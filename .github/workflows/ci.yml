name: CI

# What runs on every push and pull request (ADR 0048, the CI budget): Linux and Windows,
# fmt, clippy, the whole test suite and the engine's schedule fuzz. Every minute counts
# while the repository is private (Linux x1, Windows x2, macOS x10 against the plan's
# quota), so the expensive and rarely-changing checks live in their own workflows:
#   macos.yml        macOS (Apple silicon): weekly when code changed, or by hand
#   null-hashes.yml  v2 = v3 = baseline, Windows = Linux: when the DSP/engine side changes
#   audit.yml        cargo audit: when the dependencies change, and weekly
#   perf.yml         the quick performance suite (reports, never fails): by hand
#   windows-release.yml  the app and launcher in release on Windows: when they change
#
# A commit that changes only documents runs nothing. "Only documents" is the root's *.md
# (README, CLAUDE, CLA…), docs/, research/, tools/ and web/ (the site has site.yml);
# Markdown anywhere else (crates/, xtask/notices/head.md…) is treated as code — EXCEPT
# the files a test reads, which still trigger: the manual (xtask builds it and checks its
# pictures and links), THIRD-PARTY-NOTICES.md (the notices check), PRIVACY.md (About's
# links), the site's top.rs (the download link's name test) and release.yml (the ASIO
# hash and the installer name tests). `paths` with `!` patterns is used instead of `paths-ignore`
# because only `paths` can re-include a file after excluding its folder; later patterns
# win. The two lists below are the same; xtask's `ci_paths` test keeps them equal and
# checks that every document a test reads is re-included (ADR 0048 §2).

on:
  push:
    branches: [master, main]
    paths:
      - "**"
      - "!*.md"
      - "!docs/**"
      - "!research/**"
      - "!tools/**"
      - "!web/**"
      - "!.github/**"
      - "docs/manual/**"
      - "THIRD-PARTY-NOTICES.md"
      - "PRIVACY.md"
      - "web/src/top.rs"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "**"
      - "!*.md"
      - "!docs/**"
      - "!research/**"
      - "!tools/**"
      - "!web/**"
      - "!.github/**"
      - "docs/manual/**"
      - "THIRD-PARTY-NOTICES.md"
      - "PRIVACY.md"
      - "web/src/top.rs"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

# A new push to the same branch (or PR) cancels the run still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # 200+ test binaries with full debug info filled the Ubuntu runner's disk (the linker
  # died with a bus error): no debug info in dev/test builds, as on the owner's machine;
  # nor in the release check build (debug info changes no generated code, only link time
  # and the cache's size).
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    # Runs in luis314159/cantus-daw only (round 29: the public repository builds, tests and releases; the private one deploys the site).
    if: github.repository == 'luis314159/cantus-daw'
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung test would otherwise bill up to six hours (x2 on Windows).
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler (and clippy, rustfmt): install exactly that
      # one, rather than a "stable" the pin would never use.
      - name: Rust (the pinned toolchain)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests read master's cache but do not write their own: the 10 GB
          # cache budget stays with the branch every run starts from.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # ALSA, PipeWire (and clang for its bindings), X11/Wayland, Xvfb (ADR 0065).
      - name: Linux audio/window deps
        if: runner.os == 'Linux'
        run: bash packaging/linux/deps.sh
      # Formatting does not depend on the system: once, on the cheaper runner.
      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      # On Linux under Xvfb: the plug-in editor windows' tests need an X server (ADR 0065).
      - name: test
        shell: bash
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}cargo test --workspace
      # The engine on a three-worker pool with the schedule fuzz's stalls (ADR 0031 R13,
      # round 22; ADR 0038's forked voices): every test binary of the engine, parallel =
      # serial to the bit, with stalls inside the voice forks too.
      - name: engine on the pool, schedule fuzz
        run: cargo test -p cantus-engine --features fuzz
        env:
          CANTUS_WORKERS: "3"
      # The fork protocol with threads stalled inside its windows (ADR 0038 §4).
      - name: voice forks, stalls inside the protocol
        run: cargo test -p cantus-rt --features fuzz --test fork
      # The release profile compiles and links, on the cheaper runner. What differs on
      # Windows in release (`windows_subsystem` in cantus-app and cantus-launch,
      # `cfg!(debug_assertions)` branches) is built by windows-release.yml when that code
      # changes, and by release.yml at every tag.
      - name: release build
        if: runner.os == 'Linux'
        run: cargo build --release -p cantus

  # The AppImage's packaging on the system it is built on for releases (Ubuntu 22.04, with
  # PipeWire 1.0's headers over its 0.3.48 library — packaging/linux/deps.sh): the program
  # links against 22.04's libraries and the image starts, with and without libpipewire.
  # Quick mode (one program, no plug-ins); release.yml builds the full one at each tag.
  appimage:
    if: github.repository == 'luis314159/cantus-daw' && github.event_name != 'pull_request'
    name: appimage (ubuntu-22.04, quick)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust (the pinned toolchain)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: bash packaging/linux/deps.sh
      - run: cargo build --release -p cantus -p cantus-launch -p cantus-host -p cantus-sandbox --bins
      - name: AppImage
        env:
          CANTUS_APPIMAGE_QUICK: "1"
        run: bash packaging/linux/build-appimage.sh 0.0.0-ci target/appimage-out
      # Without libpipewire: the stand-in in usr/lib/fallback lets it start.
      - name: starts without libpipewire
        run: bash packaging/linux/test-fallback.sh target/appimage-out/Cantus-0.0.0-ci-linux-x86_64.AppImage

  # The Flatpak manifest builds (ADR 0065; Flathub's submission is the owner's). By hand
  # (Actions ▸ CI ▸ Run workflow): it builds the whole program inside the SDK, ~40 min.
  # cargo-sources.json (every crate of Cargo.lock, for an offline build) is generated here
  # by flatpak-builder-tools' generator, pinned.
  flatpak:
    if: github.repository == 'luis314159/cantus-daw' && github.event_name == 'workflow_dispatch'
    name: flatpak (the manifest builds)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: cargo sources
        run: |
          python3 -m pip install --break-system-packages aiohttp tomlkit pyyaml \
            || python3 -m pip install aiohttp tomlkit pyyaml
          curl -fsSLo /tmp/flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/41c20aa10819cdb2a4f3ca171758a96d1955c018/cargo/flatpak-cargo-generator.py
          python3 /tmp/flatpak-cargo-generator.py Cargo.lock -o packaging/linux/flatpak/cargo-sources.json
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Cantus.flatpak
          manifest-path: packaging/linux/flatpak/com.cantusdaw.Cantus.yml
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock') }}
