name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux audio/window deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libgtk-3-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo build --release -p cantus

  # The performance gate (docs/perf/benchmark.md §6): the quick suite against
  # perf/baselines/<class>.json. Hosted runners vary by tens of percent, so this job
  # reports and does not fail until a baseline for its class has been gathered over
  # enough runs to know its spread; then drop `continue-on-error`.
  perf:
    name: perf (quick suite)
    runs-on: windows-latest
    continue-on-error: true
    env:
      CANTUS_PERF_CLASS: gha-windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report
          path: target/perf/latest.json

  audit:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
