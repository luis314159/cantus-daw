name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # 200+ test binaries with full debug info filled the Ubuntu runner's disk (the linker
  # died with a bus error): no debug info in dev/test builds, as on the owner's machine.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux audio/window deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libgtk-3-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # The engine on a three-worker pool with the schedule fuzz's stalls (ADR 0031 R13,
      # round 22; ADR 0038's forked voices): every test binary of the engine, parallel =
      # serial to the bit, with stalls inside the voice forks too.
      - name: engine on the pool, schedule fuzz
        run: cargo test -p cantus-engine --features fuzz
        env:
          CANTUS_WORKERS: "3"
      # The fork protocol with threads stalled inside its windows (ADR 0038 §4).
      - name: voice forks, stalls inside the protocol
        run: cargo test -p cantus-rt --features fuzz --test fork
      - run: cargo build --release -p cantus

  # The performance gate (docs/perf/benchmark.md §6): the quick suite against
  # perf/baselines/<class>.json. Hosted runners vary by tens of percent, so this job
  # reports and does not fail until a baseline for its class has been gathered over
  # enough runs to know its spread; then drop `continue-on-error`.
  perf:
    name: perf (quick suite)
    runs-on: windows-latest
    continue-on-error: true
    env:
      CANTUS_PERF_CLASS: gha-windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-report
          path: target/perf/latest.json

  # The x86-64-v3 program and its x86-64-v2 fallback must make the same sound (ADR 0031
  # §5.3, round 22): `xtask null-hashes` builds the null corpus (every math function,
  # effect, instrument, demo song and project fixture; cantus-bench/src/hashes.rs) at v2,
  # v3 and the plain x86-64 baseline the tests' goldens come from (v4 too on a runner with
  # AVX-512), hashes each render, and fails naming any item whose bits differ.
  null-hashes:
    name: null hashes v2 = v3 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux audio/window deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libgtk-3-dev
      - run: cargo run -p xtask -- null-hashes --baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: null-hashes-${{ runner.os }}
          path: target/null-hashes/

  # And the same bits on both operating systems (R9 (4): another C runtime, another
  # machine class): the v3 lists of the two runners, line for line.
  null-hashes-across:
    name: null hashes, Windows = Linux
    needs: null-hashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: null-hashes-Windows
          path: windows
      - uses: actions/download-artifact@v4
        with:
          name: null-hashes-Linux
          path: linux
      - name: Compare
        run: diff <(grep -v '^#' windows/x86-64-v3.txt) <(grep -v '^#' linux/x86-64-v3.txt)

  audit:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
