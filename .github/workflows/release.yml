# Builds, tests and publishes a release of Cantus for Windows, Linux and macOS (ADR 0032;
# three systems since round 30, ADR 0067): each system's job tests the workspace on that
# system first, then builds its file — the NSIS installer (`xtask package`), the AppImage
# (`packaging/linux/build-appimage.sh`, on Ubuntu 22.04 so its glibc floor is old enough)
# and the universal disk image (`packaging/macos/build-dmg.sh`) — and one job publishes
# them all, with one SHA256SUMS.txt.
#
# Runs when the owner pushes a version tag (`git tag v0.2.0 && git push origin v0.2.0`);
# the tag must equal the workspace version in Cargo.toml. Run by hand (Actions → Release
# → Run workflow) it builds the files and keeps them as an artifact, publishing nothing.
#
# Signing is optional and needs no change here, only secrets/variables in the repository:
#   PFX:   secrets.CANTUS_SIGN_PFX_BASE64, secrets.CANTUS_SIGN_PFX_PASSWORD,
#          vars.CANTUS_PUBLISHER (the certificate's common name)
#   Azure Trusted Signing: vars.AZURE_SIGNING_ENDPOINT, vars.AZURE_SIGNING_ACCOUNT,
#          vars.AZURE_SIGNING_PROFILE, vars.CANTUS_PUBLISHER, and secrets.AZURE_CLIENT_ID,
#          secrets.AZURE_CLIENT_SECRET, secrets.AZURE_TENANT_ID
# Without them the release is unsigned and the app verifies updates by SHA-256 only.
# See docs/round20/signing.md. SignPath Foundation (free for open source) needs a different,
# two-request flow — drafted, inert, in docs/signing/signpath-release.draft.yml (ADR 0048 §8).
#
# macOS signing and notarisation need no change here either, only these secrets (absent,
# the disk image is ad-hoc signed and Gatekeeper asks the user to allow it once):
#   APPLE_CERT_P12_BASE64 (the "Developer ID Application" certificate and key, base64),
#   APPLE_CERT_PASSWORD (its password), APPLE_TEAM_ID, APPLE_ID (the Apple account's
#   e-mail) and APPLE_APP_PASSWORD (an app-specific password for notarytool).
#
# Every file is published twice: versioned (what the app's updater asks for) and under a
# stable name the website links through releases/latest/download/ (ADR 0048 §7):
# Cantus-windows-x64-setup.exe, Cantus-linux-x86_64.AppImage, Cantus-macos-universal.dmg.

name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # NSIS 3.11, portable; SHA-256 as SourceForge lists it.
  NSIS_URL: https://downloads.sourceforge.net/project/nsis/NSIS%203/3.11/nsis-3.11.zip
  NSIS_SHA256: c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1
  # The Steinberg ASIO SDK 2.3.4 (GPL-3-compatible). Every release has ASIO next to WASAPI
  # (one edition, ADR 0025 §10): `xtask asio-sdk` fetches this zip into
  # %LOCALAPPDATA%\cantus-build-tools and refuses it unless its SHA-256 is this one (pinned
  # in xtask/src/asio_sdk.rs too; a test keeps the two equal). LLVM is on the runner.
  ASIO_URL: https://download.steinberg.net/sdk_downloads/ASIO-SDK_2.3.4_2025-10-15.zip
  ASIO_SHA256: d5ebf0c20dd2c5f43771fd0c1418f4b361bf52434ee670097cfa6b3a335e2eca

jobs:
  test:
    # Runs in luis314159/cantus-daw only (round 29: the public repository builds, tests and releases; the private one deploys the site).
    if: github.repository == 'luis314159/cantus-daw'
    runs-on: windows-latest
    # As in ci.yml: a hung test would otherwise bill up to six hours, and 360 test binaries
    # with full debug info can fill a runner's disk.
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The SDK first, so the workspace is built and tested with ASIO as it ships.
      - run: cargo run -p xtask -- asio-sdk
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings
      - run: cargo test --workspace

  package:
    needs: test
    runs-on: windows-latest
    env:
      CANTUS_PUBLISHER: ${{ vars.CANTUS_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: The tag is the workspace's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(cargo run -q -p xtask -- version)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1
          fi

      - name: NSIS (portable, verified)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\nsis.zip"
          Invoke-WebRequest $env:NSIS_URL -OutFile $zip -UserAgent "Wget"
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:NSIS_SHA256) { throw "NSIS zip hash $h" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          "CANTUS_MAKENSIS=$env:RUNNER_TEMP\nsis-3.11\makensis.exe" >> $env:GITHUB_ENV

      - name: ASIO SDK (verified against the pinned SHA-256)
        run: cargo run -p xtask -- asio-sdk

      - name: Signing with a PFX (when its secret exists)
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.CANTUS_SIGN_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CANTUS_SIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) { "No PFX secret: unsigned unless Azure is set."; exit 0 }
          $pfx = "$env:RUNNER_TEMP\sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
          "CANTUS_SIGN=pfx" >> $env:GITHUB_ENV
          "CANTUS_SIGN_PFX=$pfx" >> $env:GITHUB_ENV
          "CANTUS_SIGN_PFX_PASSWORD=$env:PFX_PASSWORD" >> $env:GITHUB_ENV
          "SIGN_FLAG=--sign" >> $env:GITHUB_ENV

      - name: Signing with Azure Trusted Signing (when it is set up)
        if: vars.AZURE_SIGNING_ACCOUNT != ''
        shell: pwsh
        env:
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          nuget install Microsoft.Trusted.Signing.Client -OutputDirectory "$env:RUNNER_TEMP\tsc" -NonInteractive
          $dlib = Get-ChildItem "$env:RUNNER_TEMP\tsc" -Recurse -Filter Azure.CodeSigning.Dlib.dll |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          $meta = "$env:RUNNER_TEMP\metadata.json"
          @{ Endpoint = $env:ENDPOINT; CodeSigningAccountName = $env:ACCOUNT; CertificateProfileName = $env:PROFILE } |
            ConvertTo-Json | Set-Content $meta
          "CANTUS_SIGN=azure" >> $env:GITHUB_ENV
          "CANTUS_SIGN_AZURE_DLIB=$($dlib.FullName)" >> $env:GITHUB_ENV
          "CANTUS_SIGN_AZURE_METADATA=$meta" >> $env:GITHUB_ENV
          "SIGN_FLAG=--sign" >> $env:GITHUB_ENV

      - name: Package (one edition, ASIO and WASAPI; the x86-64-v3 and v2 programs and the launcher)
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: cargo run -p xtask -- package $SIGN_FLAG

      - name: Forget the certificate file
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\sign.pfx" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: cantus-windows
          path: target/package/dist/
          if-no-files-found: error

  linux:
    # Runs in luis314159/cantus-daw only (round 29: the public repository builds, tests and releases; the private one deploys the site).
    if: github.repository == 'luis314159/cantus-daw'
    name: linux (AppImage)
    # 22.04, not latest: an AppImage runs on systems at least as new as the one it was
    # built on (its glibc), so the oldest supported LTS builds it (ADR 0067 §1).
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Rust (the pinned toolchain)
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The packages ci.yml's Linux job installs, by the same script (an xtask test keeps
      # them one): on 22.04 it also points pkg-config at PipeWire 1.0.5's headers over the
      # system's 0.3.48 library (ADR 0065). No FUSE 2: the AppImage runtime is static.
      - name: Linux audio/window deps
        run: bash packaging/linux/deps.sh
      - name: The tag is the workspace's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(cargo run -q -p xtask -- version)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1
          fi
      - run: cargo clippy --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings
      - run: cargo test --workspace
      - name: Build (the app, the plug-in scanner, the sandbox)
        run: cargo build --release -p cantus -p cantus-host -p cantus-sandbox
      - name: The AppImage
        run: |
          version="$(cargo run -q -p xtask -- version)"
          bash packaging/linux/build-appimage.sh "$version" dist
          test -s "dist/Cantus-$version-linux-x86_64.AppImage"
          # Only the file, versioned and under its stable name (whatever else the script
          # leaves in dist stays out of the release), with their sums.
          mkdir upload
          cp "dist/Cantus-$version-linux-x86_64.AppImage" upload/
          cp "dist/Cantus-$version-linux-x86_64.AppImage" upload/Cantus-linux-x86_64.AppImage
          cd upload && sha256sum -- * > "$RUNNER_TEMP/sums" && mv "$RUNNER_TEMP/sums" SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cantus-linux
          path: upload/
          if-no-files-found: error

  macos:
    # Runs in luis314159/cantus-daw only (round 29: the public repository builds, tests and releases; the private one deploys the site).
    # And only while the repository variable CANTUS_RELEASE_MACOS is `true`: 0.1.0-beta.4
    # shipped Windows and Linux, the Mac waiting for its suite to be green on the runner and
    # a session on a real Mac (the owner, 2026-10-23; docs/mac-session.md). Set it to `true`
    # (Settings > Secrets and variables > Actions > Variables) and the next tag has three.
    if: github.repository == 'luis314159/cantus-daw' && vars.CANTUS_RELEASE_MACOS == 'true'
    name: macos (disk image)
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Rust (the pinned toolchain, both Mac architectures)
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: The tag is the workspace's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(cargo run -q -p xtask -- version)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1
          fi
      - run: cargo clippy --workspace --all-targets
        env:
          RUSTFLAGS: -D warnings
      - run: cargo test --workspace
      # build-dmg.sh builds both architectures, lipos them, makes Cantus.app, and signs
      # with the hardened runtime and notarises only when every secret below is set;
      # otherwise it signs ad hoc (the round-30 contract, docs/round30/BUILDING.md).
      - name: The disk image
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          version="$(cargo run -q -p xtask -- version)"
          bash packaging/macos/build-dmg.sh "$version" dist
          test -s "dist/Cantus-$version-macos-universal.dmg"
          # Only the file, versioned and under its stable name (whatever else the script
          # leaves in dist stays out of the release), with their sums.
          mkdir upload
          cp "dist/Cantus-$version-macos-universal.dmg" upload/
          cp "dist/Cantus-$version-macos-universal.dmg" upload/Cantus-macos-universal.dmg
          cd upload && shasum -a 256 -- * > "$RUNNER_TEMP/sums" && mv "$RUNNER_TEMP/sums" SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cantus-macos
          path: upload/
          if-no-files-found: error

  publish:
    # A release is every system's files or nothing: a job that failed is re-run
    # (Actions → the run → Re-run failed jobs) before anything is published. The Mac's job
    # counts only while CANTUS_RELEASE_MACOS is `true` (then it must succeed).
    needs: [package, linux, macos]
    if: >-
      startsWith(github.ref, 'refs/tags/v') && !cancelled() &&
      needs.package.result == 'success' && needs.linux.result == 'success' &&
      (needs.macos.result == 'success' ||
       (vars.CANTUS_RELEASE_MACOS != 'true' && needs.macos.result == 'skipped'))
    env:
      MACOS: ${{ vars.CANTUS_RELEASE_MACOS == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cantus-windows
          path: parts/windows
      - uses: actions/download-artifact@v4
        with:
          name: cantus-linux
          path: parts/linux
      - uses: actions/download-artifact@v4
        if: env.MACOS == 'true'
        with:
          name: cantus-macos
          path: parts/macos
      # Each system's files arrive as its job hashed them; then one SHA256SUMS.txt for the
      # release, `<hex>  <name>` sorted by name (what the app's updater and `sha256sum -c`
      # read).
      - name: Check the sums, and one sums file for the release
        run: |
          systems="windows linux"
          if [ "$MACOS" = true ]; then systems="$systems macos"; fi
          for sys in $systems; do (cd "parts/$sys" && sha256sum -c SHA256SUMS.txt); done
          mkdir dist
          for sys in $systems; do
            for f in parts/$sys/*; do
              name="$(basename "$f")"
              [ "$name" = SHA256SUMS.txt ] && continue
              if [ -e "dist/$name" ]; then echo "two systems publish $name"; exit 1; fi
              cp "$f" "dist/$name"
            done
          done
          (cd dist && sha256sum -- * | LC_ALL=C sort -k2 > "$RUNNER_TEMP/sums" && mv "$RUNNER_TEMP/sums" SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      # The website's buttons link releases/latest/download/<these names> (ADR 0048 §7,
      # ADR 0067; xtask's test keeps the names here, in cantus-update and in web/src/top.rs
      # equal), and the updater asks for the versioned ones.
      - name: Every system's file, versioned and under its stable name
        run: |
          v="${GITHUB_REF_NAME#v}"
          test -s dist/Cantus-windows-x64-setup.exe
          test -s dist/Cantus-linux-x86_64.AppImage
          test -s "dist/Cantus-$v-windows-x64-setup.exe"
          test -s "dist/Cantus-$v-linux-x86_64.AppImage"
          if [ "$MACOS" = true ]; then
            test -s dist/Cantus-macos-universal.dmg
            test -s "dist/Cantus-$v-macos-universal.dmg"
          fi
      # GitHub's "latest" release (what releases/latest/download/... follows) can never be
      # a pre-release. So a beta is published as the latest release while no stable
      # release exists — otherwise the download button would find nothing — and as a
      # pre-release once one does. The app's updater does not read this flag: a stable
      # build refuses any version with a suffix, a beta build reads the release list
      # (ADR 0032 §4).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes="docs/releases/$tag.md"
          args=(--title "Cantus ${tag#v}" --verify-tag)
          if [ -f "$notes" ]; then args+=(--notes-file "$notes"); else args+=(--generate-notes); fi
          # Only "404 Not Found" means there is no latest release yet; any other failure (a
          # network error, rate limit, outage) stops the job rather than guess.
          if latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>"$RUNNER_TEMP/latest.err")"; then
            :
          elif grep -q "HTTP 404" "$RUNNER_TEMP/latest.err"; then
            latest=""
          else
            cat "$RUNNER_TEMP/latest.err"; exit 1
          fi
          case "$latest" in v*|"") ;; *) echo "latest release has an unexpected tag: $latest"; exit 1 ;; esac
          stable_exists=false
          if [ -n "$latest" ] && [ "${latest#*-}" = "$latest" ]; then stable_exists=true; fi
          case "$tag" in
            *-*) if $stable_exists; then args+=(--prerelease); else args+=(--latest); fi ;;
            *) args+=(--latest) ;;
          esac
          gh release create "$tag" dist/* "${args[@]}"
