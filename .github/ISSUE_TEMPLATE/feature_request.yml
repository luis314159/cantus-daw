name: Feature request / Sugerir una función
description: Something Cantus should do, or do better. / Algo que Cantus debería hacer, o hacer mejor.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us about the music you are making and where Cantus got in the way — that matters more than the solution. The beta's [known limitations](https://github.com/luis314159/cantus/blob/master/docs/BETA.md#not-needed-for-the-beta-known-limitations) (warping, MIDI learn, macOS and Linux…) are already planned.
        Cuéntanos qué música haces y dónde te estorbó Cantus — eso importa más que la solución. Las [limitaciones conocidas](https://github.com/luis314159/cantus/blob/master/docs/BETA.md#not-needed-for-the-beta-known-limitations) de la beta (warping, MIDI learn, macOS y Linux…) ya están en el plan.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do? / ¿Qué intentas hacer?
      description: The task and what is hard about it today. / La tarea y qué la hace difícil hoy.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help / Qué ayudaría
      description: How you imagine it — how another DAW does it is welcome too. / Cómo lo imaginas; también sirve cómo lo hace otro DAW.
  - type: dropdown
    id: area
    attributes:
      label: Area / Área
      options:
        - Recording / Grabación
        - Editing (arrangement, piano roll, automation) / Edición (arreglo, piano roll, automatización)
        - Mixing / Mezcla
        - Mastering and export / Masterización y exportación
        - Instruments and effects / Instrumentos y efectos
        - Plug-ins (CLAP/VST3)
        - Audio devices / Dispositivos de audio
        - Interface and workflow / Interfaz y flujo de trabajo
        - Other / Otro
    validations:
      required: true
  - type: dropdown
    id: weight
    attributes:
      label: How much does it matter to you? / ¿Cuánto te importa?
      options:
        - It blocks me / Me bloquea
        - It slows me down / Me frena
        - Nice to have / Estaría bien
