[workspace]
resolver = "2"
members = [
    "crates/cantus-core",
    "crates/cantus-dsp",
    "crates/cantus-rt",
    "crates/cantus-engine",
    "crates/cantus-project",
    "crates/cantus-ai",
    "crates/cantus-host",
    "crates/cantus-content",
    "crates/cantus-export",
    "crates/cantus-test-plugins/clap-gain",
    "crates/cantus-test-plugins/clap-synth",
    "crates/cantus-test-plugins/vst3",
    "crates/cantus-ui",
    "crates/cantus-app",
    # The start-up stub that picks the x86-64-v3 or v2 build (round 22): `cantus.exe` in a release.
    "crates/cantus-launch",
    "crates/cantus-plugins",
    "crates/cantus-update",
    # The benchmark suite (round 20): built on purpose, `cargo run -p xtask -- perf`.
    "crates/cantus-bench",
    "xtask",
]
# The patched cpal and asio-sys (ASIO duplex; see third_party/README.md) are not members.
exclude = ["third_party"]
# `cargo build` and `cargo run` at the root build the DAW only, as before: the exported
# plug-ins (ADR 0020) are built on purpose, with `cargo run -p xtask -- bundle`.
default-members = [
    "crates/cantus-core",
    "crates/cantus-dsp",
    "crates/cantus-rt",
    "crates/cantus-engine",
    "crates/cantus-project",
    "crates/cantus-ai",
    "crates/cantus-host",
    "crates/cantus-content",
    "crates/cantus-export",
    "crates/cantus-ui",
    "crates/cantus-app",
    "crates/cantus-launch",
    "crates/cantus-update",
]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2021"
rust-version = "1.95"
authors = ["Luis Ángel Almazán <https://lalmazan.com>"]
repository = "https://github.com/luis314159/cantus-daw"
homepage = "https://github.com/luis314159/cantus-daw"

[workspace.dependencies]
# The transcendental functions every unit calls (cantus_dsp::math, ADR 0031 R9): pinned
# exactly, because a new libm can round differently, and that is a DSP_VERSION bump.
libm = "=0.2.16"
# Internal crates
cantus-core = { path = "crates/cantus-core" }
cantus-dsp = { path = "crates/cantus-dsp" }
cantus-rt = { path = "crates/cantus-rt", default-features = false }
cantus-engine = { path = "crates/cantus-engine" }
cantus-project = { path = "crates/cantus-project" }
cantus-ai = { path = "crates/cantus-ai" }
cantus-host = { path = "crates/cantus-host" }
cantus-content = { path = "crates/cantus-content" }
cantus-export = { path = "crates/cantus-export" }
cantus-ui = { path = "crates/cantus-ui" }
cantus-update = { path = "crates/cantus-update" }
cantus-launch = { path = "crates/cantus-launch" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# The keymap is TOML, not JSON: it is a file people edit by hand, and it wants comments.
toml = "0.9"

# Real-time communication
rtrb = "0.4"
crossbeam-channel = "0.5"

# Audio I/O + files
cpal = "0.18"
hound = "3.5"
midir = "0.11"

# GUI
# Without egui's default fonts (round 26): Cantus draws with its own IBM Plex faces and
# bundles the one fallback it used, emoji-icon-font (design::font_definitions).
egui = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "wayland", "x11"] }
rfd = "0.15"

# Utilities
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
sha2 = "0.10"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
directories = "6"

# Testing
proptest = "1"
criterion = { version = "0.6", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1

[profile.dev]
opt-level = 1

# DSP and engine must be fast even in debug builds or audio glitches hide real bugs.
[profile.dev.package.cantus-dsp]
opt-level = 3
[profile.dev.package.cantus-engine]
opt-level = 3
[profile.dev.package.libm]
opt-level = 3

# The exported plug-ins (ADR 0020): one codegen unit and whole-program LTO, because a
# plug-in is one small hot loop called from someone else's process, and no unwinding
# across the C ABI of a host.
[profile.plugin]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 0

[profile.bench]
inherits = "release"
debug = true

# cpal 0.18.2 and asio-sys 0.4.0 with Cantus's ASIO fixes (third_party/README.md says
# exactly what changed and why; both Apache-2.0). Drop these lines once upstream has them.
[patch.crates-io]
cpal = { path = "third_party/cpal" }
asio-sys = { path = "third_party/asio-sys" }
