</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3480"><rect width="1600" height="4000" fill="#14191E"/><text x="24" y="44" fill="#E3E8ED" font-size="30" font-weight="500" text-anchor="start">F · Voz — the microphone</text><text x="1576" y="40" fill="#909CA8" font-size="13" font-weight="400" text-anchor="end">Cantus round 40 · the dancer cast for Slate · design only</text><text x="24" y="80" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">A crooner, smooth and showy. Its head is a vintage microphone's capsule — fine grille bars, a gold ring — under</text><text x="24" y="101.75" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">a pork-pie hat with a gold band. It wears the evening: a dinner jacket white at night and black on paper (it</text><text x="24" y="123.5" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">inverts with the theme), a gold bow tie, a vermilion pocket square, spectator shoes, white gloves. A hand to the</text><text x="24" y="145.25" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">heart, then out to the crowd; a finger-snapping slide; signature: Hat tip — a bow, then both arms flung out,</text><text x="24" y="167" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">ta-da.</text><text x="840" y="80" fill="#E3E8ED" font-size="14" font-weight="500" text-anchor="start">Why it fits Slate</text><text x="840" y="104" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Showman cool: the elegant one of the cast, a different energy from the street and the robot.</text><text x="840" y="144" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· The theme inversion is its joke and its legibility: always the strongest value in the room.</text><text x="840" y="184" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· A head of the studio's oldest object, a capsule mic, read at once.</text><text x="840" y="224" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· The humanoid skeleton Síncopa needs, a simpler face.</text><image href="../../../../docs/round39/design/dir-a/window-night-1x.png" x="0" y="270" width="1280" height="720"/><g transform="translate(797,946) scale(196.8)"><ellipse cx="0" cy="0.008" rx="0.2" ry="0.03" fill="#0B0E11" opacity="0.5"/>

ds 1 tall)</text><text x="840" y="3208" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Humanoid, about 7.5 heads; the head a capsule 0.150 × 0.215 with 15 grille bars.</text><text x="840" y="3230" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· A gold ring under the capsule; the mic's body is its neck.</text><text x="840" y="3252" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Hat: brim 0.236 × 0.026, crown 0.150 × 0.060, a gold band; tipped about the brim.</text><text x="840" y="3274" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Jacket: two halves with lapels, inverted with the theme; gold bow tie, vermilion square.</text><text x="840" y="3296" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Spectator shoes (white and black), white gloves.</text><text x="840" y="3318" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Moods: eyes on the grille; Hat tip lifts and turns the hat 22°.</text><text x="840" y="3358" fill="#909CA8" font-size="13" font-weight="400" text-anchor="start">Every fill opaque, no gradient (ADR 0090 §2); light never turns with the hue.</text><text x="840" y="3392" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">Risk: Object-head characters are a known illustration trope; its hat, ring and suit must keep it</text><text x="840" y="3410.85" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">ours.</text></svg></body></html>
