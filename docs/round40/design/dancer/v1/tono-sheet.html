</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3480"><rect width="1600" height="4000" fill="#14191E"/><text x="24" y="44" fill="#E3E8ED" font-size="30" font-weight="500" text-anchor="start">Direction B · Tono — the knob</text><text x="1576" y="40" fill="#909CA8" font-size="13" font-weight="400" text-anchor="end">Cantus round 40 · the dancer for Slate · design only</text><text x="24" y="80" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">Slate's own parts come alive. Its head is Slate's knob — the knob body, the rim that holds it at 3:1, a lit lip</text><text x="24" y="101.75" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">— with the scale of dots round it lighting gold with the music's level, and the gold pointer on its rim swinging</text><text x="24" y="123.5" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">late like a tuft of hair. Its body is a key of the theme's surface with the logo's five vermilion bars in a</text><text x="24" y="145.25" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">well; its limbs are cables, its hands jack tips, its feet fader caps. It wears the theme: in Paper it is the</text><text x="24" y="167" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">paper knob.</text><text x="840" y="80" fill="#E3E8ED" font-size="14" font-weight="500" text-anchor="start">Why it fits Slate</text><text x="840" y="104" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· The most Cantus of the three: nobody else's mascot is made of the instrument it lives in.</text><text x="840" y="144" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· A visualiser that is part of the face: the dots and the five bars move with the level.</text><text x="840" y="184" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Bouncy and warm (squash and stretch, the cables follow through) without being childish.</text><text x="840" y="224" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Moods are clear at stage size: pill eyes, arcs, a visor; no blush, no stars.</text><image href="../../../../../docs/round39/design/dir-a/window-night-1x.png" x="0" y="270" width="1280" height="720"/><g transform="translate(797,946) scale(196.8)"><ellipse cx="0" cy="0.01" rx="0.25" ry="0.036" fill="#0B0E11" opacity="0.55"/>
