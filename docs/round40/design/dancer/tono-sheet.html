</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3480"><rect width="1600" height="4000" fill="#14191E"/><text x="24" y="44" fill="#E3E8ED" font-size="30" font-weight="500" text-anchor="start">B · Tono — the knob (v2)</text><text x="1576" y="40" fill="#909CA8" font-size="13" font-weight="400" text-anchor="end">Cantus round 40 · the dancer cast for Slate · design only</text><text x="24" y="80" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">Slate's parts with an attitude. A knob for a head — its rim, a lit lip, the scale of dots lit gold by the level,</text><text x="24" y="101.75" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">the gold pointer a fin that swings late — on a lean robot body: a key with the logo's five bars in a well,</text><text x="24" y="123.5" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">straight limbs with joints, fists, high-top fader-cap sneakers. Its eyes are gold segments in an LED visor (no</text><text x="24" y="145.25" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">mouth: the five bars are its voice); a vermilion patch cable is slung round its neck. Signature: Turn it up — it</text><text x="24" y="167" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">reaches up and turns its own knob, three clicks, the dots filling.</text><text x="840" y="80" fill="#E3E8ED" font-size="14" font-weight="500" text-anchor="start">Why it fits Slate</text><text x="840" y="104" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· The most Cantus of the cast: made of the window it lives in, and it wears the theme.</text><text x="840" y="144" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Cool, not cute: a smaller head, a visor, a lean back, a hard nod with fist hits.</text><text x="840" y="184" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Its signature is the app's own gesture: turning a knob up to the top.</text><text x="840" y="224" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Close to today's rig: the family's construction with new parts.</text><image href="../../../../docs/round39/design/dir-a/window-night-1x.png" x="0" y="270" width="1280" height="720"/><g transform="translate(797,946) scale(196.8)"><ellipse cx="0" cy="0.01" rx="0.24" ry="0.034" fill="#0B0E11" opacity="0.55"/>

"12" font-weight="500" text-anchor="start">LED eyes</text><text x="620" y="3290" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#F2C766 9.9:1 · #F2C766 1.5:1</text><rect x="20" y="3312" width="40" height="40" rx="4" fill="#7D8996" stroke="#2B3239"/><rect x="64" y="3312" width="40" height="40" rx="4" fill="#6A7682" stroke="#2B3239"/><text x="20" y="3370" fill="#E3E8ED" font-size="12" font-weight="500" text-anchor="start">Limbs</text><text x="20" y="3386" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#7D8996 4.4:1 · #6A7682 4.3:1</text><rect x="220" y="3312" width="40" height="40" rx="4" fill="#F0784A" stroke="#2B3239"/><rect x="264" y="3312" width="40" height="40" rx="4" fill="#D2541A" stroke="#2B3239"/><text x="220" y="3370" fill="#E3E8ED" font-size="12" font-weight="500" text-anchor="start">Patch cable</text><text x="220" y="3386" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#F0784A 5.7:1 · #D2541A 3.9:1</text><rect x="420" y="3312" width="40" height="40" rx="4" fill="#E2B85A" stroke="#2B3239"/><rect x="464" y="3312" width="40" height="40" rx="4" fill="#9A6E1C" stroke="#2B3239"/><text x="420" y="3370" fill="#E3E8ED" font-size="12" font-weight="500" text-anchor="start">Gold — pointer, dots</text><text x="420" y="3386" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#E2B85A 8.5:1 · #9A6E1C 4.2:1</text><rect x="620" y="3312" width="40" height="40" rx="4" fill="#2B3239" stroke="#2B3239"/><rect x="664" y="3312" width="40" height="40" rx="4" fill="#E4E9EE" stroke="#2B3239"/><text x="620" y="3370" fill="#E3E8ED" font-size="12" font-weight="500" text-anchor="start">Key body</text><text x="620" y="3386" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#2B3239 1.2:1 · #E4E9EE 1.1:1</text><text x="840" y="3178" fill="#E3E8ED" font-size="16" font-weight="500" text-anchor="start">Construction (units: the figure stands 1 tall)</text><text x="840" y="3208" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Head: Slate's knob, r 0.165, rim 0.011, a dark cut outside; 11 dots lit by the level.</text><text x="840" y="3230" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Visor: a slot 1.42 × 0.40 of the radius; gold segments shaped by the mood.</text><text x="840" y="3252" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Pointer: a gold fin through the rim, swinging late; Turn it up turns it 135°.</text><text x="840" y="3274" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Body: a key 0.235 wide with rim, lip and a dark well with five vermilion bars.</text><text x="840" y="3296" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Limbs: straight segments 0.046–0.048 with joint discs; fists r 0.034; high-tops.</text><text x="840" y="3318" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· A vermilion cable round the neck, its gold plug swinging after the body.</text><text x="840" y="3358" fill="#909CA8" font-size="13" font-weight="400" text-anchor="start">Every fill opaque, no gradient (ADR 0090 §2); light never turns with the hue.</text><text x="840" y="3392" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">Risk: The visor recalls a helmet; keep the knob's rim, dots and pointer readable so it stays a knob.</text></svg></body></html>
