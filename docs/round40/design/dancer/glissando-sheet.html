</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3480"><rect width="1600" height="4000" fill="#14191E"/><text x="24" y="44" fill="#E3E8ED" font-size="30" font-weight="500" text-anchor="start">G · Glissando — the figure of light</text><text x="1576" y="40" fill="#909CA8" font-size="13" font-weight="400" text-anchor="end">Cantus round 40 · the dancer cast for Slate · design only</text><text x="24" y="80" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">Neon-futuristic, our own. A near-black suit defined by light: lapis neon along the outer edge of each limb and</text><text x="24" y="101.75" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">down the torso's sides, short arcs at the elbows and knees, a collar and a belt line, the logo's five vermilion</text><text x="24" y="123.5" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">bars on the chest lit by the level, gold headphones, two gold glowing eyes. At night each line is a halo, a line</text><text x="24" y="145.25" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">and a pale core; on paper the line alone, sharp lapis on the dark suit. Fast hands and feet leave light trails.</text><text x="24" y="167" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">It tuts (geometric arm shapes snapped on the half beat). Signature: Halo — its hands draw a circle of light</text><text x="24" y="188.75" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">round its head; on the beat the circle drops to the floor as a ring.</text><text x="840" y="80" fill="#E3E8ED" font-size="14" font-weight="500" text-anchor="start">Why it fits Slate</text><text x="840" y="104" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· The neon wish, made ours: a periwinkle lapis (not the films' cyan), gold eyes, the logo's bars; no</text><text x="840" y="122.85" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">disc, helmet or circuit layout.</text><text x="840" y="144" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Lapis light beside Síncopa's gold rim: the two dark figures of the cast read apart at a glance.</text><text x="840" y="184" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Trails make speed visible: every snap of the tutting leaves an afterimage.</text><text x="840" y="224" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Reads in both themes: lines carry it at night, the dark suit carries it on paper.</text><image href="../../../../docs/round39/design/dir-a/window-night-1x.png" x="0" y="270" width="1280" height="720"/><g transform="translate(797,946) scale(196.8)"><ellipse cx="0" cy="0.008" rx="0.21" ry="0.03" fill="#0B0E11" opacity="0.55"/>

xt x="420" y="3290" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#E6EEFF 13.6:1 · #5B79D6 3.8:1</text><rect x="620" y="3216" width="40" height="40" rx="4" fill="#6F8FE8" stroke="#2B3239"/><rect x="664" y="3216" width="40" height="40" rx="4" fill="#F4F6F8" stroke="#2B3239"/><text x="620" y="3274" fill="#E3E8ED" font-size="12" font-weight="500" text-anchor="start">Halo (24 %, night)</text><text x="620" y="3290" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#6F8FE8 5.1:1 · #F4F6F8 1.0:1</text><rect x="20" y="3312" width="40" height="40" rx="4" fill="#F2C766" stroke="#2B3239"/><rect x="64" y="3312" width="40" height="40" rx="4" fill="#9C711C" stroke="#2B3239"/><text x="20" y="3370" fill="#E3E8ED" font-size="12" font-weight="500" text-anchor="start">Eyes, headphones (gold)</text><text x="20" y="3386" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#F2C766 9.9:1 · #9C711C 4.0:1</text><rect x="220" y="3312" width="40" height="40" rx="4" fill="#F0784A" stroke="#2B3239"/><rect x="264" y="3312" width="40" height="40" rx="4" fill="#F0784A" stroke="#2B3239"/><text x="220" y="3370" fill="#E3E8ED" font-size="12" font-weight="500" text-anchor="start">Chest bars</text><text x="220" y="3386" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#F0784A 5.7:1 · #F0784A 2.6:1</text><text x="840" y="3178" fill="#E3E8ED" font-size="16" font-weight="500" text-anchor="start">Construction (units: the figure stands 1 tall)</text><text x="840" y="3208" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· About 8 heads; a near-black suit #0B0E12, every piece one fill.</text><text x="840" y="3230" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Neon: halo 3.2× the line at 24 % (night only), the line, a core 0.38× (night only).</text><text x="840" y="3252" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Lines on each limb's outer edge (0.009 in from the edge), arcs on joints, collar, belt.</text><text x="840" y="3274" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Chest: five vermilion bars, their height the level; eyes two gold slits; gold headphones.</text><text x="840" y="3296" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Trails: hands and feet over the last 0.21 beat, six segments fading.</text><text x="840" y="3318" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Halo: a circle r 0.25 round the head drawn by the hands, then dropped to a floor ring.</text><text x="840" y="3358" fill="#909CA8" font-size="13" font-weight="400" text-anchor="start">Every fill opaque, no gradient (ADR 0090 §2); light never turns with the hue.</text><text x="840" y="3392" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">Risk: Glow costs: the halo layer is translucent (see the note for its cost); on paper it is a</text><text x="840" y="3410.85" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">different look (no halo).</text></svg></body></html>
