</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3480"><rect width="1600" height="4000" fill="#14191E"/><text x="24" y="44" fill="#E3E8ED" font-size="30" font-weight="500" text-anchor="start">J · Cinta — the cassette</text><text x="1576" y="40" fill="#909CA8" font-size="13" font-weight="400" text-anchor="end">Cantus round 40 · the dancer cast for Slate · design only</text><text x="24" y="80" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">An 80s cassette that breakdances. A graphite shell with a brand-free cream label and two retro stripes, two</text><text x="24" y="101.75" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">reels for eyes that turn as it dances, the tape opening for a mouth, a backwards lapis cap, lapis track pants</text><text x="24" y="123.5" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">with a vermilion stripe, white gloves, chunky sneakers. Its tape slips out and swirls with every move.</text><text x="24" y="145.25" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">Signature: Rewind — the dance runs backwards at ×8, the reels spin back, the tape whips, a gold ◀◀ flashes; then</text><text x="24" y="167" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">a freeze, and it restarts.</text><text x="840" y="80" fill="#E3E8ED" font-size="14" font-weight="500" text-anchor="start">Why it fits Slate</text><text x="840" y="104" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Retro and street at once: toprock, a backwards cap, track pants.</text><text x="840" y="144" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· The tape is secondary motion that makes every move look bigger.</text><text x="840" y="184" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Rewind is a joke only a cassette can tell.</text><text x="840" y="224" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· A landscape box head — a new silhouette in the cast.</text><image href="../../../../docs/round39/design/dir-a/window-night-1x.png" x="0" y="270" width="1280" height="720"/><g transform="translate(797,946) scale(196.8)"><ellipse cx="-0.036" cy="0.010" rx="0.20" ry="0.028" fill="#0B0E11" opacity="0.5"/>

l="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Cassette 0.42 × 0.27: rim, shell, a cream label, two stripes, four screws.</text><text x="840" y="3230" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Window 0.27 × 0.09 with two reels: hubs r 0.036, six teeth turning.</text><text x="840" y="3252" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· The tape: a 26-point ribbon from the shell's bottom, curls following the body late.</text><text x="840" y="3274" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Backwards cap (two values) with a gold button; lapis track pants, vermilion stripe.</text><text x="840" y="3296" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Rewind: the toprock at −8× speed, the reels backwards, a gold rewind sign.</text><text x="840" y="3318" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Toprock: a cross-step on each beat, arms flung open.</text><text x="840" y="3358" fill="#909CA8" font-size="13" font-weight="400" text-anchor="start">Every fill opaque, no gradient (ADR 0090 §2); light never turns with the hue.</text><text x="840" y="3392" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">Risk: Cassettes are nostalgic to some and unknown to others; the reels-as-eyes must carry it.</text></svg></body></html>
