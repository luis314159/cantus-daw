</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3480"><rect width="1600" height="4000" fill="#14191E"/><text x="24" y="44" fill="#E3E8ED" font-size="30" font-weight="500" text-anchor="start">C · Síncopa — noir (chosen)</text><text x="1576" y="40" fill="#909CA8" font-size="13" font-weight="400" text-anchor="end">Cantus round 40 · the dancer cast for Slate · design only</text><text x="24" y="80" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">A human drawn as a silhouette: one dark ink for the whole figure, a gold rim light down its lit side and a cool</text><text x="24" y="101.75" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">rim down the other (that draws it on Night's dark room; on Paper it is a sharp silhouette). A hood with gold</text><text x="24" y="123.5" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">headphones over it, a long open coat whose tails swing late, slim trousers, sneakers with gold soles that flash</text><text x="24" y="145.25" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">when it steps. The face is two gold glints in the hood's dark. Liquid motion, behind the beat. Signature: Arm</text><text x="24" y="167" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">wave — a wave runs from one hand through the shoulders out of the other; then it looks, eyes lit.</text><text x="840" y="80" fill="#E3E8ED" font-size="14" font-weight="500" text-anchor="start">Why it fits Slate</text><text x="840" y="104" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Mysterious and stylish: the most 'cool' answer, nothing cute about it.</text><text x="840" y="144" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Slate's own idea — light as value — on a body: the rim light is the drawing.</text><text x="840" y="184" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· One ink and one gold: the calmest palette of the three, like Compás.</text><text x="840" y="224" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Cheap: each piece is three fills (two rims, the ink), about 40 in all.</text><image href="../../../../docs/round39/design/dir-a/window-night-1x.png" x="0" y="270" width="1280" height="720"/><g transform="translate(797,946) scale(196.8)"><ellipse cx="0" cy="0.008" rx="0.22" ry="0.032" fill="#0B0E11" opacity="0.55"/>

ont-size="12" font-weight="500" text-anchor="start">Glints — eyes</text><text x="620" y="3290" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#F2C766 9.9:1 · #F2C766 1.5:1</text><text x="840" y="3178" fill="#E3E8ED" font-size="16" font-weight="500" text-anchor="start">Construction (units: the figure stands 1 tall)</text><text x="840" y="3208" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· About 8 heads; one ink #0E1216 for every piece.</text><text x="840" y="3230" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Each piece three fills: gold copy offset to the light, cool copy to the other side, the ink.</text><text x="840" y="3252" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Hood with a darker opening; two gold glints are the face; gold headphones over it.</text><text x="840" y="3274" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Coat: an open body and two tails at the sides that swing late.</text><text x="840" y="3296" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Sneakers with gold soles (they flash when a foot lifts).</text><text x="840" y="3318" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Arm wave: forward kinematics, a pulse running elbow → shoulder → shoulder → elbow.</text><text x="840" y="3358" fill="#909CA8" font-size="13" font-weight="400" text-anchor="start">Every fill opaque, no gradient (ADR 0090 §2); light never turns with the hue.</text><text x="840" y="3392" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">Risk: A faceless figure keeps people at a distance; its moods are only glints and posture.</text></svg></body></html>
