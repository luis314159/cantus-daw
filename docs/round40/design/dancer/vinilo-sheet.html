</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3480"><rect width="1600" height="4000" fill="#14191E"/><text x="24" y="44" fill="#E3E8ED" font-size="30" font-weight="500" text-anchor="start">I · Vinilo — the DJ</text><text x="1576" y="40" fill="#909CA8" font-size="13" font-weight="400" text-anchor="end">Cantus round 40 · the dancer cast for Slate · design only</text><text x="24" y="80" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">A turntable that plays itself. Its head is a record — vinyl grooves, a vermilion label with its face, the gold</text><text x="24" y="101.75" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">spindle for a nose, a sheen and a gold marker that turn — with DJ headphones, one cup on. A graphite plinth body</text><text x="24" y="123.5" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">with a lapis light strip and a gold chain. Its right arm is the tonearm (gold pivot, rod, headshell, gold</text><text x="24" y="145.25" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">stylus); its left glove scratches the record's edge. Signature: Backspin — it brakes the record, spins it back</text><text x="24" y="167" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">in a blur, and lands on the drop with the record running, arms up.</text><text x="840" y="80" fill="#E3E8ED" font-size="14" font-weight="500" text-anchor="start">Why it fits Slate</text><text x="840" y="104" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· A DJ made of a turntable: the scratch is literally its head moving.</text><text x="840" y="144" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· The tonearm as an arm is a silhouette nobody else has.</text><text x="840" y="184" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· No maker's look: no plinth layout, logo or label design of a brand.</text><text x="840" y="224" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Cheap: circles and rings; the spin is a turning sheen.</text><image href="../../../../docs/round39/design/dir-a/window-night-1x.png" x="0" y="270" width="1280" height="720"/><g transform="translate(797,946) scale(196.8)"><ellipse cx="0" cy="0.010" rx="0.20" ry="0.028" fill="#0B0E11" opacity="0.5"/>

6" font-size="13" font-weight="400" text-anchor="start">· Head: a record r 0.19 with a rim, 4 groove rings, a turning sheen and marker.</text><text x="840" y="3230" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Label r 0.098 (vermilion, two values) with the face; a gold spindle for a nose.</text><text x="840" y="3252" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Plinth 0.26 wide with a lapis strip; a gold chain with a record pendant.</text><text x="840" y="3274" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Tonearm: gold pivot, counterweight, rod 0.020, headshell with a gold stylus.</text><text x="840" y="3296" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Scratch: the record's turn = 0.55 turn a beat + a rock of ±0.10 turn twice a beat.</text><text x="840" y="3318" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Backspin: brake, three turns back (a blurred sheen), forward on the drop.</text><text x="840" y="3358" fill="#909CA8" font-size="13" font-weight="400" text-anchor="start">Every fill opaque, no gradient (ADR 0090 §2); light never turns with the hue.</text><text x="840" y="3392" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">Risk: The record face is small at 48 px; at 200 px the label face reads.</text></svg></body></html>
