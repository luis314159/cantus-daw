</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3480"><rect width="1600" height="4000" fill="#14191E"/><text x="24" y="44" fill="#E3E8ED" font-size="30" font-weight="500" text-anchor="start">D · Bajo — the speaker</text><text x="1576" y="40" fill="#909CA8" font-size="13" font-weight="400" text-anchor="end">Cantus round 40 · the dancer cast for Slate · design only</text><text x="24" y="80" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">A studio monitor with a heavy, calm groove. The cabinet is its body and head: two tweeters are its eyes (gold</text><text x="24" y="101.75" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">domes for pupils, heavy lids of the baffle for moods), the woofer is its chest and pumps with the music, the</text><text x="24" y="123.5" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">bass port its belt; short thick legs on isolation pads, big mitts. Graphite in both themes, held at 3:1 on Night</text><text x="24" y="145.25" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">by the knob's rim. Signature: Drop the bass — it winds up, then the woofer blasts gold rings, the cabinet jolts</text><text x="24" y="167" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">and shakes.</text><text x="840" y="80" fill="#E3E8ED" font-size="14" font-weight="500" text-anchor="start">Why it fits Slate</text><text x="840" y="104" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· A silhouette nobody else in the cast has: a tall box, weight, slowness.</text><text x="840" y="144" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Unimpressed, half-lidded eyes: cool by being calm.</text><text x="840" y="184" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· A visualiser in its chest (the woofer and its dust cap pump with the level).</text><text x="840" y="224" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Simple to draw: rounded rects and circles, about 35 fills.</text><image href="../../../../docs/round39/design/dir-a/window-night-1x.png" x="0" y="270" width="1280" height="720"/><g transform="translate(797,946) scale(196.8)"><ellipse cx="0" cy="0.01" rx="0.31" ry="0.04" fill="#0B0E11" opacity="0.6"/>
