</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3480"><rect width="1600" height="4000" fill="#14191E"/><text x="24" y="44" fill="#E3E8ED" font-size="30" font-weight="500" text-anchor="start">K · Metrónomo — the serious one</text><text x="1576" y="40" fill="#909CA8" font-size="13" font-weight="400" text-anchor="end">Cantus round 40 · the dancer cast for Slate · design only</text><text x="24" y="80" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">A wooden metronome with a butler's dignity: a tall pyramid in two values of wood with a gold scale and finial,</text><text x="24" y="101.75" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">the pendulum swinging in front and never off the beat, a white wing collar and black bow tie, a gold monocle on</text><text x="24" y="123.5" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">a chain, half-lidded eyes, a curled moustache, white gloves, a silver tray, white spats. It barely moves — a</text><text x="24" y="145.25" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">small bow on the one. Signature: Doble tiempo — the pendulum runs at ×2, ×4 (still on the beats), he loses his</text><text x="24" y="167" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">composure, the monocle drops; on the beat he straightens his tie and recomposes.</text><text x="840" y="80" fill="#E3E8ED" font-size="14" font-weight="500" text-anchor="start">Why it fits Slate</text><text x="840" y="104" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Comedy by contrast: the one who does not dance, until the pendulum runs away.</text><text x="840" y="144" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· The pendulum keeps exact time: it shows the tempo better than any meter.</text><text x="840" y="184" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Wood joins the cast's palette (round 39 kept the wooden unit faces).</text><text x="840" y="224" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Not Tic (the old robot metronome): wood, manners, a monocle.</text><image href="../../../../docs/round39/design/dir-a/window-night-1x.png" x="0" y="270" width="1280" height="720"/><g transform="translate(797,946) scale(196.8)"><ellipse cx="0" cy="0.010" rx="0.22" ry="0.030" fill="#0B0E11" opacity="0.5"/>

"400" text-anchor="start">#14191E 1.1:1 · #14191E 16.3:1</text><text x="840" y="3178" fill="#E3E8ED" font-size="16" font-weight="500" text-anchor="start">Construction (units: the figure stands 1 tall)</text><text x="840" y="3208" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· A wooden pyramid 0.32 → 0.16 wide, 0.66 tall, on a plinth; gold finial.</text><text x="840" y="3230" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Pendulum: a 0.37 rod from a pivot low on the front, a gold weight at 0.25.</text><text x="840" y="3252" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· The swing: 30° × cos(π·beat) — each extreme exactly on a beat.</text><text x="840" y="3274" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Face high on the front: half-lidded eyes, a monocle on a chain, a curled moustache.</text><text x="840" y="3296" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Wing collar and black bow tie; white gloves; a silver tray with a cup.</text><text x="840" y="3318" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Doble tiempo: ×2 then ×4 (still on the beats), monocle falls, recomposes on the beat.</text><text x="840" y="3358" fill="#909CA8" font-size="13" font-weight="400" text-anchor="start">Every fill opaque, no gradient (ADR 0090 §2); light never turns with the hue.</text><text x="840" y="3392" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">Risk: A face high on a narrow pyramid is small; the monocle and moustache carry it.</text></svg></body></html>
