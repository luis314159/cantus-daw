</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3480"><rect width="1600" height="4000" fill="#14191E"/><text x="24" y="44" fill="#E3E8ED" font-size="30" font-weight="500" text-anchor="start">E · Onda — the wave</text><text x="1576" y="40" fill="#909CA8" font-size="13" font-weight="400" text-anchor="end">Cantus round 40 · the dancer cast for Slate · design only</text><text x="24" y="80" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">A living ribbon, the most abstract of the family. It rises from a curl on the floor as a travelling wave to a</text><text x="24" y="101.75" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">round head and twists as it moves, so its front (lapis) and its back (gold) take turns — a waveform you could</text><text x="24" y="123.5" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">pick up. Faceless like Compás: its eyes are negative space cut into the head. It dances as a wave: the amplitude</text><text x="24" y="145.25" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">pulses on the beat; signature: Square drop — it springs up and the sine becomes a square wave, then a saw, then</text><text x="24" y="167" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">melts back.</text><text x="840" y="80" fill="#E3E8ED" font-size="14" font-weight="500" text-anchor="start">Why it fits Slate</text><text x="840" y="104" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Pure motion design: the hypnotic one, beautiful on a stream.</text><text x="840" y="144" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Its signature is sound itself: sine, square, saw — a synth's waveforms.</text><text x="840" y="184" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Compás's sibling in spirit (cut eyes, two colours), the opposite silhouette (all curve).</text><text x="840" y="224" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Cheap: two ribbon fills, two shade strips, the head — about 10 fills.</text><image href="../../../../../../docs/round39/design/dir-a/window-night-1x.png" x="0" y="270" width="1280" height="720"/><g transform="translate(797,946) scale(196.8)"><ellipse cx="0" cy="0.01" rx="0.19" ry="0.028" fill="#0B0E11" opacity="0.5"/>

<ellipse cx="0.0224" cy="-0.88" rx="0.01" ry="0.014" fill="#F4F6F8"/></g></svg><text x="1430" y="3130" fill="#556170" font-size="12" font-weight="400" text-anchor="middle">Saw</text><text x="1580" y="2936" fill="#556170" font-size="12" font-weight="400" text-anchor="end">No face but cut eyes: a mood is the wave's shape and the eyes' cut.</text><rect x="0" y="3150" width="1600" height="330" fill="#14191E"/><text x="20" y="3178" fill="#E3E8ED" font-size="16" font-weight="500" text-anchor="start">Palette — each colour measured on Slate's rooms</text><text x="20" y="3198" fill="#909CA8" font-size="12" font-weight="400" text-anchor="start">contrast on Night's base #1D2329 · on Paper's base #F4F6F8 (a silhouette holds 3:1)</text><rect x="20" y="3216" width="40" height="40" rx="4" fill="#7D97E6" stroke="#2B3239"/><rect x="64" y="3216" width="40" height="40" rx="4" fill="#2E4794" stroke="#2B3239"/><text x="20" y="3274" fill="#E3E8ED" font-size="12" font-weight="500" text-anchor="start">Front (lapis)</text><text x="20" y="3290" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#7D97E6 5.6:1 · #2E4794 7.9:1</text><rect x="220" y="3216" width="40" height="40" rx="4" fill="#5C78CC" stroke="#2B3239"/><rect x="264" y="3216" width="40" height="40" rx="4" fill="#24397A" stroke="#2B3239"/><text x="220" y="3274" fill="#E3E8ED" font-size="12" font-weight="500" text-anchor="start">Front shade</text><text x="220" y="3290" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#5C78CC 3.8:1 · #24397A 10.0:1</text><rect x="420" y="3216" width="40" height="40" rx="4" fill="#E2B85A" stroke="#2B3239"/><rect x="464" y="3216" width="40" height="40" rx="4" fill="#B8882C" stroke="#2B3239"/><text x="420" y="3274" fill="#E3E8ED" font-size="12" font-weight="500" text-anchor="start">Back (gold)</text><text x="420" y="3290" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#E2B85A 8.5:1 · #B8882C 2.9:1</text><rect x="620" y="3216" width="40" height="40" rx="4" fill="#B38A35" stroke="#2B3239"/><rect x="664" y="3216" width="40" height="40" rx="4" fill="#8F6A1E" stroke="#2B3239"/><text x="620" y="3274" fill="#E3E8ED" font-size="12" font-weight="500" text-anchor="start">Back shade</text><text x="620" y="3290" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#B38A35 5.0:1 · #8F6A1E 4.6:1</text><rect x="20" y="3312" width="40" height="40" rx="4" fill="#1D2329" stroke="#2B3239"/><rect x="64" y="3312" width="40" height="40" rx="4" fill="#F4F6F8" stroke="#2B3239"/><text x="20" y="3370" fill="#E3E8ED" font-size="12" font-weight="500" text-anchor="start">Cut eyes — the room</text><text x="20" y="3386" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#1D2329 1.0:1 · #F4F6F8 1.0:1</text><text x="840" y="3178" fill="#E3E8ED" font-size="16" font-weight="500" text-anchor="start">Construction (units: the figure stands 1 tall)</text><text x="840" y="3208" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· A centreline of 60 samples, a wave travelling up it: sine → square (shape) → saw.</text><text x="840" y="3230" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Width 0.040 at the floor → 0.145 under the head; a round head at the top.</text><text x="840" y="3252" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Twist: strongest at the tail, none at the head (the face always shows).</text><text x="840" y="3274" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Front lapis / back gold by the twist's sign, each with a shade strip (two fills each).</text><text x="840" y="3296" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Eyes: negative space in the room's colour, as Compás's visor.</text><text x="840" y="3318" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· A curl on the floor (a ribbon) where it stands.</text><text x="840" y="3358" fill="#909CA8" font-size="13" font-weight="400" text-anchor="start">Every fill opaque, no gradient (ADR 0090 §2); light never turns with the hue.</text><text x="840" y="3392" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">Risk: Without limbs it cannot do every move of the sixteen literally; its moves are re-read as</text><text x="840" y="3410.85" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">waves.</text></svg></body></html>
