</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3480"><rect width="1600" height="4000" fill="#14191E"/><text x="24" y="44" fill="#E3E8ED" font-size="30" font-weight="500" text-anchor="start">C · S1 · Síncopa, graphic</text><text x="1576" y="40" fill="#909CA8" font-size="13" font-weight="400" text-anchor="end">Cantus round 40 · the dancer cast for Slate · design only</text><text x="24" y="80" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">A bold, simplified human in strong geometric shapes: Compás's clarity with clothes, hair and a face. One flat</text><text x="24" y="101.75" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">value per piece, no shading; limbs are bars of one width; the head a disc; a sharp vermilion A-line bob is the</text><text x="24" y="123.5" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">silhouette you remember; the face is dots and a line. It wears the theme as Compás does: a lapis jacket, wide</text><text x="24" y="145.25" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">trousers in the theme's ink (white at night, near-black on paper), white sneakers on gold soles, gold hoops.</text><text x="24" y="167" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">Graphic hits on the half beat. Signature: Spin and point — a paper-cut spin, its back shown in the turn, landing</text><text x="24" y="188.75" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">on the beat into a disco point.</text><text x="840" y="80" fill="#E3E8ED" font-size="14" font-weight="500" text-anchor="start">Why it fits Slate</text><text x="840" y="104" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· The closest to Compás: the same clarity, so the cast reads as one family.</text><text x="840" y="144" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· The bob and the suit-like trousers make a silhouette that reads at 48 px.</text><text x="840" y="184" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· No skin rendering, no detail to go wrong: it stays crisp at any size.</text><text x="840" y="224" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Cheap: about 25 fills; the spin is a scale of the drawing.</text><image href="../../../../../docs/round39/design/dir-a/window-night-1x.png" x="0" y="270" width="1280" height="720"/><g transform="translate(797,946) scale(196.8)"><ellipse cx="0" cy="0.010" rx="0.21" ry="0.032" fill="#0B0E11" opacity="0.5"/><g transform="translate(-0,0) scale(1,1) translate(0,0)"><path d="M-0.05,-0.44 L-0.1127,-0.2166 L-0.064,-0.04" fill="none" stroke="#1D2329" stroke-width="0.12" stroke-linecap="butt" stroke-linejoin="round"/>

="#E3E8ED" font-size="12" font-weight="500" text-anchor="start">Skin</text><text x="620" y="3290" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#B97A57 4.5:1 · #B97A57 3.2:1</text><rect x="20" y="3312" width="40" height="40" rx="4" fill="#F3F5F7" stroke="#2B3239"/><rect x="64" y="3312" width="40" height="40" rx="4" fill="#F3F5F7" stroke="#2B3239"/><text x="20" y="3370" fill="#E3E8ED" font-size="12" font-weight="500" text-anchor="start">Sneakers</text><text x="20" y="3386" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#F3F5F7 14.5:1 · #F3F5F7 1.0:1</text><rect x="220" y="3312" width="40" height="40" rx="4" fill="#E2B85A" stroke="#2B3239"/><rect x="264" y="3312" width="40" height="40" rx="4" fill="#B8882C" stroke="#2B3239"/><text x="220" y="3370" fill="#E3E8ED" font-size="12" font-weight="500" text-anchor="start">Gold — soles, hoops</text><text x="220" y="3386" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#E2B85A 8.5:1 · #B8882C 2.9:1</text><text x="840" y="3178" fill="#E3E8ED" font-size="16" font-weight="500" text-anchor="start">Construction (units: the figure stands 1 tall)</text><text x="840" y="3208" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· About 6 heads; head a disc r 0.092; limbs bars 0.090 (legs), 0.070 (arms).</text><text x="840" y="3230" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· One flat value per piece; pieces cut by 0.015 of the room's colour.</text><text x="840" y="3252" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Bob: a dome r 0.108, sides to the jaw, longer at the front, a side-swept fringe.</text><text x="840" y="3274" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Face: two dots, one line; sunglasses are one black bar with a gold glint.</text><text x="840" y="3296" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Spin: the drawing's width through cos(turn); its back (no face) when negative.</text><text x="840" y="3318" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Legs and jacket one silhouette; jacket's corners rounded by a 0.03 stroke.</text><text x="840" y="3358" fill="#909CA8" font-size="13" font-weight="400" text-anchor="start">Every fill opaque, no gradient (ADR 0090 §2); light never turns with the hue.</text><text x="840" y="3392" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">Risk: Flat human figures are common in product illustration; the bob, the colours and the snaps must</text><text x="840" y="3410.85" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">carry it.</text></svg></body></html>
