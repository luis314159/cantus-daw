</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3480"><rect width="1600" height="4000" fill="#14191E"/><text x="24" y="44" fill="#E3E8ED" font-size="30" font-weight="500" text-anchor="start">E · O2 · Onda, the wave-jelly</text><text x="1576" y="40" fill="#909CA8" font-size="13" font-weight="400" text-anchor="end">Cantus round 40 · the dancer cast for Slate · design only</text><text x="24" y="80" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">A chunky, wobbly creature whose top edge is the live waveform travelling across it, a gold trace just inside</text><text x="24" y="101.75" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">that edge like a scope line on its forehead. Two values of lapis, big eyes, a wide mouth, stubby arms and feet;</text><text x="24" y="123.5" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">it jiggles, the sides bulging on the beat. Signature: Shape shift — the top snaps square (a crown of</text><text x="24" y="145.25" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">crenellations, eyes wide, arms up), then saw (a row of shark teeth and a wicked grin), then melts back into a</text><text x="24" y="167" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">sine with a jiggle.</text><text x="840" y="80" fill="#E3E8ED" font-size="14" font-weight="500" text-anchor="start">Why it fits Slate</text><text x="840" y="104" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· The most fun of the three: the shape changes are jokes (a crown, shark teeth).</text><text x="840" y="144" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· A solid silhouette that reads at 48 px, with a face that acts.</text><text x="840" y="184" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· The waveform stays the idea: its outline is the sound.</text><text x="840" y="224" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Simple to draw: one outline path, the face, four stubs.</text><image href="../../../../../../docs/round39/design/dir-a/window-night-1x.png" x="0" y="270" width="1280" height="720"/><g transform="translate(797,946) scale(196.8)"><ellipse cx="0" cy="0.010" rx="0.28" ry="0.034" fill="#0B0E11" opacity="0.5"/>

<circle cx="0.3339" cy="-0.2186" r="0.036" fill="#6A86DA"/></g><text x="1300" y="292" fill="#E3E8ED" font-size="16" font-weight="500" text-anchor="start">In the window — Night</text><text x="1300" y="320" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">Floating, its default view:</text><text x="1300" y="338.85" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">transparent, over the workspace, size</text><text x="1300" y="357.7" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">1 stands 0.30 of the workspace's</text><text x="1300" y="376.55" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">height — 197 px in a 1280 × 720 window</text><text x="1300" y="395.4" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">(shown), 295 px at 150 %. The cut is</text><text x="1300" y="414.25" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">the room's colour, so it separates</text><text x="1300" y="433.1" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">from what it stands on.</text><image href="../../../../../../docs/round39/design/dir-a/window-paper-1x.png" x="0" y="1000" width="1280" height="720"/><g transform="translate(797,1676) scale(196.8)"><ellipse cx="0" cy="0.010" rx="0.28" ry="0.034" fill="#8C98A4" opacity="0.5"/>

="3296" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Squash and stretch on the beat; the sides bulge with the accent.</text><text x="840" y="3318" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Little feet in deep lapis; a contact shadow.</text><text x="840" y="3358" fill="#909CA8" font-size="13" font-weight="400" text-anchor="start">Every fill opaque, no gradient (ADR 0090 §2); light never turns with the hue.</text><text x="840" y="3392" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">Risk: A cute blob; it is the friendly answer, not the cool one.</text></svg></body></html>
