</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3480"><rect width="1600" height="4000" fill="#14191E"/><text x="24" y="44" fill="#E3E8ED" font-size="30" font-weight="500" text-anchor="start">E · O3 · Onda, the surfer</text><text x="1576" y="40" fill="#909CA8" font-size="13" font-weight="400" text-anchor="end">Cantus round 40 · the dancer cast for Slate · design only</text><text x="24" y="80" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">A surfer riding its own waveform. The floor is a lapis swell with a gold waveform crest, rolling with the beat;</text><text x="24" y="101.75" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">the surfer rides it on a cream board with a vermilion stripe and a gold fin, the board riding the wave's height</text><text x="24" y="123.5" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">and tilting with its slope. Laid-back cool: sunglasses, messy hair with gold tips, a cream tank, vermilion board</text><text x="24" y="145.25" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">shorts, a gold pendant. Signature: Square set — the wave turns square and it hops each step; then a saw: a slide</text><text x="24" y="167" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">down the ramp, an aerial with the board turning under its feet, the landing on the drop.</text><text x="840" y="80" fill="#E3E8ED" font-size="14" font-weight="500" text-anchor="start">Why it fits Slate</text><text x="840" y="104" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· A cool human with a reason to move: the music literally becomes its wave.</text><text x="840" y="144" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Every shape change is a trick: steps to hop, a ramp to launch from.</text><text x="840" y="184" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· A wide silhouette (the wave) that reads at any size, a figure on top.</text><text x="840" y="224" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Uses the human rig the cast already needs.</text><image href="../../../../../../docs/round39/design/dir-a/window-night-1x.png" x="0" y="270" width="1280" height="720"/><g transform="translate(797,946) scale(196.8)"><path d="M-0.48,-0.2107 L-0.464,-0.2157 L-0.448,-0.2197 L-0.432,-0.2226 L-0.416,-0.2244 L-0.4,-0.225 L-0.384,-0.2244 L-0.368,-0.2226 L-0.352,-0.2197 L-0.336,-0.2157 L-0.32,-0.2107 L-0.304,-0.2047 L-0.288,-0.1978 L-0.272,-0.1902 L-0.256,-0.1819 L-0.24,-0.1732 L-0.224,-0.1641 L-0.208,-0.1547 L-0.192,-0.1453 L-0.176,-0.1359 L-0.16,-0.1268 L-0.144,-0.1181 L-0.128,-0.1098 L-0.112,-0.1022 L-0.096,-0.0953 L-0.08,-0.0893 L-0.064,-0.0843 L-0.048,-0.0803 L-0.032,-0.0774 L-0.016,-0.0756 L-0,-0.075 L0.016,-0.0756 L0.032,-0.0774 L0.048,-0.0803 L0.064,-0.0843 L0.08,-0.0893 L0.096,-0.0953 L0.112,-0.1022 L0.128,-0.1098 L0.144,-0.1181 L0.16,-0.1268 L0.176,-0.1359 L0.192,-0.1453 L0.208,-0.1547 L0.224,-0.1641 L0.24,-0.1732 L0.256,-0.1819 L0.272,-0.1902 L0.288,-0.1978 L0.304,-0.2047 L0.32,-0.2107 L0.336,-0.2157 L0.352,-0.2197 L0.368,-0.2226 L0.384,-0.2244 L0.4,-0.225 L0.416,-0.2244 L0.432,-0.2226 L0.448,-0.2197 L0.464,-0.2157 L0.48,-0.2107 L0.48,0.012 L-0.48,0.012 Z" fill="#1D2329" stroke="#1D2329" stroke-width="0.024" stroke-linejoin="round"/>

</g></g><text x="1300" y="292" fill="#E3E8ED" font-size="16" font-weight="500" text-anchor="start">In the window — Night</text><text x="1300" y="320" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">Floating, its default view:</text><text x="1300" y="338.85" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">transparent, over the workspace, size</text><text x="1300" y="357.7" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">1 stands 0.30 of the workspace's</text><text x="1300" y="376.55" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">height — 197 px in a 1280 × 720 window</text><text x="1300" y="395.4" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">(shown), 295 px at 150 %. The cut is</text><text x="1300" y="414.25" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">the room's colour, so it separates</text><text x="1300" y="433.1" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">from what it stands on.</text><image href="../../../../../../docs/round39/design/dir-a/window-paper-1x.png" x="0" y="1000" width="1280" height="720"/><g transform="translate(797,1676) scale(196.8)"><path d="M-0.48,-0.2107 L-0.464,-0.2157 L-0.448,-0.2197 L-0.432,-0.2226 L-0.416,-0.2244 L-0.4,-0.225 L-0.384,-0.2244 L-0.368,-0.2226 L-0.352,-0.2197 L-0.336,-0.2157 L-0.32,-0.2107 L-0.304,-0.2047 L-0.288,-0.1978 L-0.272,-0.1902 L-0.256,-0.1819 L-0.24,-0.1732 L-0.224,-0.1641 L-0.208,-0.1547 L-0.192,-0.1453 L-0.176,-0.1359 L-0.16,-0.1268 L-0.144,-0.1181 L-0.128,-0.1098 L-0.112,-0.1022 L-0.096,-0.0953 L-0.08,-0.0893 L-0.064,-0.0843 L-0.048,-0.0803 L-0.032,-0.0774 L-0.016,-0.0756 L-0,-0.075 L0.016,-0.0756 L0.032,-0.0774 L0.048,-0.0803 L0.064,-0.0843 L0.08,-0.0893 L0.096,-0.0953 L0.112,-0.1022 L0.128,-0.1098 L0.144,-0.1181 L0.16,-0.1268 L0.176,-0.1359 L0.192,-0.1453 L0.208,-0.1547 L0.224,-0.1641 L0.24,-0.1732 L0.256,-0.1819 L0.272,-0.1902 L0.288,-0.1978 L0.304,-0.2047 L0. <text x="620" y="3290" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#EDE6DA 12.8:1 · #EDE6DA 1.1:1</text><rect x="20" y="3312" width="40" height="40" rx="4" fill="#E0693B" stroke="#2B3239"/><rect x="64" y="3312" width="40" height="40" rx="4" fill="#E0693B" stroke="#2B3239"/><text x="20" y="3370" fill="#E3E8ED" font-size="12" font-weight="500" text-anchor="start">Shorts</text><text x="20" y="3386" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#E0693B 4.7:1 · #E0693B 3.1:1</text><rect x="220" y="3312" width="40" height="40" rx="4" fill="#B97A57" stroke="#2B3239"/><rect x="264" y="3312" width="40" height="40" rx="4" fill="#B97A57" stroke="#2B3239"/><text x="220" y="3370" fill="#E3E8ED" font-size="12" font-weight="500" text-anchor="start">Skin</text><text x="220" y="3386" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#B97A57 4.5:1 · #B97A57 3.2:1</text><text x="840" y="3178" fill="#E3E8ED" font-size="16" font-weight="500" text-anchor="start">Construction (units: the figure stands 1 tall)</text><text x="840" y="3208" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· The sea: 0.96 wide, a swell of 1.2 cycles, amplitude 0.075 + 0.02·accent.</text><text x="840" y="3230" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· The board: 0.46 × 0.04, riding the wave's height, tilted by its slope (≤ 28°).</text><text x="840" y="3252" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Square: the board sits on the steps; it hops each half beat.</text><text x="840" y="3274" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Saw: a slide, then an aerial (the board turns under it: a flip of its width).</text><text x="840" y="3296" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Surfer: about 6 heads, side stance on the board, arms out for balance.</text><text x="840" y="3318" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Cool face: sunglasses with a gold glint; messy hair with gold tips.</text><text x="840" y="3358" fill="#909CA8" font-size="13" font-weight="400" text-anchor="start">Every fill opaque, no gradient (ADR 0090 §2); light never turns with the hue.</text><text x="840" y="3392" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">Risk: The wave takes the stage's floor; on a narrow floating window it must stay inside the box.</text></svg></body></html>
