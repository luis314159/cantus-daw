</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3480"><rect width="1600" height="4000" fill="#14191E"/><text x="24" y="44" fill="#E3E8ED" font-size="30" font-weight="500" text-anchor="start">C · S2 · Síncopa, the sidekick</text><text x="1576" y="40" fill="#909CA8" font-size="13" font-weight="400" text-anchor="end">Cantus round 40 · the dancer cast for Slate · design only</text><text x="24" y="80" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">Feature-animation proportions and a face that acts: a big head, big hands and feet, long thin legs; huge eyes</text><text x="24" y="101.75" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">with pupils and a highlight, thick brows, a wide mouth that grins with teeth and shouts; a curly puff with a</text><text x="24" y="123.5" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">gold headband that bounces after the head. An oversized vermilion tee, lapis shorts, striped tube socks, chunky</text><text x="24" y="145.25" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">sneakers with gold laces. Big anticipation, squash and stretch, fists pumped over the head. Signature: Hype jump</text><text x="24" y="167" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">— a deep crouch, a stretched launch, a star with a shout, a squashed landing with dust.</text><text x="840" y="80" fill="#E3E8ED" font-size="14" font-weight="500" text-anchor="start">Why it fits Slate</text><text x="840" y="104" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· The most expressive: a face you read from across the room, emotions at a glance.</text><text x="840" y="144" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Energy: it sells the music's excitement like an animated sidekick.</text><text x="840" y="184" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Big shapes stay readable small: the head and the hands are the silhouette.</text><text x="840" y="224" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Two values per piece, like the family; no lines.</text><image href="../../../../../docs/round39/design/dir-a/window-night-1x.png" x="0" y="270" width="1280" height="720"/><g transform="translate(797,946) scale(196.8)"><ellipse cx="0" cy="0.010" rx="0.25" ry="0.036" fill="#0B0E11" opacity="0.5"/>

<circle cx="0.1806" cy="-0.2979" r="0.017" fill="#8D5A3B"/></g><text x="1300" y="292" fill="#E3E8ED" font-size="16" font-weight="500" text-anchor="start">In the window — Night</text><text x="1300" y="320" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">Floating, its default view:</text><text x="1300" y="338.85" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">transparent, over the workspace, size</text><text x="1300" y="357.7" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">1 stands 0.30 of the workspace's</text><text x="1300" y="376.55" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">height — 197 px in a 1280 × 720 window</text><text x="1300" y="395.4" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">(shown), 295 px at 150 %. The cut is</text><text x="1300" y="414.25" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">the room's colour, so it separates</text><text x="1300" y="433.1" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">from what it stands on.</text><image href="../../../../../docs/round39/design/dir-a/window-paper-1x.png" x="0" y="1000" width="1280" height="720"/><g transform="translate(797,1676) scale(196.8)"><ellipse cx="0" cy="0.010" rx="0.25" ry="0.036" fill="#8C98A4" opacity="0.5"/>

ing.</text><text x="840" y="3318" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Squash up to 0.22 in the crouch, stretch 0.16 in the launch.</text><text x="840" y="3358" fill="#909CA8" font-size="13" font-weight="400" text-anchor="start">Every fill opaque, no gradient (ADR 0090 §2); light never turns with the hue.</text><text x="840" y="3392" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">Risk: Fun can tip into childish; it is the opposite answer to 'cool' — it is here to be compared.</text></svg></body></html>
