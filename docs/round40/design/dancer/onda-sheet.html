</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3480"><rect width="1600" height="4000" fill="#14191E"/><text x="24" y="44" fill="#E3E8ED" font-size="30" font-weight="500" text-anchor="start">E · Onda — the oscilloscope (chosen)</text><text x="1576" y="40" fill="#909CA8" font-size="13" font-weight="400" text-anchor="end">Cantus round 40 · the dancer cast for Slate · design only</text><text x="24" y="80" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">A figure drawn by a scope's phosphor trace — no body at all. Every limb is a line rippling with the waveform,</text><text x="24" y="101.75" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">its amplitude the level; the head is a Lissajous loop turning in depth, two bright dwell points for eyes. Amber</text><text x="24" y="123.5" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">phosphor (the cast's gold): a halo at night, a sharp dark-amber line on paper. A bright beam dot runs along the</text><text x="24" y="145.25" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">trace, drawing it, and a faint afterglow stays behind. Signature: Square — the ripples snap into a square wave</text><text x="24" y="167" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">and the poses go angular (pop and lock); then a saw; then a sine.</text><text x="840" y="80" fill="#E3E8ED" font-size="14" font-weight="500" text-anchor="start">Why it fits Slate</text><text x="840" y="104" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· The waveform is literally its body: you see the sine, the square, the saw on every limb.</text><text x="840" y="144" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· A Lissajous head is the oscilloscope's own picture — nobody else's mascot.</text><text x="840" y="184" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Light as drawing, warm amber: calm in the room, alive with the music.</text><text x="840" y="224" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Cheap: about 9 traced lines and one loop.</text><image href="../../../../docs/round39/design/dir-a/window-night-1x.png" x="0" y="270" width="1280" height="720"/><g transform="translate(797,946) scale(196.8)"><ellipse cx="0" cy="0.006" rx="0.15" ry="0.020" fill="#0B0E11" opacity="0.45"/>

" font-size="12" font-weight="500" text-anchor="start">Beam dot</text><text x="620" y="3290" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#FFF4D6 14.5:1 · #5E4210 8.6:1</text><text x="840" y="3178" fill="#E3E8ED" font-size="16" font-weight="500" text-anchor="start">Construction (units: the figure stands 1 tall)</text><text x="840" y="3208" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· About 8 heads; the figure is 9 traced lines (legs, spine, shoulders, arms, hips).</text><text x="840" y="3230" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Ripple: wavelength 0.075, amplitude 0.006 + 0.016·level (× 1.6 when square).</text><text x="840" y="3252" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Head: Lissajous x = r sin(3a + δ), y = r sin(2a), r 0.07, δ turning with the beat.</text><text x="840" y="3274" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Glow: halo 3.4× at 22 % (night), line, core 0.35×; paper: the line alone.</text><text x="840" y="3296" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Beam dot: travels the whole trace once every 1.25 beats.</text><text x="840" y="3318" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Afterglow: the skeleton 0.06 beat ago at 16 % (night).</text><text x="840" y="3358" fill="#909CA8" font-size="13" font-weight="400" text-anchor="start">Every fill opaque, no gradient (ADR 0090 §2); light never turns with the hue.</text><text x="840" y="3392" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">Risk: A line figure is thin at 48 px; its charm is the trace moving (judge the GIFs).</text></svg></body></html>
