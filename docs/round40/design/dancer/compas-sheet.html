</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3480"><rect width="1600" height="4000" fill="#14191E"/><text x="24" y="44" fill="#E3E8ED" font-size="30" font-weight="500" text-anchor="start">Direction A · Compás — the pictogram</text><text x="1576" y="40" fill="#909CA8" font-size="13" font-weight="400" text-anchor="end">Cantus round 40 · the dancer for Slate · design only</text><text x="24" y="80" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">A sign figure come alive. One ink (the theme's ink 1), solid pieces of one weight with round ends — a disc for a</text><text x="24" y="101.75" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">head, a capsule torso, bars for limbs — each cut from the piece behind it by a hairline of the room. Gold only</text><text x="24" y="123.5" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">on the headphones and on the beat ring at its feet. It dances pose to pose: it snaps into a key on the beat and</text><text x="24" y="145.25" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">holds it (pop and lock), with a pictogram's motion marks on the snap. No face: a mood is a posture, or negative</text><text x="24" y="167" fill="#B4BDC6" font-size="15" font-weight="400" text-anchor="start">space cut into the disc.</text><text x="840" y="80" fill="#E3E8ED" font-size="14" font-weight="500" text-anchor="start">Why it fits Slate</text><text x="840" y="104" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· The calmest of the three and the most Slate: one ink, one accent, like the icon family.</text><text x="840" y="144" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Reads at 48 px and over any clip; the cut keeps it legible on a busy window.</text><text x="840" y="184" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Fun from timing, not detail: the snaps land on the beat, the holds let the eye read the pose.</text><text x="840" y="224" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Cheapest to draw: about 20 fills a frame (the cast draws 52–113).</text><image href="../../../../docs/round39/design/dir-a/window-night-1x.png" x="0" y="270" width="1280" height="720"/><g transform="translate(797,946) scale(196.8)"><ellipse cx="-0.0258" cy="0.012" rx="0.21" ry="0.032" fill="#0B0E11" opacity="0.55"/>

="500" text-anchor="start">Gold — headphones, ring</text><text x="420" y="3290" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#E2B85A 8.5:1 · #9A6E1C 4.2:1</text><rect x="620" y="3216" width="40" height="40" rx="4" fill="#909CA8" stroke="#2B3239"/><rect x="664" y="3216" width="40" height="40" rx="4" fill="#556170" stroke="#2B3239"/><text x="620" y="3274" fill="#E3E8ED" font-size="12" font-weight="500" text-anchor="start">Motion marks — ink 3</text><text x="620" y="3290" fill="#909CA8" font-size="11" font-weight="400" text-anchor="start">#909CA8 5.7:1 · #556170 5.8:1</text><text x="840" y="3178" fill="#E3E8ED" font-size="16" font-weight="500" text-anchor="start">Construction (units: the figure stands 1 tall)</text><text x="840" y="3208" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Head: a disc, r 0.092 (units: the figure stands 1 tall).</text><text x="840" y="3230" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Torso: a capsule 0.162 → 0.120 wide; legs 0.078, arms 0.066, round ends.</text><text x="840" y="3252" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Cut: 0.017 of the room's colour round each piece in front (3 px at 200 px).</text><text x="840" y="3274" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Legs and torso are one silhouette (no cut between them); arms cut where they cross.</text><text x="840" y="3296" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Headphones: a gold band 0.017 and two cups 0.040 × 0.066, cut from the disc.</text><text x="840" y="3318" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">· Beat ring: a gold ellipse at its feet, opaque, shrinking after each beat.</text><text x="840" y="3358" fill="#909CA8" font-size="13" font-weight="400" text-anchor="start">Every fill opaque, no gradient (ADR 0090 §2); light never turns with the hue.</text><text x="840" y="3392" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">Risk: It can read as a sign, not a character: its charm is in the motion, so judge the GIFs, not the</text><text x="840" y="3410.85" fill="#B4BDC6" font-size="13" font-weight="400" text-anchor="start">stills.</text></svg></body></html>
