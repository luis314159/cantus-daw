# The sound tools' reference sets (round 42, sound-data) — read by tools/sound-refs/fetch.py.
#
# One [[set]] per folder under $CANTUS_REFS (default F:\projects\cantus-refs). The sub-path
# (`dir`) is the layout the tools expect: the study's catalog.py, the lab's subjects and the
# Arcus scripts name files relative to $CANTUS_REFS, so keep it. Each set's files, with their
# sizes, SHA-256 and the origin each comes from, are in files/<id>.tsv (`fetch.py record`).
# No audio is in the repository; the texts in sources/ are the sets' own notes (SOURCE.md:
# the licence verbatim, what was taken, when).
#
# Fields: id, dir, title; urls / doi / version (where it comes from); licence (SPDX, or
# `custom`); terms (the licence in one line); use (`ship` / `ship-credit` — may ship, with
# the credit; `measure` — analysis only, never ship; `reading` — documents read, not
# measured); tools (who reads it); fetch (`manual` when no part can be downloaded by a
# script); origins (how each file arrives: kind url / zip / tar / repo / derived / meta /
# manual / pack — fetch.py's header says what each means; `match` the globs of the paths an
# origin covers, tried in order; a file no origin claims and whose bytes are another
# catalogued file's is a `copy`); ignore (globs of scratch that is not catalogued).

[catalog]
version = 1
refs_default = 'F:\projects\cantus-refs'
work_default = 'F:\projects\cantus-work'
zenodo = "https://zenodo.org/records/"

