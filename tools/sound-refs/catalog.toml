name = "The Aasimonster 2.1"
licence = "CC-BY-4.0"
credit = "The Aasimonster, DrumGizmo (drumgizmo.org): the kit DIE (Danish death metal) used on Rise of the Rotten; 2.0 conversion by Chaot4"
kit = "2 kicks, 3 rack toms, 1 floor tom, snare (sizes UNKNOWN); 2 x 16in crash, 18in china, Stagg 8in and 10in chinas, a zilbel, ride, hi-hat"
room = "UNKNOWN; the page advises a strong low cut on the ambience and overheads (an offset gives double hits)"
mics = "16 channels: SM57 x2 snare top/bottom, AKG C518M x4 toms, D112 x2 kicks, Rode NT5 overheads, condensers on hat and ride, 2 ambience, a DDrum trigger and an Alesis DM5"
genre = "metal (death metal)"
layers = "UNKNOWN on the page (DrumGizmo power levels: counted by tools/tympanum-real/library.py)"
multitrack = true
real_playing = false
[[set.kits]]
name = "MuldjordKit 3"
