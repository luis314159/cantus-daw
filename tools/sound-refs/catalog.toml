# ============================================================ by hand only

[[set]]
id = "ebu-loudness"
dir = "ebu-loudness"
title = "The EBU loudness test set (Tech 3341 / 3342 signals as WAV)"
urls = ["https://tech.ebu.ch/publications/ebu_loudness_test_set"]
licence = "custom"
terms = "the EBU's test material, offered for download on its page; its terms are the page's (not recorded here: read them when fetching)"
use = "measure"
tools = ["tools/soundlab/tests/test_loudness.py (SOUNDLAB_EBU, default $CANTUS_REFS/ebu-loudness)"]
fetch = "manual"
expect = ["seq-3341-1-16bit.wav", "seq-3341-2-16bit.wav", "seq-3341-3-16bit-v02.wav", "seq-3341-4-16bit-v02.wav", "seq-3341-5-16bit-v02.wav"]
manual = """
tech.ebu.ch answers automated clients with a browser challenge (Cloudflare), which is never
worked around. In a browser: open https://tech.ebu.ch/publications/ebu_loudness_test_set,
download the test set (read its terms there), and unpack the seq-3341-*.wav files listed
below into $CANTUS_REFS/ebu-loudness/ (flat). Then:
    python -I tools/sound-refs/fetch.py record ebu-loudness     # their sizes and SHA-256
    python -I tools/soundlab/tests/run.py                       # test_loudness reads them
Keep the other files of the zip beside them if you like; record catalogues every file.
"""

[[set]]
id = "mdb-drums"
dir = "mdb-drums"
title = "MDB Drums (Southall et al., ISMIR 2017): MedleyDB's drum stems with hand-annotated hits"
urls = ["https://github.com/CarlSouthall/MDBDrums"]
licence = "CC-BY-NC-SA-4.0"
terms = "CC BY-NC-SA 4.0: measuring only, never committed, never shipped"
use = "measure"
tools = ["crates/cantus-dsp/tests/onset_drums_mdb.rs (CANTUS_MDB_DRUMS = $CANTUS_REFS/mdb-drums/MDBDrums-master/MDB Drums)", "crates/cantus-ui/tests/sectio_mdb.rs (CANTUS_MDB_DRUMS: a folder holding audio/drum_only and annotations/class flattened)"]
fetch = "manual"
manual = """
Not on disk since round 37's folder was deleted (no checksums recorded). Fetch the repository's
zip by hand (GitHub serves it to scripts, but it is not pinned to a commit, so record it):
    curl -sSL --fail -o "$CANTUS_REFS/mdb-drums/MDBDrums-master.zip" https://github.com/CarlSouthall/MDBDrums/archive/refs/heads/master.zip
    (check it starts with PK; behind the proxy it may be an HTML page for ~10 minutes: wait, again)
    unzip it there, then: python -I tools/sound-refs/fetch.py record mdb-drums
"""

# ============================================================ the drums library (round 42, tympanum-real)
# Tympanum measured against real kits of several genres (docs/round42/tympanum-real.md). Each
# set's [[set.kits]] says, per kit: licence and credit; the kit (maker, shells, heads, wires,
# cymbals); the room and mics; the genre; the velocity layers; whether it is multitrack (each
# mic its own channel); whether it is real playing (a performance) or one hit at a time. Facts
# are the sources' own words (UNKNOWN where they say nothing). DRSKit and Virtuosity Drums are
# in the `tympanum` set above (the hybrid's references); the content root that plays them all
# through Tympanum's loader is made by tools/tympanum-real/content_root.py.
# Not taken, on licence: Salamander Drumkit and the AVL kits (CC BY-SA), MDB Drums, ENST,
# IDMT-SMT-Drums, RBMA, MUSDB, MedleyDB, Cambridge-MT (NC, ND or proprietary), ADTOF (NC-SA),
# madmom's and LarsNet's models (NC). Datasets whose audio is not a miked kit (E-GMD: a TD-17
# module; StemGMD and the WaivOps sets: rendered from sample libraries) are not measured; the
# Groove MIDI Dataset's MIDI (human performances) drives the kits instead.

[[set]]
id = "drums-dg"
dir = "drums/dg"
title = "DrumGizmo's other multi-mic kits: The Aasimonster (death metal), MuldjordKit (metal/rock), ShittyKit (a cheap kit, unprocessed)"
urls = ["https://drumgizmo.org/wiki/doku.php?id=kits", "https://drumgizmo.org/wiki/doku.php?id=kits:the_aasimonster", "https://drumgizmo.org/wiki/doku.php?id=kits:muldjordkit", "https://drumgizmo.org/wiki/doku.php?id=kits:shittykit"]
version = "aasimonster2_1.zip, MuldjordKit3.zip, ShittyKit1_2.zip (as served 2026-11-26)"
licence = "CC-BY-4.0"
terms = "CC BY 4.0 on each kit's page; credit the kit wherever performer credits appear"
use = "ship-credit"
tools = ["crates/cantus-ui/examples/tympanum_real (through content_root.py's receipts)", "tools/tympanum-real"]
note = "drumgizmo.org's chain is refused by Python's own store ('certificate has expired') and verified by curl (Schannel, the system's store): fetch.py reads these zips through curl, never -k"
ignore = ["*/cantus-pack.json", "*.part"]
[set.origins.aasimonster]
kind = "zip"
url = "https://drumgizmo.org/kits/Aasimonster/aasimonster2_1.zip"
match = ["aasimonster/*"]
[set.origins.muldjordkit]
kind = "zip"
url = "https://drumgizmo.org/kits/MuldjordKit/MuldjordKit3.zip"
match = ["muldjordkit/*"]
[set.origins.shittykit]
kind = "zip"
url = "https://drumgizmo.org/kits/ShittyKit/ShittyKit1_2.zip"
match = ["shittykit/*"]
