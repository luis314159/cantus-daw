[[set]]
id = "drums-gmd"
dir = "drums/gmd"
title = "The Groove MIDI Dataset's MIDI (Magenta, 2019): 13.6 hours of ten drummers on a Roland TD-11, rock, funk, jazz, Latin, Afro-Cuban, hip-hop, gospel, pop … with the hat pedal's CC4"
urls = ["https://magenta.tensorflow.org/datasets/groove"]
doi = "Gillick, Roberts, Engel, Eck, Bamman: Learning to Groove with Inverse Sequence Transformations, ICML 2019"
version = "groove-v1.0.0-midionly.zip"
licence = "CC-BY-4.0"
terms = "'made available by Google LLC under a Creative Commons Attribution 4.0 International (CC BY 4.0) License'"
use = "ship-credit (MIDI only: human performances that play every kit; its audio is the e-kit module's and is not taken)"
tools = ["tools/tympanum-real/midi.py (a performance to the notes a kit plays)", "tools/tympanum-real/grooves.py"]
[set.origins.zip]
kind = "url"
url = "https://storage.googleapis.com/magentadata/datasets/groove/groove-v1.0.0-midionly.zip"
match = ["groove-v1.0.0-midionly.zip"]
[set.origins.unpacked]
kind = "zip"
local = "groove-v1.0.0-midionly.zip"
match = ["groove/*"]
