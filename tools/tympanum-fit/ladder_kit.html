<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escalera de batería</title>
<style>
:root { --bg:#f6f5f2; --card:#ffffff; --ink:#1d1d1f; --mute:#62626a; --line:#d9d6cf; --acc:#1e5fbf; --acc-ink:#ffffff; --soft:#e8eef8; --ok:#23793f; --warn:#a8470f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#17181a; --card:#222326; --ink:#ececec; --mute:#a3a3aa; --line:#3a3b40; --acc:#6aa5f2; --acc-ink:#0b1320; --soft:#26303d; --ok:#62c482; --warn:#f09a62; } }
:root[data-theme="dark"] { --bg:#17181a; --card:#222326; --ink:#ececec; --mute:#a3a3aa; --line:#3a3b40; --acc:#6aa5f2; --acc-ink:#0b1320; --soft:#26303d; --ok:#62c482; --warn:#f09a62; }
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 780px; margin: 0 auto; padding: 20px 16px 64px; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
header h1 { font-size: 22px; margin: 0; flex: 1 1 auto; }
h2 { font-size: 19px; margin: 0 0 6px; }
p { margin: 8px 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin: 14px 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.mute { color: var(--mute); } .small { font-size: 14px; }
button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 9px 16px; cursor: pointer; min-height: 44px; }
button:hover:not(:disabled) { border-color: var(--acc); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
button.big { font-size: 20px; font-weight: 650; min-width: 76px; }
button.on, button.primary { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
button.answer { border: 2px solid var(--acc); font-weight: 650; min-width: 120px; }
button.answer.chosen { background: var(--acc); color: var(--acc-ink); }
button:disabled { opacity: .45; cursor: default; }
.lang button { min-height: 34px; padding: 4px 10px; font-size: 14px; }
.lang button[aria-pressed="true"] { background: var(--acc); color: var(--acc-ink); border-color: var(--acc); }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; flex: 1 1 160px; min-width: 80px; }
.bar > div { height: 100%; width: 0; background: var(--acc); }
.stim { display: grid; grid-template-columns: 120px 1fr 48px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.stim input[type=range] { width: 100%; accent-color: var(--acc); }
.stim button { padding: 6px 8px; white-space: nowrap; }
.stim .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; }
.stim .val.unset { color: var(--mute); font-weight: 400; }
.scale { display: grid; grid-template-columns: 120px 1fr 48px; gap: 10px; font-size: 13px; color: var(--mute); }
.scale div:nth-child(2) { display: flex; justify-content: space-between; }
input[type=text] { font: inherit; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 100%; }
fieldset { border: 0; margin: 0 0 14px; padding: 0; } legend { font-weight: 600; margin-bottom: 6px; padding: 0; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pills label { border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; background: var(--card); }
.pills input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.pills label:has(input:checked) { background: var(--soft); border-color: var(--acc); font-weight: 650; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.scroll { overflow-x: auto; }
.ok { color: var(--ok); } .warn { color: var(--warn); }
.scale span { padding: 0 2px; }
@media (max-width: 520px) { .stim, .scale { grid-template-columns: 104px 1fr 40px; } .scale span:nth-child(2), .scale span:nth-child(4) { display: none; } }
</style>
</head>
<body>
<main>
<header>
<h1 id="title"></h1>
<div class="lang row" role="group" aria-label="Idioma / Language"><button id="lang-es" type="button">ES</button><button id="lang-en" type="button">EN</button></div>
</header>
<div class="row small mute" id="progress"></div>
<section id="view"></section>
</main>
