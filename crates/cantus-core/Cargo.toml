[package]
name = "cantus-core"
description = "Cantus DAW — project model, musical time, command bus, undo/redo. No I/O, no threads."
license = "MPL-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# The transcendental functions (`cantus_dsp::math`): gains, pan laws, fades and automation
# curves are rendered numbers and must round the same way on every machine (ADR 0031 R9).
cantus-dsp.workspace = true
serde.workspace = true
thiserror.workspace = true
# Freezing (ADR 0064): a frozen target's content key is SHA-256 over the canonical JSON of
# what makes its sound (both MIT/Apache-2.0, already in the workspace).
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
serde_json.workspace = true
