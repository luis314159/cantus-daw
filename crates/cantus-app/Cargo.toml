[package]
name = "cantus"
description = "Cantus — a free, open-source digital audio workstation."
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "cantus"
path = "src/main.rs"

[features]
# ASIO drivers on Windows next to WASAPI, on by default (ADR 0025 §10, round 21): one build
# has every driver. It needs the Steinberg ASIO SDK and LLVM's libclang at build time —
# `cargo run -p xtask -- asio-sdk` fetches and checks the SDK. Without them the build still
# succeeds, says so in a cargo warning, and offers WASAPI only (the patched asio-sys,
# third_party/README.md); a release (`xtask package`) refuses to build without them.
default = ["asio"]
asio = ["cantus-ui/asio"]

[dependencies]
cantus-ui.workspace = true
env_logger.workspace = true
log.workspace = true
anyhow.workspace = true
# The x86-64 level this program was built for, which `--version` names (round 22).
cantus-launch.workspace = true

# ADR 0024 §12: the splash logo and the window's icon are rendered from the logo's SVG
# masters at build time; `winresource` (MIT) puts the icon into the Windows executable.
[build-dependencies]
resvg = { version = "0.48", default-features = false }
tiny-skia = "0.12"
winresource = "0.1"
