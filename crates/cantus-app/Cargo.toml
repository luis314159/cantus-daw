[package]
name = "cantus"
description = "Cantus — a free, open-source digital audio workstation."
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "cantus"
path = "src/main.rs"

[features]
# ASIO drivers on Windows (ADR 0025 §10); see docs/round19/devices.md to build it.
asio = ["cantus-ui/asio"]

[dependencies]
cantus-ui.workspace = true
env_logger.workspace = true
log.workspace = true
anyhow.workspace = true

# ADR 0024 §12: the splash logo and the window's icon are rendered from the logo's SVG
# masters at build time; `winresource` (MIT) puts the icon into the Windows executable.
[build-dependencies]
resvg = { version = "0.48", default-features = false }
tiny-skia = "0.12"
winresource = "0.1"
