[package]
name = "cantus-rt"
description = "Cantus's real-time ground: thread priority (MMCSS, Mach time constraint and audio workgroups, rtkit/SCHED_FIFO), CPU topology (P/E cores, last-level caches), cache padding, pre-faulted and locked memory, the floating-point environment. The only home of the engine's unsafe OS code (ADR 0031 §2.7)."
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["rtkit"]
# Linux: ask rtkit over D-Bus when the user may not set SCHED_FIFO directly (needs libdbus-1).
rtkit = ["dep:audio_thread_priority"]

[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Memory",
    "Win32_System_Registry",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# rtkit over D-Bus (SCHED_RR granted to a desktop user without RLIMIT_RTPRIO); ADR 0031 §2.6
# names this crate for Linux only. Windows and macOS are ours (it asks MMCSS for "Audio" and
# knows no workgroups).
audio_thread_priority = { version = "0.38", optional = true }
