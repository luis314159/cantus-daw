# cantus-plugins: the workspace's settings (clippy reads only the nearest clippy.toml) plus the
# deterministic-math rule (ADR 0031 R9 and R16, docs/round21/math.md). std's transcendental
# functions call the platform's libm, whose bits differ between machines (on Windows the
# UCRT even picks FMA3 or non-FMA3 code by CPU), so this crate calls `cantus_dsp::math`.
# `sqrt`, `abs`, `floor` and `mul_add` are correctly rounded everywhere and stay allowed;
# approximate reciprocal instructions differ between Intel and AMD and are banned too.
# Here for the parameter tapers the exported plug-ins map host values through.

# The audio thread is sacred: warn loudly on anything that might allocate or block.
avoid-breaking-exported-api = false

disallowed-methods = [
    { path = "f32::sin", reason = "platform libm, not the same bits on every machine: use cantus_dsp::math::sin (ADR 0031 R9)" },
    { path = "f32::cos", reason = "platform libm, not the same bits on every machine: use cantus_dsp::math::cos (ADR 0031 R9)" },
    { path = "f32::tan", reason = "platform libm, not the same bits on every machine: use cantus_dsp::math::tan (ADR 0031 R9)" },
