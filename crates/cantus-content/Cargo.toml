[package]
name = "cantus-content"
description = "Cantus DAW — the content manager: sample packs listed in a manifest, downloaded on demand, verified, unpacked into the user's data folder."
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# HTTP: blocking, small, rustls. The platform verifier checks certificates against the
# operating system's store, so a corporate TLS-inspecting proxy whose root the
# administrator installed is trusted exactly as the browser trusts it, and nothing is
# ever turned off (ADR 0030).
# rustls with ring and the platform verifier, without `rustls-webpki-roots`: the Mozilla
# root list (CDLA-Permissive-2.0, a data licence) was compiled in and never used, since
# the roots come from the platform verifier (round 26, docs/signing/README.md §2).
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }
# Archives: deflate through flate2's pure-Rust backend (miniz_oxide, already in the tree).
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
# Reading a DrumGizmo kit's XML (round 28): already in the tree for DAWproject.
roxmltree = "0.20"
# Mixing a multi-microphone kit at install with the same bits on every machine.
cantus-dsp.workspace = true
# The free space on the content folder's volume, checked before an install (round 28).
cantus-rt.workspace = true

[dev-dependencies]
tempfile = "3"
hound.workspace = true
