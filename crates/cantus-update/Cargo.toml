[package]
name = "cantus-update"
description = "Cantus — checking GitHub Releases for a newer version, verifying it, installing it on quit (ADR 0032)."
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
log.workspace = true
# HTTPS through the operating system's own TLS stack and trust store (SChannel on
# Windows): a corporate proxy that inspects TLS has its root installed there by IT, so
# the check works behind it without turning any verification off (ADR 0032 §6). The
# whole `native-tls` feature: ureq 3.4 checks for it by that name before any HTTPS request
# and panicked with `native-tls-no-default` alone — 0.1.0-beta.1 and beta.2's update check
# never answered (tests/https.rs). The roots stay the platform's (`RootCerts::PlatformVerifier`).
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[dev-dependencies]
tempfile = "3"
