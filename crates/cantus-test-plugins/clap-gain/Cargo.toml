[package]
name = "cantus-test-clap"
description = "A CLAP plug-in built only to test Cantus's host: gain, latency, state, a sidechain port, and a crash on request."
license = "GPL-3.0-or-later"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
clap-sys = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# The test editor on macOS (ADR 0066): a label in the host's NSView. MIT; already in the
# workspace through winit.
objc2 = "0.6"
# Only the parts used: the frameworks' defaults would pull six more crates.
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSDate",
    "NSGeometry",
    "NSObject",
    "NSRunLoop",
    "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSMenu",
    "NSMenuItem",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSText",
    "NSTextField",
    "NSView",
    "NSWindow",
] }
