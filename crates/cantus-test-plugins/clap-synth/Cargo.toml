[package]
name = "cantus-test-clap-synth"
description = "A CLAP instrument built only to test Cantus's host: notes, controllers, transport, latency, state (ADR 0028)."
license = "GPL-3.0-or-later"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
clap-sys = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# The test editor on macOS (ADR 0066): a label in the host's NSView. MIT; already in the
# workspace through winit.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
