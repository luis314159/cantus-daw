[package]
name = "cantus-engine"
description = "Cantus DAW — real-time audio engine: transport, sequencer, graph, lock-free messaging, offline render."
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
cantus-rt = { workspace = true, features = ["rtkit"] }
cantus-core.workspace = true
cantus-dsp.workspace = true
rtrb.workspace = true
cpal.workspace = true
hound.workspace = true
midir.workspace = true
thiserror.workspace = true
log.workspace = true
# Sample libraries beside WAV (Exemplar): FLAC (Apache-2.0) and Ogg Vorbis (MIT OR Apache-2.0).
claxon = "0.4"
lewton = "0.10"

[features]
# ASIO drivers on Windows (ADR 0025 §10). Needs the Steinberg ASIO SDK (`CPAL_ASIO_DIR`, or
# cpal's build script downloads it) and LLVM's libclang for bindgen (`LIBCLANG_PATH`).
# See docs/round19/devices.md for the exact steps.
asio = ["cpal/asio"]
# The scheduler's `buggify!` sites (ADR 0031 R13): compiled in only for the schedule fuzz
# (`cargo test -p cantus-engine --features fuzz --test sched`); never in a release build.
fuzz = []

[dev-dependencies]
tempfile = "3"
sha2.workspace = true
serde_json.workspace = true
cantus-project.workspace = true
env_logger.workspace = true
