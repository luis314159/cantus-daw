[package]
name = "cantus-host"
description = "Cantus DAW — hosting plug-ins made to the market's standards (CLAP, VST3) behind one contract."
# GPL like the application: the formats' SDKs and bindings are GPL-compatible, and a host
# is part of the application, not a library others link into closed products.
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = ["vst3"]
# The VST3 backend (`cantus_host::vst3`). Bindings generated from the VST 3.8 SDK headers,
# which Steinberg publishes under the MIT licence (see src/vst3/README.md).
vst3 = ["dep:vst3"]

[dependencies]
serde.workspace = true
# Where a hosted plug-in runs is the project's (`ExternalPlugin::isolation`, ADR 0063).
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
raw-window-handle = "0.6"
cantus-core.workspace = true
cantus-engine.workspace = true
# The denormal guard's re-assert after every audio-thread call into a plug-in (ADR 0031 R9).
cantus-rt.workspace = true
rtrb.workspace = true
# CLAP: the ABI as the official headers define it (MIT OR Apache-2.0), ADR 0019.
clap-sys = "0.5"
# Opening a plug-in's shared library (ISC); both formats.
libloading = "0.8"
# VST3 (feature `vst3`): bindings from the MIT-licensed VST 3.8 SDK headers.
vst3 = { version = "0.3", optional = true }

[target.'cfg(windows)'.dependencies]
# The plug-in window: a top-level Win32 window the plug-in's editor is a child of.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # The job object that ends the plug-in sandboxes with Cantus (ADR 0063).
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
# The run loop plug-in editors need on Linux (CLAP timer and fd support, VST3 `IRunLoop`):
# `poll` on the descriptors they register (ADR 0065).
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# The plug-in window on Linux: a top-level X11 window the editor embeds into (ADR 0065).
# Pure Rust, already in the workspace through winit (MIT OR Apache-2.0).
x11rb = "0.13"

[build-dependencies]
# The Windows version resource (build.rs, ADR 0048 §9): product name and version on the
# binaries a release signs. MIT; already in the workspace through cantus-app.
winresource = "0.1"

[dev-dependencies]
cantus-project.workspace = true
tempfile = "3"
# Built (as a DLL next to the test binaries) for the VST3 backend's tests; not linked.
cantus-test-vst3 = { path = "../cantus-test-plugins/vst3" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The X11 editor window's picture (`CANTUS_X11_SHOT`, tests/clap_window_x11.rs); already in
# the tree through cantus-ui.
png = "0.18"

[[bin]]
name = "cantus-scan"
path = "src/bin/cantus-scan.rs"
