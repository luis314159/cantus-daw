 c.appendChild(el("h2", tr("owner")));
 c.appendChild(el("p", "kit " + KIT, "mute small"));
 const docs = online.everyone.concat(imported);
 const rows = docs.map(d => { const s = d.results || {}; return { who: d.listener || s.listener || "?", ok: s.kit === KIT, s: s, about: s.about || d.about || {} }; });
 const mine = rows.filter(r => r.ok);
 const w = el("div", undefined, "scroll"); const tb = el("table"); tb.id = "summary";
 const hd = el("tr"); for (const h of [tr("listeners"), tr("q_device"), tr("q_piano"), tr("q_audio"), tr("q_age"), "ABX 1", "ABX x", pianoName("chorda3") + " / " + pianoName("salamander"), pianoName("chorda3") + " / " + pianoName("chorda2"), "check", "min"]) hd.appendChild(el("th", h)); tb.appendChild(hd);
 for (const r of rows) {
  const row = el("tr");
  if (!r.ok) { row.appendChild(el("td", r.who)); row.appendChild(el("td", tr("other_kit"), "mute")); tb.appendChild(row); continue; }
  const a = r.about, s1 = score(r.s.abx), sx = score(r.s.extra), pr = prefs(r.s);
  const mins = r.s.started && r.s.mainDone ? Math.round((Date.parse(r.s.mainDone) - Date.parse(r.s.started)) / 60000) : "—";
  const cells = [r.who, a.device ? tr("device_" + a.device) : "—", a.piano ? tr("piano_" + a.piano) + (a.years ? " (" + a.years + ")" : "") : "—", a.audio ? tr("audio_" + a.audio) : "—", a.age ? tr("age_" + a.age) : "—",
   s1.n ? s1.k + "/" + s1.n + (s1.p !== null ? " p " + fmtP(s1.p) : "") : "—", sx.n ? sx.k + "/" + sx.n + (sx.p !== null ? " p " + fmtP(sx.p) : "") : "—",
   pr.pairs[0].a + " · " + pr.pairs[0].b + " · " + pr.pairs[0].s, pr.pairs[1].a + " · " + pr.pairs[1].b + " · " + pr.pairs[1].s, pr.checksSame + "/" + pr.checks, String(mins)];
  for (const v of cells) row.appendChild(el("td", v)); tb.appendChild(row);
  const notes = (r.s.pref || []).filter(q => q.note && q.note.trim()).map(q => PHRASE_NAMES[lang][q.phrase] + " (" + pianoName(pianoOf(q.one)) + " / " + pianoName(pianoOf(q.two)) + ", " + tr(q.choice || "same") + "): " + q.note.trim());
  if (notes.length) { const nr = el("tr"); const td = el("td", notes.join(" · "), "mute small"); td.colSpan = 11; nr.appendChild(td); tb.appendChild(nr); }
 }
 w.appendChild(tb); c.appendChild(w);
 c.appendChild(el("p", "ABX: k/n, p · " + tr("one") + "/" + tr("two") + ": a · b · " + tr("same") + " · check: " + tr("same") + " / 2", "mute small"));
 // Pooled by group: every listener, by playback, by piano, those who passed both checks.
 const groups = [[tr("all"), mine]];
 for (const v of ["headphones", "monitors", "speakers"]) groups.push([tr("device_" + v), mine.filter(r => r.about.device === v)]);
 for (const v of ["no", "some", "yes"]) groups.push([tr("q_piano") + " " + tr("piano_" + v), mine.filter(r => r.about.piano === v)]);
 groups.push([tr("catch_ok"), mine.filter(r => { const p = prefs(r.s); return p.checks === 2 && p.checksSame === 2; })]);
 const w2 = el("div", undefined, "scroll"); const t2 = el("table"); t2.id = "groups";
 const h2 = el("tr"); for (const h of [tr("group"), "n", "ABX 1 (k/N, p)", "p < 0.05", pianoName("chorda3") + " / " + pianoName("salamander"), pianoName("chorda3") + " / " + pianoName("chorda2"), "ABX x"]) h2.appendChild(el("th", h)); t2.appendChild(h2);
 for (const [name, g] of groups) {
  const full = g.filter(r => score(r.s.abx).p !== null);
  let k = 0, n = 0, sig = 0; for (const r of full) { const s = score(r.s.abx); k += s.k; n += s.n; if (s.p < 0.05) sig++; }
  let kx = 0, nx = 0; for (const r of g) { const s = score(r.s.extra); if (s.p !== null) { kx += s.k; nx += s.n; } }
  const P = PAIRS.map(() => ({ a: 0, b: 0, s: 0 })); for (const r of g) prefs(r.s).pairs.forEach((x, j) => { P[j].a += x.a; P[j].b += x.b; P[j].s += x.s; });
  const row = el("tr");
  for (const v of [name, String(g.length), n ? k + "/" + n + ", p " + fmtP(binomTail(k, n)) : "—", full.length ? sig + "/" + full.length : "—",
   P[0].a + " · " + P[0].b + " · " + P[0].s + " (p " + fmtP(signTest(P[0].a, P[0].b)) + ")", P[1].a + " · " + P[1].b + " · " + P[1].s + " (p " + fmtP(signTest(P[1].a, P[1].b)) + ")",
   nx ? kx + "/" + nx + ", p " + fmtP(binomTail(kx, nx)) : "—"]) row.appendChild(el("td", v));
  t2.appendChild(row);
 }
 w2.appendChild(t2); c.appendChild(el("h3", tr("group"))); c.appendChild(w2);
 const r = el("div", undefined, "row"); r.style.marginTop = "14px";
 const lab = el("label", tr("import_files")); lab.htmlFor = "import-files";
 const inp = el("input"); inp.type = "file"; inp.id = "import-files"; inp.accept = ".json,application/json"; inp.multiple = true;
 const out = el("p", undefined, "mute small");
 inp.onchange = async () => {
  let n = 0;
  for (const f of inp.files) {
   let d; try { d = JSON.parse(await f.text()); } catch (e) { d = null; }
   if (!d || d.kit !== KIT || !Array.isArray(d.abx)) { out.textContent = tr("bad_file", { f: f.name }); continue; }
   const doc = { kit: KIT, listener: String(d.listener || f.name.replace(/\.json$/i, "")), about: d.about, results: d, updatedAt: now(), source: "import" };
   if (online.owner && online.db) { try { await online.db.doc("abx/import-" + slugOf(doc.listener) + "-" + rnd(1e9)).set(doc); } catch (e) { imported.push(doc); } } else imported.push(doc);
   n++;
  }
  if (n) out.textContent = tr("imported", { n: n }); inp.value = ""; render();
 };
 r.appendChild(lab); r.appendChild(inp);
 r.appendChild(btn(tr("everyone_dl"), () => saveFile("listening-" + KIT + "-all.json", JSON.stringify({ kit: KIT, tokens: unveil(), listeners: docs }, null, 1), c), "", "download-all"));
 r.appendChild(btn(tr("back"), () => { st.view = st.mainDone ? "results" : "intro"; save(); render(); }, "", "back"));
 c.appendChild(r); c.appendChild(out);
}

function render() {
 document.documentElement.lang = lang; document.title = tr("title"); $("title").textContent = tr("title");
 for (const l of ["es", "en"]) $("lang-" + l).setAttribute("aria-pressed", lang === l ? "true" : "false");
 if (st.view === "results" && !st.mainDone) st.view = "intro";
 if (st.view === "summary" && !(online.owner || location.hash === "#summary" || location.hash === "#resumen")) st.view = st.mainDone ? "results" : "intro";
 const sec = sectionOf(st.view);
 if (!sec) { shownKey = null; audio.stop(); }
 steps();
 const v = $("view"); v.textContent = "";
 const c = el("div", undefined, "card"); v.appendChild(c);
 if (sec === "pref") viewPref(c); else if (sec) viewAbx(c, sec);
 else if (st.view === "between") viewBetween(c);
 else if (st.view === "results") viewResults(c);
 else if (st.view === "summary") viewSummary(c);
 else viewIntro(c);
 paintTransport();
}
document.getElementById("lang-es").onclick = () => { lang = "es"; save(); render(); };
document.getElementById("lang-en").onclick = () => { lang = "en"; save(); render(); };
// Keys: A B X (or 1 2) play, space stops (or plays the last slot again), L loops. Never while
// typing; space never also presses the focused button.
document.addEventListener("keydown", e => {
 const t = e.target, tag = t && t.tagName;
 if (tag === "TEXTAREA" || (tag === "INPUT" && t.type !== "radio") || e.ctrlKey || e.metaKey || e.altKey) return;
 const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
 const slot = { a: "a", b: "b", x: "x", "1": "one", "2": "two" }[k];
 if (slot && audio.map[slot]) { e.preventDefault(); press(slot); }
 else if (k === " " && sectionOf(st.view)) { e.preventDefault(); if (audio.playing()) audio.stop(); else if (audio.last) press(audio.last); }
 else if (k === "l" && sectionOf(st.view)) { e.preventDefault(); audio.setLoop(!audio.loop); }
});
document.addEventListener("keyup", e => { if (e.key === " " && sectionOf(st.view) && e.target && e.target.tagName === "BUTTON") e.preventDefault(); });
if (location.hash === "#summary" || location.hash === "#resumen") st.view = "summary";
st.engine = st.engine && st.engine.startsWith("element (") ? st.engine : audio.mode;
if (st.engine.startsWith("element (")) audio.mode = "element";
save();
render();
if (resumed) say("welcome_back", true);
goOnline();
// For the page's own browser checks (chorda_kit/abx_browser_check.mjs).
window.__abx = { st: () => st, audio: audio, render: render, unveil: unveil, binomTail: binomTail };
</script>
</body>
