<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chorda listening test</title>
<style>
:root { --bg:#f6f5f2; --card:#ffffff; --ink:#1d1d1f; --mute:#6b6b70; --line:#dedcd6; --acc:#1e64c8; --acc-ink:#ffffff; --ok:#2a8a4a; --warn:#b5541b; }
@media (prefers-color-scheme: dark) { :root { --bg:#17181a; --card:#222326; --ink:#ececec; --mute:#a0a0a6; --line:#36373b; --acc:#5b9bf0; --acc-ink:#0b1320; --ok:#5cc07c; --warn:#f0965b; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 26px; margin: 0 0 4px; }
h2 { font-size: 20px; margin: 0 0 8px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin:16px 0; }
.row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:10px 18px; cursor:pointer; min-width:64px; }
button.big { font-size:20px; font-weight:600; min-width:88px; }
button.on { background:var(--acc); color:var(--acc-ink); border-color:var(--acc); }
button.primary { background:var(--acc); color:var(--acc-ink); border-color:var(--acc); }
button:disabled { opacity:.45; cursor:default; }
.mute { color:var(--mute); }
.bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; flex:1 1 200px; }
.bar > div { height:100%; width:0; background:var(--acc); }
.tabs button { border-radius:8px 8px 0 0; }
table { border-collapse:collapse; width:100%; }
td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
input#who { font:inherit; background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 10px; flex:1 1 220px; min-width:0; }
textarea { width:100%; font:inherit; background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px; }
.ok { color:var(--ok); } .warn { color:var(--warn); }
.lang { float:right; }
</style>
</head>
<body>
<main>
<div class="lang"><button id="lang-en">EN</button> <button id="lang-es">ES</button></div>
<h1 data-t="title"></h1>
<p class="mute" data-t="intro"></p>
<div class="row" style="margin:12px 0 16px"><label for="who" data-t="who"></label><input id="who" autocomplete="name"></div>
<p id="msg" class="warn" hidden></p>
<div class="row tabs" id="tabs"></div>
<section id="view"></section>
<p class="mute" data-t="credit"></p>
</main>
<script>

  copy_here: "Tu navegador no guardó el archivo. Copia este texto y mándaselo a Luis:", reset_sure: "¿Seguro? Pulsa otra vez para borrarlo todo",
  everyone: "Todos los oyentes", imported: "Importados: {n}", import_files: "Importar los archivos .json que te mandaron", bad_file: "No es un archivo de resultados: {f}",
  who: "Tu nombre", need_name: "Escribe tu nombre arriba primero: los resultados dicen de quién son.",
  download: "Descargar resultados (JSON)", reset: "Empezar de nuevo (borra las respuestas)", reset_q: "¿Borrar todas las respuestas y sortear ensayos nuevos?",
  reveal: "Respuestas por ensayo", src_salamander: "Salamander Grand", src_chorda1: "Chorda modelo 1", src_chorda2: "Chorda modelo 2"
 }
};
const PHRASE_NAMES = {

 es: { middle_c: "Do central, mf", soft_chords: "Acordes suaves, con pedal", fast_run: "Una escala rápida", ballad: "Una balada con pedal", ff_chord: "Un acorde fortísimo", bass: "Notas graves solas", top: "La octava aguda" }

const TESTS = { abx1: ["chorda2", "salamander"], abx2: ["chorda1", "chorda2"] };

  const o = pair.slice(); if (rnd(2)) o.reverse();
  qs.push({ phrase: p, one: o[0], two: o[1], choice: null, note: "", plays: 0, heard: {}, at: null });

let st;
try { st = JSON.parse(localStorage.getItem(KEY)); } catch (e) { st = null; }

// shows the owner every listener's scores.
const online = { db: null, uid: null, owner: false, downloads: null, writable: null, everyone: [], timer: null };
function say(text, ok) { const m = document.getElementById("msg"); m.textContent = text; m.className = ok ? "ok" : "warn"; m.hidden = !text; }

}
function showText(text, where) { const t = el("textarea"); t.value = text; t.rows = 8; t.readOnly = true; where.appendChild(el("p", tr("copy_here"))); where.appendChild(t); t.focus(); t.select(); }

  if (!(st.listener || "").trim()) return;

}

function everyoneTable(c) {
 c.appendChild(el("h2", tr("everyone")));
 const tb = el("table");
 const head = el("tr"); for (const h of [tr("who"), tr("tab_abx1"), tr("tab_abx2"), tr("src_chorda2") + " / " + tr("src_salamander"), tr("src_chorda2") + " / " + tr("src_chorda1")]) head.appendChild(el("th")).textContent = h;
 tb.appendChild(head);
 for (const d of online.everyone) {
  const s = d.results || {}; const row = el("tr");
  const cells = [d.listener || "?"];
  for (const t of ["abx1", "abx2"]) { const r = scoreOf(s, t); cells.push(r.n ? r.k + " / " + r.n + (r.n === r.of ? "  (p = " + binomTail(r.k, r.n).toFixed(3) + ")" : "") : "—"); }
  for (const pair of [TESTS.abx1, ["chorda2", "chorda1"]]) { const r = prefOf(s, pair); cells.push(r.a + " · " + r.b + " · " + r.same); }
  for (const v of cells) row.appendChild(el("td")).textContent = v;
  tb.appendChild(row);
  const notes = ((s.pref) || []).filter(q => q.note && q.note.trim()).map(q => PHRASE_NAMES[lang][q.phrase] + ": " + q.note.trim());
  if (notes.length) { const nr = el("tr"); const td = el("td"); td.colSpan = 5; td.className = "mute"; td.textContent = notes.join(" · "); nr.appendChild(td); tb.appendChild(nr); }
 }
 c.appendChild(tb);
 const lab = el("label"); lab.textContent = tr("import_files"); lab.htmlFor = "import-files";
 const inp = el("input"); inp.type = "file"; inp.id = "import-files"; inp.accept = ".json,application/json"; inp.multiple = true;
 const out = el("p", undefined, "mute");
 inp.onchange = async () => {
  let n = 0;
  for (const f of inp.files) {
   let d; try { d = JSON.parse(await f.text()); } catch (e) { out.textContent = tr("bad_file", { f: f.name }); return; }
   if (!d || !d.abx1 || !d.pref) { out.textContent = tr("bad_file", { f: f.name }); return; }
   const who = String(d.listener || f.name.replace(/\.json$/i, ""));
   try { await online.db.doc("abx/import-" + slugOf(who)).set({ listener: who, results: d, updatedAt: new Date().toISOString(), source: "import" }); n++; } catch (e) { out.textContent = String(e && e.code || e); return; }
  }
  out.textContent = tr("imported", { n: n }); inp.value = "";

 const box = el("div", undefined, "row"); box.style.marginTop = "12px"; box.appendChild(lab); box.appendChild(inp); c.appendChild(box); c.appendChild(out);
}
async function goOnline() {

 const use = n => window.claude.use(n).catch(() => null);
 const [user, db, downloads] = await Promise.all([use("user"), use("db"), use("downloads")]);
 online.downloads = downloads;
 if (!user || !db) { say(tr("cant_save")); return; }
 online.uid = await user.id(); online.owner = await user.isOwner(); online.db = db;
 if (!online.uid) { say(tr("cant_save")); return; }
 push();
 if (online.owner) db.collection("abx").onSnapshot(q => { online.everyone = q.docs.map(x => x.data() || {}).sort((a, b) => String(a.listener).localeCompare(String(b.listener))); if (tab === "res") render(); }, () => {});
}
save();
// The transport: one element per slot; switching keeps the place.
// `cur`: the trial or question on screen — every press of a slot counts in its `plays`
// (and `heard`, by slot), saved at once.
let players = {}, playing = null, looping = false, timer = null, cur = null;
function stopAll() { for (const k in players) players[k].pause(); playing = null; paint(); }

function play(k) {

 const a = players[k];

 if (cur) { cur.plays = (cur.plays || 0) + 1; cur.heard = cur.heard || {}; cur.heard[k] = (cur.heard[k] || 0) + 1; save(); }

}
function progress() { const el = document.getElementById("pos"); if (!el) return; const a = playing && players[playing]; el.style.width = a && a.duration ? (100 * a.currentTime / a.duration) + "%" : "0"; }
setInterval(progress, 50);
let tab = "abx1";
function btn(label, on, cls) { const b = document.createElement("button"); b.textContent = label; if (cls) b.className = cls; b.onclick = on; return b; }

}
let shown = null;
function paint() {

  const list = st[tab]; const i = list.findIndex(t => t.answer === null);

function choose(n, k) { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return r; }

 }

  // Whose results: a listener's name in the file and in its name, so several can be told apart.
  const who = (st.listener || "").trim();
  if (!who) { say(tr("need_name")); document.getElementById("who").focus(); return; }
  saveFile("chorda-abx-" + slugOf(who) + ".json", JSON.stringify(st, null, 1), c);
 }, "primary"));
 const reset = btn(tr("reset"), () => {
  if (!reset.dataset.armed) { reset.dataset.armed = "1"; reset.textContent = tr("reset_sure"); setTimeout(() => { delete reset.dataset.armed; reset.textContent = tr("reset"); }, 5000); return; }
  const who = st.listener; st = fresh(); st.listener = who; save(); shown = null; tab = "abx1"; render();
 });
 r.appendChild(reset);
 c.appendChild(r);
 if (online.owner) everyoneTable(c);
 const done = ["abx1", "abx2"].every(t => st[t].every(x => x.answer !== null));
 if (done) {
  c.appendChild(el("h2", tr("reveal")));
  const tb = el("table"); tb.innerHTML = "<tr><th>#</th><th>" + tr("phrase") + "</th><th>A</th><th>B</th><th>X</th><th></th></tr>";
  for (const t of ["abx1", "abx2"]) st[t].forEach((x, i) => { const row = el("tr"); row.innerHTML = "<td>" + t + "." + (i + 1) + "</td><td>" + PHRASE_NAMES[lang][x.phrase] + "</td><td>" + tr("src_" + x.a) + "</td><td>" + tr("src_" + x.b) + "</td><td>" + x.x.toUpperCase() + "</td><td>" + (x.answer === x.x ? "✓" : "✗") + "</td>"; tb.appendChild(row); });
  c.appendChild(tb);
 }
}
document.getElementById("lang-en").onclick = () => { lang = "en"; st.lang = lang; save(); render(); };
document.getElementById("lang-es").onclick = () => { lang = "es"; st.lang = lang; save(); render(); };
document.addEventListener("keydown", e => { if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return; const k = e.key.toLowerCase(); if (players[k]) play(k); else if (k === "1" && players.one) play("one"); else if (k === "2" && players.two) play("two"); else if (k === " ") { e.preventDefault(); stopAll(); } });
const whoBox = document.getElementById("who");
whoBox.value = st.listener || "";
whoBox.oninput = () => { st.listener = whoBox.value; save(); };
render();
goOnline();
</script>
