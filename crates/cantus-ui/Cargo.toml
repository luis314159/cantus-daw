[package]
name = "cantus-ui"
description = "Cantus DAW — egui user interface: transport, arrangement, piano roll, mixer."
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
cantus-core.workspace = true
cantus-dsp.workspace = true
# The system font fallback reads character maps (font_fallback.rs) with the parser egui
# itself uses: the same crate and version as epaint's, nothing new in the program.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
cantus-engine.workspace = true
# The top bar's RAM readout: the process's memory in use, read safely (ADR 0052).
cantus-rt.workspace = true
cantus-project.workspace = true
cantus-ai.workspace = true
# The MCP server (round 34, ADR 0081). r34:mcp
cantus-mcp.workspace = true
cantus-host.workspace = true
cantus-content.workspace = true
cantus-ml.workspace = true # r34:stems — the helper client (ADR 0085)
cantus-update.workspace = true
cantus-export.workspace = true
# The score: engraving, MusicXML and PDF (round 32, ADR 0075).
cantus-score.workspace = true
# Ableton Link in Rust, GPL like this crate (round 33, ADR 0078).
cantus-link.workspace = true
# The sync seam's rings (round 33).
rtrb.workspace = true
# The taskbar identity and the running window's taskbar icon (ADR 0046).
cantus-launch.workspace = true
raw-window-handle = "0.6"
egui.workspace = true
eframe.workspace = true
rfd.workspace = true
log.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
hound.workspace = true
# ADR 0024: logos and cached layers are rasterised as vectors at the exact pixel size.
# resvg / usvg: Apache-2.0 OR MIT; tiny-skia: BSD-3-Clause. No text, no raster images.
resvg = { version = "0.48", default-features = false }
tiny-skia = "0.12"
# ADR 0024 §5: the workspace docks, splits, stacks and floats its areas (MIT).
egui_dock = { version = "0.21", features = ["serde"] }

[features]
# ASIO drivers on Windows (ADR 0025 §10); see docs/round19/devices.md to build it.
asio = ["cantus-engine/asio"]

[target.'cfg(target_os = "macos")'.dependencies]
# The global menu bar and the clipboard's text on macOS (ADR 0066). MIT; already in the
# workspace through winit and eframe.
objc2 = "0.6"
# Only the parts used: the frameworks' defaults would pull six more crates.
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSDate",
    "NSGeometry",
    "NSObject",
    "NSRunLoop",
    "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSControl",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSMenu",
    "NSMenuItem",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSText",
    "NSTextField",
    "NSView",
    "NSWindow",
] }

[dev-dependencies]
tempfile = "3"
# The README's pictures (`examples/shoot_readme.rs`), written compressed; already in the
# tree through tiny-skia.
png = "0.18"

# Round 27 (ADR 0051): tests that minimise a plug-in's own window and check it comes back;
# already in the tree through cantus-host.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Cantus's window as an X11 one on Linux (`linux_desktop.rs`, ADR 0065): winit's X11
# event loop, asked for through eframe's builder hook. Already in the tree through eframe.
winit = { version = "0.30", default-features = false, features = ["x11"] }
