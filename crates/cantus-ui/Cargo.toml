[package]
name = "cantus-ui"
description = "Cantus DAW — egui user interface: transport, arrangement, piano roll, mixer."
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
cantus-core.workspace = true
cantus-dsp.workspace = true
cantus-engine.workspace = true
cantus-project.workspace = true
cantus-ai.workspace = true
cantus-host.workspace = true
cantus-content.workspace = true
raw-window-handle = "0.6"
egui.workspace = true
eframe.workspace = true
rfd.workspace = true
log.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
hound.workspace = true
# ADR 0024: logos and cached layers are rasterised as vectors at the exact pixel size.
# resvg / usvg: Apache-2.0 OR MIT; tiny-skia: BSD-3-Clause. No text, no raster images.
resvg = { version = "0.48", default-features = false }
tiny-skia = "0.12"
# ADR 0024 §5: the workspace docks, splits, stacks and floats its areas (MIT).
egui_dock = { version = "0.21", features = ["serde"] }

[features]
# ASIO drivers on Windows (ADR 0025 §10); see docs/round19/devices.md to build it.
asio = ["cantus-engine/asio"]

[dev-dependencies]
tempfile = "3"
rtrb.workspace = true
