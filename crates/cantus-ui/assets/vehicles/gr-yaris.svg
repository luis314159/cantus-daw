<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200">
  <!-- GR Yaris, side profile facing right: the short three-door hatch, its roof dropping
       to a spoiler over a steep tailgate, the dark roof, the flared rear arches, the big
       intakes and red brakes. Our own drawing (GPL-3.0-or-later, like the application);
       colours are placeholders filled from the theme. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{paint_hi}"/>
      <stop offset="0.35" stop-color="{paint}"/>
      <stop offset="0.75" stop-color="{paint_lo}"/>
      <stop offset="1" stop-color="{paint_deep}"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="{glass_hi}" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="{glass}"/>
      <stop offset="1" stop-color="{glass}"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="{shadow}" stop-opacity="0.6"/>
      <stop offset="1" stop-color="{shadow}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="{rim}"/>
      <stop offset="1" stop-color="{rim_lo}"/>
    </radialGradient>
    <path id="spoke" d="M -1.2 -7 L -2.4 -25 L 2.4 -25 L 1.2 -7 Z"/>
    <g id="wheel">
      <circle r="37" fill="{tyre}"/>
      <circle r="36.4" fill="none" stroke="{edge}" stroke-width="1.2" opacity="0.28"/>
      <circle r="34" fill="none" stroke="{tyre_hi}" stroke-width="1.4" opacity="0.7"/>
      <g opacity="{detail}">
        <circle r="27" fill="{trim}"/>
        <circle r="20" fill="{rim_lo}" opacity="0.7"/>
        <path d="M -14 -15 A 20 20 0 0 1 4 -20 L 3 -13 A 13 13 0 0 0 -9 -10 Z" fill="{accent}"/>
        <g fill="url(#rim)">
          <use href="#spoke"/>
          <use href="#spoke" transform="rotate(36)"/>
          <use href="#spoke" transform="rotate(72)"/>
          <use href="#spoke" transform="rotate(108)"/>
          <use href="#spoke" transform="rotate(144)"/>
          <use href="#spoke" transform="rotate(180)"/>
          <use href="#spoke" transform="rotate(216)"/>
          <use href="#spoke" transform="rotate(252)"/>
          <use href="#spoke" transform="rotate(288)"/>
          <use href="#spoke" transform="rotate(324)"/>
        </g>
        <circle r="26" fill="none" stroke="{rim}" stroke-width="2.2"/>
        <circle r="7" fill="url(#rim)"/>
        <circle r="2.8" fill="{trim}"/>
      </g>
      <g opacity="{simple}">
        <circle r="26" fill="url(#rim)"/>
        <circle r="16" fill="{trim}"/>
        <circle r="6" fill="{rim}"/>
      </g>
    </g>
  </defs>

  <ellipse cx="280" cy="184" rx="250" ry="10" fill="url(#shadow)"/>

  <!-- the wheel wells -->
  <path d="M 81 152 A 42 42 0 1 1 166 152 Z M 376 152 A 42 42 0 1 1 460 152 Z" fill="{trim}"/>

  <!-- the body -->
  <path d="M 58 152 C 52 150 50 144 50 136 L 51 108 C 52 100 54 92 58 82 L 66 50
           C 67 45 68 42 72 40 C 120 26 200 18 250 17 C 270 17 285 18 292 21
           C 320 36 350 60 372 76 C 410 80 450 86 482 92 C 498 95 506 100 508 108
           L 510 132 C 510 142 506 150 498 154 L 461 155 L 460 152
           A 42 42 0 1 0 376 152 L 374 158 L 168 158 L 166 152
           A 42 42 0 1 0 81 152 L 78 154 C 70 154 62 153 58 152 Z" fill="url(#body)"/>

  <!-- the dark roof and the spoiler over the tailgate -->
  <path d="M 72 40 C 120 26 200 18 250 17 C 270 17 285 18 292 21 L 288 25 C 270 22 250 22 230 23
           C 180 26 120 34 76 46 Z" fill="{trim}"/>
  <path d="M 52 37 C 70 31 98 28 124 28 L 122 35 C 98 35 74 39 58 45 Z" fill="{trim}"/>
  <path d="M 52 37 C 70 31 98 28 124 28" fill="none" stroke="{trim_hi}" stroke-width="1.2"/>

  <!-- the windows: the door's glass, the small rear quarter -->
  <path d="M 362 84 C 340 64 318 42 292 29 C 266 27 240 27 216 29 L 216 83 C 262 83.5 320 84 362 84 Z" fill="url(#glass)"/>
  <path d="M 205 31 L 205 82 C 170 78 132 70 104 60 C 100 57 100 53 104 51 C 132 42 168 34 205 31 Z" fill="url(#glass)"/>
  <path d="M 206 29 L 215 29 L 215 83 L 206 82 Z" fill="{trim}"/>
  <path d="M 300 33 L 316 41 L 278 84 L 258 84 Z" fill="{glass_hi}" opacity="0.13"/>

  <!-- the flared haunch's light, the shoulder, the lower body's shade -->
  <path d="M 62 96 C 120 84 170 86 210 92 C 280 94 340 96 400 100 L 400 103 C 340 99 280 97 210 95 C 170 90 120 89 60 101 Z" fill="{paint_hi}" opacity="0.8"/>
  <path d="M 84 108 C 110 96 150 96 176 108" fill="none" stroke="{paint_hi}" stroke-width="1.6" opacity="0.6"/>
  <path d="M 168 158 L 374 158 L 376 152 L 374 162 L 168 162 Z" fill="{trim}"/>
  <path d="M 50 136 C 50 144 52 150 58 152 C 62 153 70 154 78 154 L 80 146 C 66 146 56 142 51 132 Z" fill="{trim}"/>
  <path d="M 172 156 L 372 156" fill="none" stroke="{accent}" stroke-width="1.4"/>

  <g opacity="{detail}">
    <!-- the door, its handle, the mirror, the front bumper's intake -->
    <path d="M 218 80 C 216 104 216 132 220 156" fill="none" stroke="{paint_deep}" stroke-width="1" opacity="0.6"/>
    <path d="M 368 84 C 372 106 370 132 362 156" fill="none" stroke="{paint_deep}" stroke-width="1" opacity="0.6"/>
    <path d="M 226 99 L 242 99" fill="none" stroke="{trim}" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 330 80 C 332 72 346 70 354 74 L 354 82 C 346 85 336 84 330 80 Z" fill="{trim}"/>
    <path d="M 486 120 C 496 119 506 121 510 124 L 509 146 C 500 148 492 147 486 144 Z" fill="{trim}"/>
  </g>

  <!-- the swept headlight, the tail light -->
  <path d="M 468 91 C 484 93 500 98 507 104 L 506 110 C 494 108 480 103 468 97 Z" fill="{lamp}"/>
  <path d="M 51 96 L 62 92 L 64 104 L 51 108 Z" fill="{tail}"/>

  <!-- the silhouette's edge -->
  <path d="M 51 108 C 52 100 54 92 58 82 L 66 50 C 67 45 68 42 72 40 C 120 26 200 18 250 17
           C 270 17 285 18 292 21 C 320 36 350 60 372 76 C 410 80 450 86 482 92
           C 498 95 506 100 508 108" fill="none" stroke="{edge}" stroke-width="1.4" opacity="0.3"/>

  <use href="#wheel" x="123" y="147"/>
  <use href="#wheel" x="418" y="147"/>
</svg>
