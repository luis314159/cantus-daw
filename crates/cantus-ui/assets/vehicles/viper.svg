<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200">
  <!-- Viper GTS coupé, side profile facing right: the enormous hood with its gills, the
       cabin far back under a double-bubble roof, the short ducktail, the exhaust pipes
       along the sills and the two stripes over the top. Our own drawing
       (GPL-3.0-or-later, like the application); colours are placeholders filled from the
       theme. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{paint_hi}"/>
      <stop offset="0.32" stop-color="{paint}"/>
      <stop offset="0.72" stop-color="{paint_lo}"/>
      <stop offset="1" stop-color="{paint_deep}"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="{glass_hi}" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="{glass}"/>
      <stop offset="1" stop-color="{glass}"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{rim_hi}"/>
      <stop offset="0.45" stop-color="{chrome}"/>
      <stop offset="1" stop-color="{rim_lo}"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="{shadow}" stop-opacity="0.6"/>
      <stop offset="1" stop-color="{shadow}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="{rim_hi}"/>
      <stop offset="1" stop-color="{rim}"/>
    </radialGradient>
    <path id="spoke" d="M -3 -7 L -5.4 -27 L 5.4 -27 L 3 -7 Z"/>
    <g id="wheel">
      <circle r="39" fill="{tyre}"/>
      <circle r="38.4" fill="none" stroke="{edge}" stroke-width="1.2" opacity="0.28"/>
      <circle r="35.5" fill="none" stroke="{tyre_hi}" stroke-width="1.6" opacity="0.7"/>
      <g opacity="{detail}">
        <circle r="28.5" fill="{trim}"/>
        <circle r="21" fill="{rim_lo}" opacity="0.8"/>
        <path d="M -16 -14 A 21 21 0 0 1 2 -21 L 1 -15 A 15 15 0 0 0 -11 -10 Z" fill="{tail}"/>
        <g fill="url(#rim)">
          <use href="#spoke"/>
          <use href="#spoke" transform="rotate(72)"/>
          <use href="#spoke" transform="rotate(144)"/>
          <use href="#spoke" transform="rotate(216)"/>
          <use href="#spoke" transform="rotate(288)"/>
        </g>
        <circle r="28" fill="none" stroke="{rim_hi}" stroke-width="2.4"/>
        <circle r="8" fill="url(#rim)"/>
        <circle r="3" fill="{trim}"/>
      </g>
      <g opacity="{simple}">
        <circle r="28" fill="url(#rim)"/>
        <circle r="17" fill="{rim_lo}"/>
        <circle r="7" fill="{rim_hi}"/>
      </g>
    </g>
  </defs>

  <ellipse cx="280" cy="184" rx="268" ry="10" fill="url(#shadow)"/>

  <!-- the wheel wells -->
  <path d="M 96 150 A 45 45 0 1 1 186 150 Z M 385 150 A 45 45 0 1 1 475 150 Z" fill="{trim}"/>

  <!-- the body -->
  <path d="M 22 152 C 16 146 14 136 14 124 L 14 104 C 14 96 15 91 18 88 L 26 86
           C 60 82 96 73 124 63 C 160 52 196 45 230 43 C 248 42 262 44 270 47
           C 290 60 306 74 318 84 C 360 86 420 92 468 99 C 500 104 524 108 536 114
           C 543 118 546 124 546 132 L 545 144 C 544 149 538 152 530 152 L 475 152 L 475 150
           A 45 45 0 1 0 385 150 L 382 154 L 189 154 L 186 150
           A 45 45 0 1 0 96 150 L 94 153 C 60 154 36 154 22 152 Z" fill="url(#body)"/>

  <!-- the stripes over the top, seen along the silhouette -->
  <path d="M 26 86 C 60 82 96 73 124 63 C 160 52 196 45 230 43 C 248 42 262 44 270 47
           C 290 60 306 74 318 84 C 360 86 420 92 468 99 C 500 104 524 108 536 114
           L 533 122 C 519 116 497 112 465 107 C 420 100 360 94 315 92
           C 300 81 287 69 267 55 C 259 52 248 50 230 51 C 196 53 160 60 127 69
           C 96 80 60 89 26 94 Z" fill="{accent}"/>

  <!-- the windows: the side glass, the rear glass along the fastback -->
  <path d="M 312 88 C 298 74 282 60 266 52 C 256 49 244 49 234 50 C 226 58 222 72 224 88
           C 254 88 284 88 312 88 Z" fill="url(#glass)"/>
  <path d="M 228 48 C 190 51 150 60 112 70 L 114 74 C 152 64 190 56 226 53 Z" fill="url(#glass)" opacity="0.85"/>
  <path d="M 270 54 L 284 62 L 256 88 L 240 88 Z" fill="{glass_hi}" opacity="0.14"/>

  <!-- the light along the fender crown, the long flank's shade -->
  <path d="M 330 96 C 400 100 460 106 520 116 L 519 120 C 460 110 400 104 330 100 Z" fill="{paint_hi}" opacity="0.55"/>
  <path d="M 96 150 C 150 128 300 122 385 150 Z" fill="{paint_deep}" opacity="0.3"/>
  <path d="M 22 152 C 36 154 60 154 94 153 L 96 148 C 62 148 38 146 20 142 Z" fill="{trim}"/>
  <path d="M 475 152 L 530 152 C 538 152 544 149 545 144 L 544 140 C 538 146 530 148 476 148 Z" fill="{trim}"/>

  <!-- the side pipes under the doors -->
  <path d="M 206 147 L 368 147 C 372 147 374 149.5 374 152 C 374 154.5 372 157 368 157 L 206 157
           C 202 157 200 154.5 200 152 C 200 149.5 202 147 206 147 Z" fill="url(#pipe)"/>
  <g opacity="{detail}" fill="{rim_lo}">
    <circle cx="230" cy="152" r="1.3"/><circle cx="250" cy="152" r="1.3"/><circle cx="270" cy="152" r="1.3"/>
    <circle cx="290" cy="152" r="1.3"/><circle cx="310" cy="152" r="1.3"/><circle cx="330" cy="152" r="1.3"/>
    <circle cx="350" cy="152" r="1.3"/>
  </g>
  <ellipse cx="203" cy="152" rx="3.2" ry="4.2" fill="{trim}"/>

  <g opacity="{detail}">
    <!-- the door, the gills behind the front wheel, the hood's vents -->
    <path d="M 226 90 C 222 110 222 128 226 144" fill="none" stroke="{paint_deep}" stroke-width="1" opacity="0.6"/>
    <path d="M 318 92 C 320 110 320 128 316 144" fill="none" stroke="{paint_deep}" stroke-width="1" opacity="0.6"/>
    <path d="M 352 104 L 372 102 L 360 134 L 344 134 Z" fill="{trim}"/>
    <path d="M 356 112 L 366 111 M 353 120 L 363 119 M 350 128 L 360 127" fill="none" stroke="{paint_lo}" stroke-width="1.4"/>
    <path d="M 404 96 L 428 98 M 406 100 L 430 102" fill="none" stroke="{trim}" stroke-width="1.6" opacity="0.7"/>
    <path d="M 276 84 C 278 78 290 77 296 80 L 296 88 C 288 90 280 89 276 84 Z" fill="url(#body)"/>
  </g>

  <!-- the teardrop headlight, the tail light -->
  <path d="M 478 104 C 498 106 520 110 536 118 C 532 124 518 124 500 118 C 490 114 482 110 478 104 Z" fill="{trim}"/>
  <path d="M 484 106 C 500 108 518 112 532 119 C 528 122 516 121 502 116 C 494 113 488 110 484 106 Z" fill="{lamp}"/>
  <path d="M 14 96 L 21 95 L 21 108 L 14 109 Z" fill="{tail}"/>

  <!-- the silhouette's edge -->
  <path d="M 14 104 C 14 96 15 91 18 88 L 26 86 C 60 82 96 73 124 63 C 160 52 196 45 230 43
           C 248 42 262 44 270 47 C 290 60 306 74 318 84 C 360 86 420 92 468 99
           C 500 104 524 108 536 114 C 543 118 546 124 546 132" fill="none" stroke="{edge}" stroke-width="1.4" opacity="0.3"/>

  <use href="#wheel" x="141" y="145"/>
  <use href="#wheel" x="430" y="145"/>
</svg>
