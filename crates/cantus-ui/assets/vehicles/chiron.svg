<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200">
  <!-- Chiron, side profile facing right: the low rounded body, the long canopy, and the
       great C-line sweeping round the side intake, dividing the two-tone paint. Our own
       drawing (GPL-3.0-or-later, like the application); colours are placeholders filled
       from the theme. -->
  <defs>
    <path id="outline" d="M 18 150 C 14 144 13 136 13 126 L 14 92 C 14 86 15 82 18 80
           C 40 77 60 74 80 70 C 120 62 160 52 200 46 C 222 43 250 41 276 43
           C 300 46 330 62 370 86 C 420 92 470 98 506 105 C 526 109 538 115 543 122
           C 547 128 547 138 545 146 C 543 151 538 153 530 153 L 476 153 L 476 152
           A 46 46 0 1 0 386 152 L 384 156 L 163 156 L 160 152
           A 48 48 0 1 0 67 152 L 64 154 C 44 154 28 153 18 150 Z"/>
    <clipPath id="clip"><use href="#outline"/></clipPath>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{paint_hi}"/>
      <stop offset="0.32" stop-color="{paint}"/>
      <stop offset="0.72" stop-color="{paint_lo}"/>
      <stop offset="1" stop-color="{paint_deep}"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{accent}"/>
      <stop offset="1" stop-color="{accent_lo}"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="{glass_hi}" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="{glass}"/>
      <stop offset="1" stop-color="{glass}"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="{shadow}" stop-opacity="0.6"/>
      <stop offset="1" stop-color="{shadow}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="{rim_hi}"/>
      <stop offset="1" stop-color="{rim_lo}"/>
    </radialGradient>
    <path id="spoke" d="M -1.4 -7 L -6 -29 L -3 -29.5 L 0 -14 L 3 -29.5 L 6 -29 L 1.4 -7 Z"/>
    <g id="wheel">
      <circle r="40" fill="{tyre}"/>
      <circle r="39.4" fill="none" stroke="{edge}" stroke-width="1.2" opacity="0.28"/>
      <circle r="37" fill="none" stroke="{tyre_hi}" stroke-width="1.4" opacity="0.7"/>
      <g opacity="{detail}">
        <circle r="31" fill="{trim}"/>
        <circle r="23" fill="{rim_lo}" opacity="0.8"/>
        <path d="M -17 -15 A 23 23 0 0 1 3 -23 L 2 -16 A 16 16 0 0 0 -12 -11 Z" fill="{paint}"/>
        <g fill="url(#rim)">
          <use href="#spoke"/>
          <use href="#spoke" transform="rotate(60)"/>
          <use href="#spoke" transform="rotate(120)"/>
          <use href="#spoke" transform="rotate(180)"/>
          <use href="#spoke" transform="rotate(240)"/>
          <use href="#spoke" transform="rotate(300)"/>
        </g>
        <circle r="30.5" fill="none" stroke="{rim}" stroke-width="2.2"/>
        <circle r="7.5" fill="url(#rim)"/>
        <circle r="3" fill="{trim}"/>
      </g>
      <g opacity="{simple}">
        <circle r="30" fill="url(#rim)"/>
        <circle r="19" fill="{rim_lo}"/>
        <circle r="7" fill="{rim}"/>
      </g>
    </g>
  </defs>

  <ellipse cx="280" cy="184" rx="268" ry="10" fill="url(#shadow)"/>

  <!-- the wheel wells -->
  <path d="M 67 152 A 48 48 0 1 1 160 152 Z M 386 152 A 46 46 0 1 1 476 152 Z" fill="{trim}"/>

  <!-- the body, the dark half behind the C -->
  <use href="#outline" fill="url(#body)"/>
  <path d="M 218 0 L 218 48 C 172 58 150 96 164 124 C 174 142 200 154 244 158 L 244 200 L 0 200 L 0 0 Z
           M 276 0 L 560 0 L 560 40 C 470 30 380 36 300 46 Z" fill="url(#dark)" clip-path="url(#clip)"/>

  <!-- the canopy's glass -->
  <path d="M 362 86 C 340 70 310 54 282 50 C 262 48 240 48 222 52 C 220 64 222 76 228 87 C 270 87 320 87 362 86 Z" fill="url(#glass)"/>
  <path d="M 300 52 L 316 58 L 278 87 L 260 87 Z" fill="{glass_hi}" opacity="0.14"/>

  <!-- the side intake inside the C, and the C itself -->
  <path d="M 208 60 C 178 72 166 98 174 120 L 190 120 C 184 100 192 78 214 66 Z" fill="{trim}"/>
  <path d="M 218 48 C 172 58 150 96 164 124 C 174 142 200 154 244 157" fill="none" stroke="{chrome}" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 218 48 C 172 58 150 96 164 124 C 174 142 200 154 244 157" fill="none" stroke="{rim_hi}" stroke-width="1.4" stroke-linecap="round"/>

  <!-- the light on the shoulders, the lower body -->
  <path d="M 380 92 C 440 98 500 106 536 118 L 534 122 C 500 110 440 102 380 96 Z" fill="{paint_hi}" opacity="0.6"/>
  <path d="M 20 86 C 60 82 110 78 160 78 L 158 82 C 110 82 60 86 18 91 Z" fill="{accent}" opacity="0.6"/>
  <path d="M 163 156 L 384 156 L 386 152 L 384 159 L 163 159 Z" fill="{trim}"/>
  <path d="M 18 150 C 28 153 44 154 64 154 L 67 146 C 46 146 28 143 15 136 Z" fill="{trim}"/>
  <path d="M 476 153 L 530 153 C 538 153 543 151 545 146 L 545 140 C 538 147 530 149 476 149 Z" fill="{trim}"/>

  <g opacity="{detail}">
    <!-- the door, the mirror, the spine over the engine -->
    <path d="M 366 90 C 370 110 368 132 360 152" fill="none" stroke="{paint_deep}" stroke-width="1" opacity="0.6"/>
    <path d="M 334 78 L 330 70" fill="none" stroke="{trim}" stroke-width="2.4"/>
    <path d="M 318 64 C 322 58 336 58 342 62 C 342 68 334 71 326 71 C 321 70 318 68 318 64 Z" fill="url(#dark)"/>
    <path d="M 40 76 C 90 68 150 54 210 46" fill="none" stroke="{trim_hi}" stroke-width="1.4" opacity="0.7"/>
    <path d="M 500 122 C 512 121 528 124 540 130 L 538 144 C 526 146 512 145 500 142 Z" fill="{trim}" opacity="0.85"/>
  </g>

  <!-- the headlights' slit, the tail's light bar -->
  <path d="M 488 106 C 506 108 524 112 536 118 L 533 121 C 520 117 504 113 486 111 Z" fill="{lamp}"/>
  <path d="M 13 86 L 26 84 L 26 88 L 13 90 Z" fill="{tail}"/>

  <!-- the silhouette's edge -->
  <path d="M 14 92 C 14 86 15 82 18 80 C 40 77 60 74 80 70 C 120 62 160 52 200 46
           C 222 43 250 41 276 43 C 300 46 330 62 370 86 C 420 92 470 98 506 105
           C 526 109 538 115 543 122" fill="none" stroke="{edge}" stroke-width="1.4" opacity="0.3"/>

  <use href="#wheel" transform="translate(113.5 142.5) scale(1.04)"/>
  <use href="#wheel" x="431" y="144"/>
</svg>
