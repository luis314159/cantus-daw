<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200">
  <!-- SR-71 Blackbird, seen from above, nose to the right: the long fuselage with its
       chines blending into the delta wing, the two great nacelles with their inlet spikes,
       the twin fins on them and the afterburners' glow. Our own drawing
       (GPL-3.0-or-later, like the application); colours are placeholders filled from the
       theme. -->
  <defs>
    <!-- half the plan (above the centre line); the other half is its mirror -->
    <path id="half" d="M 462.7 100 C 440 99 420 92 409.6 89.9 C 390 87 372 84.5 364.8 83.2
           C 345 80 330 78 320 76.5 C 305 74 296 72 292 70.9 L 239.4 61.9 L 259.5 60.5
           L 259.5 46.5 L 226 45.6 L 152 9.5 C 149 8 146 7.5 143 7.5 L 126 7.5
           C 123 7.5 121 8.5 120.5 10 L 110 45.4 L 89.3 47 L 89.3 60 L 108 61.8
           L 112 89 C 103 92 92 97 84 100 Z"/>
    <path id="nacelle" d="M 89.3 47 C 120 43.6 200 42.6 259.5 46.5 L 259.5 60.5 C 200 64.4 120 63.4 89.3 60 Z"/>
    <path id="spike" d="M 259.5 47.3 L 293 53.5 L 259.5 59.7 Z"/>
    <path id="chine" d="M 462.7 100 C 440 99 420 92 409.6 89.9 C 390 87 372 84.5 364.8 83.2
           C 345 80 330 78 320 76.5 C 305 74 296 72 292 70.9 L 239.4 61.9"/>
    <linearGradient id="skin" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="{paint_hi}"/>
      <stop offset="0.3" stop-color="{paint}"/>
      <stop offset="1" stop-color="{paint_lo}"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{paint_lo}"/>
      <stop offset="0.45" stop-color="{paint_hi}"/>
      <stop offset="1" stop-color="{paint_deep}"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{rim_hi}"/>
      <stop offset="1" stop-color="{rim_lo}"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="{lamp}"/>
      <stop offset="0.35" stop-color="{accent}" stop-opacity="0.9"/>
      <stop offset="1" stop-color="{accent}" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="{glass_hi}"/>
      <stop offset="0.5" stop-color="{glass}"/>
      <stop offset="1" stop-color="{glass}"/>
    </linearGradient>
  </defs>

  <g transform="translate(7 0)">
    <!-- its shadow far below -->
    <g transform="translate(10 8)" fill="{shadow}" opacity="0.22">
      <use href="#half"/>
      <use href="#half" transform="matrix(1 0 0 -1 0 200)"/>
    </g>

    <!-- the burners' glow -->
    <ellipse cx="84" cy="53.5" rx="16" ry="10" fill="url(#glow)"/>
    <ellipse cx="84" cy="146.5" rx="16" ry="10" fill="url(#glow)"/>

    <!-- the plan, shaded from the spine out to the edges -->
    <use href="#half" fill="url(#skin)"/>
    <use href="#half" fill="url(#skin)" transform="matrix(1 0 0 -1 0 200)"/>

    <!-- the nacelles, their spikes, the fins on them -->
    <use href="#nacelle" fill="url(#tube)"/>
    <use href="#nacelle" fill="url(#tube)" transform="matrix(1 0 0 -1 0 200)"/>
    <use href="#spike" fill="url(#cone)"/>
    <use href="#spike" fill="url(#cone)" transform="matrix(1 0 0 -1 0 200)"/>
    <path d="M 96 52.2 L 146 51.4 L 146 55.2 L 96 55 Z M 96 145 L 146 144.8 L 146 148.6 L 96 147.8 Z" fill="{paint_deep}"/>

    <g opacity="{detail}">
      <!-- the chines' lit edge, the spine, the canopies -->
      <use href="#chine" fill="none" stroke="{paint_hi}" stroke-width="1.2" opacity="0.7"/>
      <use href="#chine" fill="none" stroke="{paint_hi}" stroke-width="1.2" opacity="0.7" transform="matrix(1 0 0 -1 0 200)"/>
      <path d="M 120 100 L 372 100" fill="none" stroke="{paint_hi}" stroke-width="1.4" opacity="0.35"/>
      <path d="M 226 45.6 C 240 44 252 44.4 262 46 M 226 154.4 C 240 156 252 155.6 262 154" fill="none" stroke="{paint_hi}" stroke-width="1" opacity="0.6"/>
    </g>
    <ellipse cx="394" cy="100" rx="12" ry="3.2" fill="url(#glass)"/>
    <ellipse cx="373" cy="100" rx="6" ry="2.6" fill="url(#glass)"/>

    <!-- the silhouette's edge -->
    <use href="#half" fill="none" stroke="{edge}" stroke-width="1.3" opacity="0.4"/>
    <use href="#half" fill="none" stroke="{edge}" stroke-width="1.3" opacity="0.4" transform="matrix(1 0 0 -1 0 200)"/>
  </g>
</svg>
