<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200">
  <!-- Grom, side profile facing right: the small single-cylinder bike on fat 12-inch
       tyres, its big plastic shroud over a tiny tank, the long flat seat, the gold
       upside-down fork, the angular lamp and the tall mirrors. Our own drawing
       (GPL-3.0-or-later, like the application); colours are placeholders filled from the
       theme. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{paint_hi}"/>
      <stop offset="0.4" stop-color="{paint}"/>
      <stop offset="1" stop-color="{paint_lo}"/>
    </linearGradient>
    <linearGradient id="fork" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="{accent_lo}"/>
      <stop offset="0.45" stop-color="{accent}"/>
      <stop offset="1" stop-color="{accent_lo}"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="{shadow}" stop-opacity="0.6"/>
      <stop offset="1" stop-color="{shadow}" stop-opacity="0"/>
    </radialGradient>
    <path id="spoke" d="M -2 -5 L -3.4 -16.5 L 3.4 -16.5 L 2 -5 Z"/>
    <g id="wheel">
      <circle r="29" fill="{tyre}"/>
      <circle r="28.4" fill="none" stroke="{edge}" stroke-width="1.2" opacity="0.28"/>
      <circle r="25.5" fill="none" stroke="{tyre_hi}" stroke-width="1.4" opacity="0.75"/>
      <circle r="18" fill="{trim_hi}"/>
      <g opacity="{detail}">
        <circle r="16" fill="{trim}"/>
        <circle r="11" fill="none" stroke="{rim_lo}" stroke-width="3.4"/>
        <g fill="{trim_hi}">
          <use href="#spoke"/>
          <use href="#spoke" transform="rotate(72)"/>
          <use href="#spoke" transform="rotate(144)"/>
          <use href="#spoke" transform="rotate(216)"/>
          <use href="#spoke" transform="rotate(288)"/>
        </g>
        <circle r="17.5" fill="none" stroke="{rim}" stroke-width="1.2"/>
        <circle r="4.4" fill="{rim}"/>
      </g>
      <g opacity="{simple}">
        <circle r="9" fill="{trim}"/>
        <circle r="4" fill="{rim}"/>
      </g>
    </g>
  </defs>

  <ellipse cx="292" cy="184" rx="122" ry="8" fill="url(#shadow)"/>

  <!-- the plate hanger and its indicator, the swing arm -->
  <path d="M 208 90 L 198 96 L 176 136 L 182 138 L 204 100 Z" fill="{trim}"/>
  <ellipse cx="184" cy="104" rx="6" ry="3.4" fill="{accent}"/>
  <path d="M 276 131 L 283 139 L 220 160 L 213 151 Z" fill="{trim}"/>
  <path d="M 276 133 L 216 153" fill="none" stroke="{trim_hi}" stroke-width="1.2"/>

  <use href="#wheel" x="216" y="155"/>

  <!-- the engine, the frame, the footpeg hanger -->
  <path d="M 258 128 L 330 122 C 338 136 337 156 326 168 L 290 171 C 270 166 258 150 258 128 Z" fill="{trim}"/>
  <path d="M 300 150 L 328 148 M 300 157 L 326 156 M 300 164 L 322 163" fill="none" stroke="{trim_hi}" stroke-width="1.6"/>
  <circle cx="281" cy="141" r="9" fill="{rim_lo}"/>
  <circle cx="281" cy="141" r="4" fill="{rim}"/>
  <path d="M 340 76 L 352 82 L 288 133 L 276 128 Z" fill="{trim}"/>
  <path d="M 242 134 L 262 132 L 282 152 L 272 161 Z" fill="{rim_lo}"/>
  <path d="M 268 150 L 286 150" fill="none" stroke="{rim}" stroke-width="3" stroke-linecap="round"/>

  <!-- the rear cowl and tail light, the seat -->
  <path d="M 204 84 L 238 88 L 252 104 L 212 100 C 205 96 203 90 204 84 Z" fill="url(#body)"/>
  <path d="M 198 84 L 206 82 L 210 95 L 201 96 Z" fill="{tail}"/>
  <path d="M 202 80 C 228 74 268 76 288 86 C 295 89 300 87 305 82 L 308 92 C 282 99 232 97 206 94 Z" fill="{trim}"/>
  <path d="M 204 79 C 228 74 268 76 288 85 C 295 88 300 86 305 81" fill="none" stroke="{trim_hi}" stroke-width="1.6"/>
  <path d="M 238 96 L 290 96 L 298 112 L 266 124 Z" fill="{trim_hi}"/>

  <!-- the shroud over the tank, its dark lower panel -->
  <path d="M 296 82 C 310 73 330 71 344 78 L 362 98 L 360 116 L 344 124 L 300 128 L 272 126 L 290 104 Z" fill="url(#body)"/>
  <path d="M 276 124 L 300 126 L 344 122 L 352 116 L 330 113 L 292 116 Z" fill="{trim}"/>
  <path d="M 300 84 C 314 77 330 76 342 81" fill="none" stroke="{paint_hi}" stroke-width="1.6" opacity="0.8"/>
  <g opacity="{detail}">
    <path d="M 304 96 L 340 92 L 350 104" fill="none" stroke="{paint_lo}" stroke-width="1.2"/>
  </g>

  <use href="#wheel" x="372" y="155"/>

  <!-- the gold fork, the front mudguard -->
  <path d="M 349 80 L 360 79 L 376 155 L 367 157 Z" fill="url(#fork)"/>
  <path d="M 357 120 L 365 119 L 376 155 L 367 157 Z" fill="{trim}"/>
  <path d="M 350 129 C 360 119 384 119 396 129 L 392 133 C 382 125 362 125 354 133 Z" fill="url(#body)"/>

  <!-- the lamp's cowl and lens, the handlebar and mirrors -->
  <path d="M 356 72 L 374 69 L 383 86 L 381 104 L 365 109 L 356 92 Z" fill="{trim}"/>
  <path d="M 376 76 L 382 87 L 380 101 L 374 103 Z" fill="{lamp}"/>
  <path d="M 312 60 L 358 66" fill="none" stroke="{trim}" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M 312 60 L 322 61" fill="none" stroke="{trim_hi}" stroke-width="5.4" stroke-linecap="round"/>
  <path d="M 350 65 L 352 78" fill="none" stroke="{trim}" stroke-width="4"/>
  <path d="M 330 64 L 323 41 M 356 66 L 362 38" fill="none" stroke="{trim}" stroke-width="1.8"/>
  <ellipse cx="322" cy="35" rx="5.5" ry="6.5" fill="{trim}"/>
  <ellipse cx="363" cy="31" rx="7" ry="8" fill="{trim}"/>
  <ellipse cx="364" cy="31" rx="4.6" ry="5.6" fill="{glass_hi}" opacity="0.5"/>
</svg>
