note = "A resonant, chorused saw chord with a medium decay: the Detroit chord."
styles = ["house"]
roles = ["keys"]
tags = ["preset.tag.keys"]
[preset.values]
"chorus.mode" = 1
"env1.d" = 400
"env1.s" = 0.3
"env2.d" = 600
"env2.s" = 0.4
"gain" = 7.3
"mod1.amt" = 0.4
"mod2.amt" = 0.3
"vcf.cutoff" = 900
"vcf.env" = 2
"vcf.reso" = 0.4
[preset.text]
"macro1.name" = "Brightness"
"macro2.name" = "Bite"
"mod1.dst" = "vcf.cutoff"
"mod1.src" = "macro1"
"mod2.dst" = "vcf.drive"
"mod2.src" = "macro2"

[[preset]]
key = "calor.preset.siren_glide"
