"mix.osc1" = 0
"mix.osc2" = 0
"mod1.amt" = 0.01
"mod2.amt" = 0.08
"vca.drive" = 1
"vcf.cutoff" = 261.63
"vcf.drive" = 12
"vcf.env" = 0
