# Gravis: factory presets (ADR 0101). Names are locale keys (the unit's locale file).
# `cargo run --release -p cantus-ui --example preset_tool -- fit` sets the levels;
# the tests check every key, value, style and role (`preset_data`, `preset_render`).

[[preset]]
key = "bass.preset.trap_long"
note = "A long 808 that glides between notes, its drive and length on the macros."
styles = ["trap"]
roles = ["bass"]
tags = ["bass.tag.808", "bass.tag.trap"]
[preset.values]
"808.decay" = 3000
"808.harmonics" = 0.3
"808.pitch" = 12
"808.pitch_time" = 40
"808.release" = 400
"808.sustain" = 0.7
"drive" = 0.35
"gain" = -2.6
"glide" = 90
"glide.trigger" = 1
"mod1.amt" = 0.5
"mod2.amt" = 0.4
"subsonic" = 25
[preset.text]
"macro1.name" = "Drive"
"macro2.name" = "Length"
"mod1.dst" = "drive"
"mod1.src" = "macro1"
"mod2.dst" = "808.decay"
"mod2.src" = "macro2"

