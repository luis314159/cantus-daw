roles = ["creative"]
[preset.values]
"div" = 11
"freq" = 330
"lfo" = 7
"mix" = 0.7
"out" = -0.4
"shape" = 5
"sync" = 1

[[preset]]
key = "preset.anulus.lofi_radio"
note = "A low, faint carrier: the sound of a cheap radio."
