roles = ["creative"]
[preset.values]
"freq" = 2200
"mix" = 0.3
"out" = -2
"spread" = 90

[[preset]]
key = "preset.anulus.random_steps"
note = "The carrier jumps on every eighth: a sample-and-hold ring."
