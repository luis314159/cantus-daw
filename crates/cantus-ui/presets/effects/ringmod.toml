styles = ["house", "film"]
roles = ["drums"]
[preset.values]
"freq" = 1250
"mix" = 0.45
"out" = -6.6
"wave" = 2

[[preset]]
key = "preset.anulus.stereo_shimmer"
note = "A high carrier, a little, opposite sides: a glassy air."
