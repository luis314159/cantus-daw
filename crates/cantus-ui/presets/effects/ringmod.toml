# Anulus ring modulator: factory presets (ADR 0101). Names are locale keys (the unit's locale file).
# `cargo run --release -p cantus-ui --example preset_tool -- fit` sets the levels;
# the tests check every key, value, style and role (`preset_data`, `preset_render`).

[[preset]]
key = "preset.anulus.bell"
note = "A carrier a fifth above: metal bells out of anything."
styles = ["film", "ambient"]
roles = ["creative"]
[preset.values]
"freq" = 587
"mix" = 0.6
"out" = -1.6

[[preset]]
key = "preset.anulus.robot"
note = "A low square carrier on a voice: the robot."
styles = ["film"]
roles = ["vocal"]
[preset.values]
"freq" = 55
"mix" = 1
"wave" = 2

[[preset]]
key = "preset.anulus.dalek"
note = "Thirty hertz on a voice: the classic science-fiction villain."
styles = ["film"]
roles = ["vocal"]
[preset.values]
"freq" = 30
"mix" = 1
"out" = 3

[[preset]]
key = "preset.anulus.through_zero_tremolo"
note = "A carrier so slow it is a tremolo that flips the polarity."
styles = ["rock", "film"]
roles = ["creative"]
[preset.values]
"freq" = 4
"mix" = 1
"out" = 5
"wave" = 1

[[preset]]
key = "preset.anulus.siren"
note = "The carrier swept by an LFO: an alarm."
styles = ["film", "house"]
roles = ["creative"]
[preset.values]
"freq" = 700
"lfo" = 12
"mix" = 0.8
"rate" = 0.4
"shape" = 1

[[preset]]
key = "preset.anulus.metal_drums"
