# Lapsus time shaper: factory presets (ADR 0101). Names are locale keys (the unit's locale file).
# Each names a time pattern and a volume pattern of the factory banks (`tslot`, `vslot`, 0-based).
# `cargo run --release -p cantus-ui --example preset_tool -- fit` sets the levels;
# the tests check every key, value, style and role (`preset_data`, `preset_render`).

[[preset]]
key = "preset.lapsus.half_time"
note = "Half time every half bar: each half bar's first beat an octave down. What the insert starts with."
styles = ["trap", "house"]
roles = ["creative", "drums"]
[preset.values]
"mix" = 1
"tslot" = 7
"vslot" = 0

[[preset]]
key = "preset.lapsus.tape_stop"
note = "Tape stop on the last beat, its level falling with its speed: every bar winds down onto the next."
styles = ["trap", "house", "pop"]
roles = ["creative", "bus"]
[preset.values]
"mix" = 1
"tslot" = 3
"vslot" = 21

[[preset]]
key = "preset.lapsus.tape_stop_bar"
note = "The whole bar winding down to a stop, and back on the line."
styles = ["trap", "lofi"]
roles = ["creative", "fx"]
[preset.values]
"mix" = 1
"tslot" = 1
"vslot" = 23

[[preset]]
key = "preset.lapsus.tape_start"
