# Delay: factory presets (ADR 0101). Names are locale keys (the unit's locale file).
# `cargo run --release -p cantus-ui --example preset_tool -- fit` sets the levels;
# the tests check every key, value, style and role (`preset_data`, `preset_render`).

[[preset]]
key = "delay.preset.slapback"
note = "A single short repeat: the rockabilly and classic rock vocal slap."
styles = ["rock", "jazz"]
roles = ["vocal"]
[preset.values]
"feedback" = 0.08
"mix" = 0.22
"ping_pong" = 0
"time_ms" = 95
"tone_hz" = 5000

[[preset]]
key = "delay.preset.eighth_echo"
note = "Eighth notes at 120 BPM, a few repeats under a pop vocal."
styles = ["pop", "rnb"]
roles = ["vocal"]
[preset.values]
"feedback" = 0.32
"mix" = 0.18
"ping_pong" = 0
"time_ms" = 250
"tone_hz" = 6000

