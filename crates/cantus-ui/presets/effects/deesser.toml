# Sibilus de-esser: Factory presets (ADR 0101). Names are locale keys. `preset_tool -- fit` sets the levels;
# the tests check every key, value, style and role (`preset_data`, `preset_render`).

[[preset]]
key = "ds.preset.male"
note = "Sibilance between 4 and 9 kHz, a lower voice."
styles = ["rock", "pop"]
roles = ["vocal"]
[preset.values]
"hi" = 9000
"lo" = 4000
"range" = 6
"rel" = 50
"thr" = -34

[[preset]]
key = "ds.preset.female"
note = "Sibilance between 5.5 and 12 kHz, a higher voice."
styles = ["pop", "rnb"]
roles = ["vocal"]
[preset.values]
"hi" = 12000
"lo" = 5500
"range" = 6
"rel" = 40
"thr" = -34

