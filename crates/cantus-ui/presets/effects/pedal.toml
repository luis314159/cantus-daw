"si.dist" = 0.5
"si.tone" = 0.55
"si.level" = 0.5
"mix" = 0.4

[[preset]]
key = "preset.fragor.synth_fuzz"
note = "A synth through the fuzz and the muff: a buzzing, wide lead."
styles = ["house", "trap"]
roles = ["lead"]
[preset.values]
"s1" = 4
"s2" = 5
"ge.fuzz" = 0.7
"ge.bias" = 0.9
"ge.vol" = 0.5
"mf.sustain" = 0.4
"mf.tone" = 0.55
"mf.vol" = 0.5

[[preset]]
key = "preset.fragor.vocal_grit"
note = "A little overdrive blended under a voice: edge without losing the words."
styles = ["rock", "pop"]
roles = ["vocal"]
[preset.values]
"s1" = 1
"od.drive" = 0.4
"od.tone" = 0.65
"od.level" = 0.5
"mix" = 0.35

[[preset]]
key = "preset.fragor.lofi_radio"
note = "The op-amp distortion with its filter closed: a small radio's speaker."
