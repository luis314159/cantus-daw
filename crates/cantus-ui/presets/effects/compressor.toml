# Comprimo compressor: factory presets (ADR 0101). Names are locale keys (the unit's locale file).
# `cargo run --release -p cantus-ui --example preset_tool -- fit` sets the levels;
# the tests check every key, value, style and role (`preset_data`, `preset_render`).

[[preset]]
key = "comp.preset.vocal"
note = "Opto-style levelling of a vocal, its sidechain blind under 120 Hz."
styles = ["pop", "rnb"]
roles = ["vocal"]
[preset.values]
"att" = 5
"auto_gain" = 1
"auto_rel" = 1
"knee" = 12
"ratio" = 3
"rel" = 150
"sc0.freq" = 120
"sc0.shape" = 3
"sc0.slope" = 24
"sc0.used" = 1
"style" = 4
"thr" = -24

[[preset]]
key = "comp.preset.drum_bus"
note = "Slow attack so the hits pass, a little mixed back: a drum bus that punches."
styles = ["rock", "house"]
roles = ["drums"]
[preset.values]
"att" = 20
"auto_gain" = 1
"knee" = 6
"mix" = 0.8
"ratio" = 4
"rel" = 100
"style" = 3
"thr" = -20

[[preset]]
key = "comp.preset.parallel"
note = "Crushed and only wet, for a parallel channel under the dry drums."
styles = ["rock", "trap"]
roles = ["drums"]
[preset.values]
"att" = 1
"dry" = 0
"knee" = 0
"makeup" = -13.8
"ratio" = 10
"rel" = 60
"style" = 1
"thr" = -36

[[preset]]
key = "comp.preset.glue"
note = "Two to one, slow, soft knee: a mix bus that holds together."
