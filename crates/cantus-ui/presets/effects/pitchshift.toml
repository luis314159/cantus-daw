# Saltus pitch: factory presets (ADR 0101). Names are locale keys (the unit's locale file).
# The fx side round's wave-3 contract: none yet — saltus's builder writes them here.
# `cargo run --release -p cantus-ui --example preset_tool -- fit` sets the levels;
# the tests check every key, value, style and role (`preset_data`, `preset_render`).

[[preset]]
key = "preset.saltus.twelve_string"
note = "An octave up at 60 % over the dry, by the poly engine: a guitar's chords ring like a twelve-string."
styles = ["rock", "worship"]
roles = ["creative", "bus"]
[preset.values]
"dry" = 1.0
"engine" = 1
"lvl1" = 0.6
"out" = -1.3
"st1" = 12

[[preset]]
key = "preset.saltus.fifth_live"
note = "A fifth up at half level over the dry, by the mono engine: 2.7 ms, for a lead or a voice played live."
styles = ["rock", "pop"]
roles = ["vocal", "creative"]
[preset.values]
"dry" = 1.0
"lvl1" = 0.5
"out" = -1.0
"st1" = 7

[[preset]]
key = "preset.saltus.octave_down_live"
note = "An octave down under the dry, by the mono engine with the formants kept: a bass line doubled live."
styles = ["rock", "latin"]
roles = ["creative", "bus"]
[preset.values]
"dry" = 1.0
"lvl1" = 0.7
"out" = -1.5
"st1" = -12
