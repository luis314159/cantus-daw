# Fervor saturator: factory presets (ADR 0101). Names are locale keys (the unit's locale file).
# `cargo run --release -p cantus-ui --example preset_tool -- fit` sets the levels;
# the tests check every key, value, style and role (`preset_data`, `preset_render`).

[[preset]]
key = "preset.sat.tape_bus"
note = "Seven decibels of tape on a bus: warmer, rounder."
styles = ["pop", "rock"]
roles = ["bus"]
[preset.values]
"char" = 0.5
"drive" = 7
"model" = 0
"os" = 2

[[preset]]
key = "preset.sat.tape_drums"
note = "Drums hit hard into tape: squash and grit."
styles = ["rock", "lofi"]
roles = ["drums"]
[preset.values]
"char" = 0.85
"drive" = 18
"lo_cut" = 35
"model" = 0
"os" = 2
"out" = -0.9

[[preset]]
key = "preset.sat.tube_vocal"
note = "A tube preamp on a vocal: presence and a little hair."
styles = ["pop", "rnb"]
roles = ["vocal"]
[preset.values]
"bias" = 0.1
"char" = 0.4
"drive" = 10
"model" = 1
"os" = 1
"tone" = 1

[[preset]]
key = "preset.sat.tube_master"
note = "A light tube colour on the whole mix, the lows kept mono-clean."
styles = ["pop", "jazz"]
roles = ["master"]
[preset.values]
"chan" = 1
"char" = 0.3
"drive" = 4
"model" = 1
"os" = 2

[[preset]]
