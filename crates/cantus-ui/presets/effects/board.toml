# Tabula pedalboard: factory presets (ADR 0101). Names are locale keys (the unit's locale file).
# The boards are written in code (`cantus_core::fx::tabula_presets::factory`): a board
# preset holds its pedals, which a data file cannot; their styles and roles are here.
# The tests check every key, style and role (`preset_data`, `preset_audit`).

