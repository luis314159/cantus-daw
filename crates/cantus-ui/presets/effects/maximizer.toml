# Culmen maximizer: factory presets (ADR 0101). Names are locale keys (the unit's locale file).
# `cargo run --release -p cantus-ui --example preset_tool -- fit` sets the levels;
# the tests check every key, value, style and role (`preset_data`, `preset_render`).

[[preset]]
key = "preset.max.transparent"
note = "Gentle and clear: a little louder, nothing changed."
styles = ["pop", "film"]
roles = ["master"]
[preset.values]
"all.att" = 30
"all.knee" = 12
"all.ratio" = 1.5
"all.rel" = 300
"all.thr" = -18
"gain" = 3

[[preset]]
key = "preset.max.streaming"
note = "Towards -14 LUFS with -1 dBTP: a streaming master."
styles = ["pop", "rnb"]
roles = ["master"]
[preset.values]
"all.knee" = 10
"all.ratio" = 1.4
"all.thr" = -16
"ceiling" = -1
"gain" = 6
"lo.att" = 30
"lo.ratio" = 2
"lo.rel" = 200
"lo.thr" = -20
"target" = -14

[[preset]]
key = "preset.max.loud"
note = "Towards -8 LUFS: a loud modern master."
styles = ["trap", "house"]
roles = ["master"]
[preset.values]
"all.ratio" = 2
"all.ratio_lo" = 1.5
"all.thr" = -20
"all.thr_lo" = -40
"ceiling" = -0.3
"clip" = 0.4
"gain" = 10
"link_t" = 0.6
"mid.ratio" = 1.5
"mid.thr" = -22
"style" = 2
"target" = -8

