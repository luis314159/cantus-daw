# Caelum shimmer reverb: factory presets (ADR 0101). Names are locale keys (the unit's locale file).
# The first eleven are `cantus_dsp::caelum::presets::factory()` as written (a test compares
# them, the output aside). No preset starts frozen: a tank frozen from its first sample
# holds silence (Freeze swell asks for Freeze by hand).
# `cargo run --release -p cantus-ui --example preset_tool -- fit` sets the levels;
# the tests check every key, value, style and role (`preset_data`, `preset_render`).

[[preset]]
key = "preset.caelum.octave_shimmer"
note = "A wide space whose tail climbs an octave, softly: the starting preset."
styles = ["worship", "ambient"]
roles = ["creative"]
[preset.values]
"decay" = 6.5
"diff" = 0.8
"hdec" = 0.45
"hhz" = 7000
"mdepth" = 0.35
"mix" = 0.35
"mrate" = 0.35
"out" = -0.9
"pre" = 30
"shim" = 0.55
"size" = 0.72
"slo" = 350

