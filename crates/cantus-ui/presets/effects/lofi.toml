# Vetus lo-fi: factory presets (ADR 0101). Names are locale keys (the unit's locale file).
# `cargo run --release -p cantus-ui --example preset_tool -- fit` sets the levels;
# the tests check every key, value, style and role (`preset_data`, `preset_render`).

[[preset]]
key = "preset.vetus.worn_cassette"
note = "A worn cassette: wow and flutter, tape hiss, the tape's band, a little age — what the insert starts with."
styles = ["lofi", "pop"]
roles = ["creative", "bus"]
[preset.values]
"age.drop" = 0.2
"age.on" = 1
"age.wear" = 0.3
"crackle" = 0
"flut" = 5
"hiss" = 0.3
"noise.on" = 1
"out" = -2.9
"tone.hi" = 10000
"tone.on" = 1
"wob.on" = 1
"wow" = 14

[[preset]]
key = "preset.vetus.lofi_hip_hop"
note = "Lo-fi hip-hop keys: a warbling tape, vinyl dust that follows the music, the cassette's band, a little Character."
