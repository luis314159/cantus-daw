# Spatium reverb: factory presets (ADR 0101). Names are locale keys (the unit's locale file).
# `cargo run --release -p cantus-ui --example preset_tool -- fit` sets the levels;
# the tests check every key, value, style and role (`preset_data`, `preset_render`).

[[preset]]
key = "space.preset.vocal_plate"
note = "A bright plate behind a vocal, its lows cut."
styles = ["pop", "rnb"]
roles = ["vocal"]
[preset.values]
"bright" = 0.6
"decay" = 1.8
"e0.freq" = 180
"e0.shape" = 3
"e0.used" = 1
"mix" = 0.2
"predelay" = 30
"space" = 0.45
"style" = 1

[[preset]]
key = "space.preset.drum_room"
note = "A short room for a kit: the drums in one place."
styles = ["rock", "pop"]
roles = ["drums"]
[preset.values]
"character" = 0.15
"decay" = 0.6
"distance" = 0.2
"er" = 4
"mix" = 0.3
"space" = 0.2

