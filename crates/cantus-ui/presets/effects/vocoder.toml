# Loquax vocoder: factory presets (ADR 0101). Names are locale keys (the unit's locale file).
# The fx side round's wave A: the starting preset only until phase B adds the rest.
# `cargo run --release -p cantus-ui --example preset_tool -- fit` sets the levels;
# the tests check every key, value, style and role (`preset_data`, `preset_render`).

[[preset]]
key = "preset.loquax.robot"
note = "The synthesiser drones C3 while the voice speaks, sixteen bands, all wet: the starting preset."
styles = ["house", "pop"]
roles = ["vocal", "creative"]
[preset.values]
"bands" = 16
"mix" = 1
"robot" = 1
