# Impetus transient shaper: factory presets (ADR 0101). Names are locale keys (the unit's locale file).
# `cargo run --release -p cantus-ui --example preset_tool -- fit` sets the levels;
# the tests check every key, value, style and role (`preset_data`, `preset_render`).

[[preset]]
key = "preset.impetus.punch"
note = "More attack on every hit."
styles = ["rock", "pop"]
roles = ["drums"]
[preset.values]
"attack" = 0.4
"out" = -2.8
"speed" = 12

[[preset]]
key = "preset.impetus.snap"
note = "Attack above 1.5 kHz only: snap without boom."
styles = ["pop", "house"]
roles = ["drums"]
[preset.values]
"attack" = 0.8
"band" = 1
"out" = -2
"speed" = 6
"xover" = 1500

[[preset]]
key = "preset.impetus.soften"
note = "Less attack: softer, further away."
