# Flexus flanger: factory presets (ADR 0101). Names are locale keys (the unit's locale file).
# `cargo run --release -p cantus-ui --example preset_tool -- fit` sets the levels;
# the tests check every key, value, style and role (`preset_data`, `preset_render`).

[[preset]]
key = "preset.flexus.jet"
note = "The jet-plane sweep: slow, deep, a lot of feedback."
styles = ["rock", "pop"]
roles = ["creative"]
[preset.values]
"depth" = 6
"fb" = 0.75
"mix" = 0.5
"out" = -0.3
"rate" = 0.15

[[preset]]
key = "preset.flexus.tape_tz"
note = "Through-zero tape flanging: the two copies cross and cancel at the centre."
styles = ["rock", "film"]
roles = ["creative"]
[preset.values]
"depth" = 8
"invert" = 1
"mix" = 0.5
"out" = -2.7
"rate" = 0.12
"shape" = 0
"tz" = 1

[[preset]]
key = "preset.flexus.mistress"
note = "The slow, singing sweep of the classic pedal on a clean guitar."
styles = ["rock", "ambient"]
roles = ["creative"]
[preset.values]
"delay" = 1
"depth" = 5
"fb" = 0.55
"mix" = 0.5
"out" = 0.7
"rate" = 0.08

[[preset]]
key = "preset.flexus.negative_metal"
note = "Negative feedback: a hollow, metallic ring."
styles = ["film", "rock"]
roles = ["creative"]
[preset.values]
"depth" = 3
"fb" = -0.85
"mix" = 0.5
"out" = -4.7
"rate" = 0.4

[[preset]]
key = "preset.flexus.synced_sweep"
note = "A whole-note sweep locked to the song, wide."
styles = ["house", "pop"]
roles = ["creative"]
[preset.values]
"div" = 3
"fb" = 0.6
"mix" = 0.5
"out" = -4.5
"spread" = 90
"sync" = 1

[[preset]]
key = "preset.flexus.drum_bus"
note = "A gentle half-note sweep across a drum loop."
styles = ["house", "rock"]
roles = ["drums"]
[preset.values]
"depth" = 2.5
"div" = 2
"fb" = 0.3
"mix" = 0.35
"out" = -5.2
"sync" = 1

[[preset]]
key = "preset.flexus.envelope"
note = "The sweep follows how loud the input is: each hit swooshes."
styles = ["house", "film"]
roles = ["creative"]
[preset.values]
"fb" = 0.65
"mix" = 0.5
"mode" = 1
"out" = 0.5
"rel" = 250
"sens" = 24

[[preset]]
key = "preset.flexus.manual"
note = "A fixed comb at one position: automate it by hand."
styles = ["film"]
roles = ["creative"]
[preset.values]
"fb" = 0.8
"manual" = 0.3
"mix" = 0.5
"mode" = 2
"out" = -3.9

[[preset]]
key = "preset.flexus.house_filter_sweep"
note = "A two-bar sweep across a whole loop: the build of a house track."
styles = ["house"]
roles = ["bus"]
[preset.values]
"div" = 2
"fb" = 0.5
"mix" = 0.4
"out" = -3.1
"spread" = 60
"sync" = 1

[[preset]]
key = "preset.flexus.vocal_air"
note = "A light, fast shimmer that moves a voice without pulling it apart."
styles = ["pop", "rnb"]
roles = ["vocal"]
[preset.values]
"delay" = 0.8
"depth" = 1.5
"fb" = 0.2
"mix" = 0.25
"rate" = 0.5

[[preset]]
key = "preset.flexus.lofi_warble"
note = "Slow, shallow and dark: tape that drifts."
styles = ["lofi", "jazz"]
roles = ["creative"]
[preset.values]
"depth" = 2
"fb" = 0.15
"mix" = 0.35
"out" = -2.6
"rate" = 0.07
"shape" = 0

[[preset]]
key = "preset.flexus.trap_hat_swirl"
note = "Sixteenths of sweep on hats and percussion."
styles = ["trap"]
roles = ["drums"]
[preset.values]
"depth" = 2
"div" = 14
"fb" = 0.5
"mix" = 0.4
"out" = -6.2
"sync" = 1
