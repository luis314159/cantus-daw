roles = ["pluck"]
[preset.values]
"bass" = 0.4
"cab" = 4
"gain" = 0.6
"mid" = 0.3
"model" = 4
"out" = -12.4
"presence" = 0.6
"treble" = 0.6

[[preset]]
key = "preset.arca.dark_lead"
note = "The high-gain amp heard by a ribbon a hand back from the cone: thick and smooth."
