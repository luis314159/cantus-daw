# Arca amp: factory presets (ADR 0101). Names are locale keys (the unit's locale file).
# `cargo run --release -p cantus-ui --example preset_tool -- fit` sets the levels;
# the tests check every key, value, style and role (`preset_data`, `preset_render`).

[[preset]]
key = "preset.arca.clean_combo"
note = "The clean amp at a sweet low gain into its open-backed 1×12: the starting preset."
styles = ["rock", "worship"]
roles = ["pluck", "keys"]
[preset.values]
"cab" = 1
"gain" = 0.3
"model" = 1
"out" = 5.4

[[preset]]
key = "preset.arca.sparkle"
note = "The clean amp bright and low, two open 12s heard by a condenser a little back."
styles = ["pop", "worship"]
roles = ["pluck"]
[preset.values]
"bass" = 0.45
"cab" = 2
"gain" = 0.2
"mic" = 2
"micdist" = 8
"micpos" = 0.2
"model" = 1
"out" = 12.5
"treble" = 0.7

[[preset]]
key = "preset.arca.edge_of_breakup"
note = "The clean amp pushed until it just starts to break up as you dig in."
styles = ["rock", "jazz"]
roles = ["lead", "pluck"]
[preset.values]
"cab" = 1
"gain" = 0.6
"micpos" = 0.35
"model" = 1
"out" = -3.8

[[preset]]
key = "preset.arca.british_crunch"
note = "The crunch amp at rhythm gain into a vintage 4×12, a dynamic close on the cone."
styles = ["rock"]
roles = ["pluck"]
[preset.values]
"cab" = 3
"gain" = 0.65
"micdist" = 2.5
"model" = 2
"out" = -12
"treble" = 0.62

[[preset]]
key = "preset.arca.full_stack"
note = "The crunch amp flat out, the middle up, a ribbon on the vintage 4×12."
styles = ["rock"]
roles = ["lead"]
[preset.values]
"cab" = 3
"gain" = 0.95
"mic" = 1
"micpos" = 0.4
"mid" = 0.7
"model" = 2
"out" = -14.8

[[preset]]
key = "preset.arca.chime_jangle"
note = "The chiming amp clean and bright into two open 12s, a ribbon in front."
styles = ["pop", "rock"]
roles = ["pluck"]
[preset.values]
"cab" = 2
"gain" = 0.45
"mic" = 1
"model" = 3
"out" = -6
"treble" = 0.7

[[preset]]
key = "preset.arca.chime_drive"
note = "The chiming amp driven until its class A compresses and sings."
styles = ["rock"]
roles = ["lead"]
[preset.values]
"cab" = 2
"gain" = 0.85
"model" = 3
"out" = -5.7

[[preset]]
key = "preset.arca.modern_lead"
note = "The high-gain amp for solos, the middle a little scooped, a dynamic toward the edge of a modern 4×12."
styles = ["rock", "film"]
roles = ["lead"]
[preset.values]
"cab" = 4
"gain" = 0.75
"micdist" = 4
"micpos" = 0.55
"mid" = 0.4
"model" = 4
"out" = -12.4

[[preset]]
key = "preset.arca.tight_rhythm"
note = "The high-gain amp tight for riffs: less bass, a scooped middle, the presence up."
