# Fluctus volume shaper: factory presets (ADR 0101). Names are locale keys (the unit's locale file).
# `cargo run --release -p cantus-ui --example preset_tool -- fit` sets the levels;
# the tests check every key, value, style and role (`preset_data`, `preset_render`).

[[preset]]
key = "preset.fluctus.pump_quarters"
note = "The four-on-the-floor pump: down on each beat, back up by the off-beat."
styles = ["house", "pop"]
roles = ["bus"]
[preset.values]
"depth" = 1
"div" = 8
"out" = 1
"p0.on" = 1
"p0.s" = 0
"p0.t" = -0.6
"p0.x" = 0
"p0.y" = 0
"p1.on" = 1
"p1.s" = 2
"p1.t" = 0
"p1.x" = 0.5
"p1.y" = 1
"smooth" = 2

