# Porta gate: Factory presets (ADR 0101). Names are locale keys. `preset_tool -- fit` sets the levels;
# the tests check every key, value, style and role (`preset_data`, `preset_render`).

[[preset]]
key = "preset.gate.kick"
note = "A kick mic closed between hits, keyed under 150 Hz."
styles = ["rock"]
roles = ["drums"]
[preset.values]
"att" = 0.5
"hold" = 40
"hyst" = 6
"look" = 2
"lpf" = 150
"range" = 40
"rel" = 120
"thr" = -30

