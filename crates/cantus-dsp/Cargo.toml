[package]
name = "cantus-dsp"
description = "Cantus DAW — allocation-free DSP primitives: oscillators, envelopes, filters, instruments."
license = "MPL-2.0"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Pure-Rust transcendentals: the same bits on every machine (src/math.rs).
libm.workspace = true

[dev-dependencies]
hound.workspace = true

[features]
# Development only, never in a distributed build: model 6's onset constants read from
# `CANTUS_M6` (pulsus_measured_onset.rs), for the fitting cycles.
tune = []
