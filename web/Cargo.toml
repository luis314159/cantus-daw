# The Cantus website (cantusdaw.com): a Yew single-page app compiled to WebAssembly.
# Its own workspace — it is not part of the DAW's build (`docs/adr/0034-website.md`).
[workspace]

[package]
name = "cantus-web"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "cantusdaw.com — the landing page, manuals and downloads."

[features]
# The build-time pre-renderer (`src/prerender.rs`): a native run of this same program that
# writes every route's HTML into dist/ after `trunk build` (round 39, P1-1). The page in the
# browser never has it.
ssr = ["yew/ssr", "dep:futures"]

[dependencies]
yew = { version = "0.21", features = ["csr"] }
futures = { version = "0.3", optional = true, default-features = false, features = ["executor"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
gloo-timers = "0.3"
# Already in the build through Yew: the release check awaits `fetch` (shelf.rs).
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Response", "MediaQueryList", "DomTokenList", "HtmlInputElement", "HtmlAudioElement", "HtmlMediaElement", "HtmlElement", "Navigator", "Element", "HtmlElement", "Storage",
  "History", "Location", "HtmlAnchorElement", "MouseEvent", "PopStateEvent", "ScrollRestoration", "ScrollToOptions", "ScrollBehavior",
  "AudioContext", "AudioContextState", "AudioDestinationNode", "AudioNode", "AudioParam", "AudioBuffer",
  "AudioBufferSourceNode", "OscillatorNode", "OscillatorType", "GainNode", "BiquadFilterNode",
  "BiquadFilterType", "DynamicsCompressorNode", "AudioScheduledSourceNode",
] }

# build.rs reads the latest release's facts (assets/release.json, written by
# tools/release_json.py in the site workflow) into constants: no request at run time.
[build-dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

