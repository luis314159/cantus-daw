    <meta name="description" content="Cantus is a free, open-source digital audio workstation written in Rust: arrangement, piano roll, channel rack, a mixer, instruments and effects of its own. No account, no subscription, no telemetry." />
    <meta name="theme-color" content="#120d0a" />
    <script>
      /* day or night before the first paint: the saved choice, else the system's */
      (function () {
        var t = null;
        try { t = localStorage.getItem("cantus-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
