<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Each page's own head: `trunk build` leaves the home's, the pre-renderer (src/prerender.rs,
         src/head.rs) writes every page's between these markers. -->
    <!--page-head--><title>Cantus™ — a free, open-source DAW</title>
    <meta name="description" content="Cantus is a free, open-source DAW written in Rust: arrangement, piano roll, channel rack, a mixer, instruments and effects of its own, and a recording mode that bakes the song so only your take is live. Windows and Linux, macOS in preview. No account, no subscription, no telemetry." />
    <link rel="canonical" href="https://cantusdaw.com/" />
    <link rel="alternate" type="application/atom+xml" title="Cantus releases" href="/releases.xml" />
    <!--/page-head-->
    <meta name="theme-color" content="#0a1234" />
    <script>
      /* the home in the visitor's language: "/" opens "/es/" for one who chose Spanish, or whose
         browser speaks it and who never chose (src/lang.rs) — before anything is drawn */
      (function () {
        if (location.pathname !== "/") return;
        var l = null;
        try { l = localStorage.getItem("cantus-lang"); } catch (e) {}
        if (l === "es" || (l === null && /^es(-|$)/i.test(navigator.language || ""))) location.replace("/es/" + location.hash);
      })();
      /* day or night before the first paint: the saved choice, else the system's */
      (function () {
        var t = null;
        try { t = localStorage.getItem("cantus-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link data-trunk rel="copy-file" href="assets/favicon.svg" />
    <link data-trunk rel="copy-file" href="assets/favicon-32.png" />
    <link data-trunk rel="copy-file" href="assets/apple-touch-icon.png" />
