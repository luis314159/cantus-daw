# Untracked, per builder worktree (round 28): three builders share a 31 GB machine.
[build]
jobs = 3

[env]
# C: is nearly full: temporary files (the linker's too) go to F:.
TMP = { value = 'F:\projects\daw-r28\tmp', force = true }
TEMP = { value = 'F:\projects\daw-r28\tmp', force = true }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
